<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FASKA Invaria 2 · Lernlandschaft</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<script>p5.disableFriendlyErrors=true;</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.3/p5.min.js"></script>
<style>
:root {
  --blue:#3da6da; --red:#bd182a; --orange:#e25e2b; --green:#44a735; --yellow:#ffce05;
  --bg:#fefcf7; --bg2:#f8f4eb; --text:#2d2412; --text2:#6b5e48; --card:#fff;
  --border:#e8e0d0; --shadow:0 2px 12px rgba(0,0,0,0.06);
  --radius:18px; --radius-sm:12px;
  --font:'Inter',system-ui,sans-serif; --mono:'JetBrains Mono',monospace;
  --nav-h:56px; --cycle-h:52px;
}
.dark{--bg:#1a1814;--bg2:#22201a;--text:#e8e2d4;--text2:#9e9680;--card:#282520;--border:#3a3428;--shadow:0 2px 16px rgba(0,0,0,0.3)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;font:14px/1.5 var(--font);color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased}
canvas{display:block;position:fixed;inset:var(--nav-h) 0 var(--cycle-h) 0;z-index:1}

/* Header */
.hdr{position:fixed;z-index:20;top:0;left:0;right:0;height:var(--nav-h);display:flex;align-items:center;justify-content:space-between;padding:0 20px;background:var(--card);border-bottom:1px solid var(--border);box-shadow:var(--shadow)}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--text);font-weight:800;font-size:1.05rem;letter-spacing:-0.02em}
.logo svg{width:32px;height:auto}
.hdr-r{display:flex;gap:6px;align-items:center}
.hdr-btn{padding:7px 16px;border-radius:24px;border:1.5px solid var(--border);background:var(--card);color:var(--text);cursor:pointer;font:600 12.5px var(--font);transition:all 0.2s;white-space:nowrap}
.hdr-btn:hover{border-color:var(--blue);color:var(--blue)}
.hdr-btn.active{background:var(--blue);color:#fff;border-color:var(--blue)}
.theme-btn{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--border);background:var(--card);cursor:pointer;font-size:1.2rem;display:flex;align-items:center;justify-content:center;transition:all 0.2s}
.theme-btn:hover{border-color:var(--yellow)}

/* Bottom cycle nav */
.cyc{position:fixed;z-index:20;bottom:0;left:0;right:0;height:var(--cycle-h);display:flex;align-items:center;justify-content:center;gap:3px;padding:0 12px;background:var(--card);border-top:1px solid var(--border);box-shadow:0 -2px 12px rgba(0,0,0,0.04)}
.cyc-btn{padding:7px 16px;border-radius:22px;border:none;background:transparent;color:var(--text2);cursor:pointer;font:600 12px var(--font);transition:all 0.25s;white-space:nowrap}
.cyc-btn:hover{color:var(--text)}
.cyc-btn.active{background:var(--green);color:#fff}

/* Detail panel */
.pnl{position:fixed;z-index:30;right:12px;top:72px;width:400px;max-width:calc(100vw-24px);max-height:calc(100vh-140px);background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:0 16px 48px rgba(0,0,0,0.12);overflow-y:auto;transform:translateX(120%);transition:transform 0.35s cubic-bezier(0.22,1,0.36,1)}
.pnl.open{transform:translateX(0)}
.pnl-in{padding:22px}
.pnl h2{font-size:1.2rem;font-weight:700;margin-bottom:2px;letter-spacing:-0.01em}
.pnl .meta{font-size:0.72rem;color:var(--text2);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:18px}
.pnl .sec{margin-bottom:16px}
.pnl .sec h3{font-size:0.65rem;text-transform:uppercase;letter-spacing:0.1em;color:var(--green);margin-bottom:6px}
.pnl .sec p,.pnl .sec li{font-size:0.83rem;line-height:1.6}
.pnl .close{position:sticky;top:0;float:right;width:32px;height:32px;border-radius:50%;border:1.5px solid var(--border);background:var(--card);color:var(--text2);cursor:pointer;font-size:1.1rem;display:flex;align-items:center;justify-content:center;z-index:2;transition:all 0.2s}
.pnl .close:hover{border-color:var(--red);color:var(--red)}

/* Review cards */
.rc{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 14px;margin-bottom:8px;transition:all 0.2s}
.rc:hover{border-color:var(--blue)}
.rc-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:6px}
.rc-title{font-weight:700;font-size:0.82rem}
.rc-status{font-size:0.65rem;padding:3px 9px;border-radius:10px;font-weight:700;white-space:nowrap}
.rc-st0{background:rgba(0,0,0,0.05);color:var(--text2)}
.rc-st1{background:rgba(68,167,53,0.12);color:var(--green)}
.rc-st2{background:rgba(226,94,43,0.12);color:var(--orange)}
.rc-st3{background:rgba(189,24,42,0.1);color:var(--red)}
.dark .rc-st0{background:rgba(255,255,255,0.06)}
.rc-evid{font-size:0.73rem;color:var(--text2);margin:3px 0}
.rc-bound{font-size:0.7rem;color:var(--text2);font-style:italic;margin:3px 0}
.rc-acts{display:flex;gap:5px;margin-top:8px}
.rc-btn{padding:4px 10px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--text2);cursor:pointer;font:600 10.5px var(--font);transition:all 0.2s}
.rc-btn:hover{color:var(--text)}
.rc-btn.ok:hover{background:rgba(68,167,53,0.1);border-color:var(--green);color:var(--green)}
.rc-btn.lim:hover{background:rgba(226,94,43,0.1);border-color:var(--orange);color:var(--orange)}
.rc-btn.no:hover{background:rgba(189,24,42,0.1);border-color:var(--red);color:var(--red)}

/* Possibilities */
.poss{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
.pc{background:var(--bg2);border:2px solid transparent;border-radius:var(--radius-sm);padding:12px;cursor:pointer;transition:all 0.2s}
.pc:hover{border-color:var(--blue)}
.pc.sel{border-color:var(--green);background:rgba(68,167,53,0.06)}
.pc .pc-i{font-size:1.3rem;margin-bottom:3px}
.pc .pc-t{font-weight:700;font-size:0.78rem}
.pc .pc-d{font-size:0.68rem;color:var(--text2);margin-top:1px}

/* Timeline */
.tl{position:relative;padding-left:20px;margin:6px 0}
.tl::before{content:'';position:absolute;left:6px;top:0;bottom:0;width:2px;background:var(--border)}
.tl-i{position:relative;padding:5px 0 12px}
.tl-d{position:absolute;left:-17px;top:9px;width:8px;height:8px;border-radius:50%;background:var(--green)}
.tl-date{font-size:0.66rem;color:var(--text2);font-weight:600}
.tl-text{font-size:0.78rem;margin-top:1px}

/* Overlay for Team/Arch */
.ovl{position:fixed;z-index:50;inset:0;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity 0.3s}
.ovl.on{opacity:1;pointer-events:all}
.ovl-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:28px;max-width:640px;width:94%;max-height:82vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,0.2)}
.ovl-card h2{font-size:1.2rem;font-weight:700;margin-bottom:14px}
.ovl-card .close{float:right;width:30px;height:30px;border-radius:50%;border:1.5px solid var(--border);background:var(--card);cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center;transition:all 0.2s}
.ovl-card .close:hover{border-color:var(--red);color:var(--red)}

/* Toast */
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 22px;border-radius:24px;font-size:0.85rem;font-weight:700;z-index:60;opacity:0;transition:all 0.3s;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-6px)}

/* Tooltip */
.tt{position:fixed;z-index:25;pointer-events:none;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px 14px;font-size:0.8rem;box-shadow:var(--shadow);opacity:0;transition:opacity 0.2s;max-width:200px}
.tt.on{opacity:1}
.tt .ttn{font-weight:700}
.tt .ttd{font-size:0.7rem;color:var(--text2);margin-top:2px}

/* Legend */
.leg{position:fixed;z-index:15;left:14px;top:76px;display:flex;flex-direction:column;gap:5px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 14px;box-shadow:var(--shadow)}
.leg-i{display:flex;align-items:center;gap:7px;font-size:0.68rem;color:var(--text2);font-weight:500}
.leg-d{width:7px;height:7px;border-radius:50%;flex-shrink:0}

@media(max-width:640px){
  .pnl{right:4px;top:64px;width:calc(100vw-8px);border-radius:var(--radius-sm)}
  .cyc-btn{padding:5px 8px;font-size:10px}
  .hdr{padding:0 10px}
  .hdr-btn{padding:5px 10px;font-size:10px}
  .logo{font-size:0.85rem}
  .leg{display:none}
  .poss{grid-template-columns:1fr}
}
</style>
</head>
<body>

<header class="hdr">
  <a class="logo" onclick="resetAll()" style="cursor:pointer">
    <img src="faska-logo-official.svg" alt="FASKA" style="width:32px;height:auto" onerror="this.style.display='none';this.nextElementSibling.style.display='inline'">
    <span style="display:none">🌱</span>
    FASKA Invaria 2
  </a>
  <div class="hdr-r">
    <button class="hdr-btn active" onclick="world('garden')">🌱 Garten</button>
    <button class="hdr-btn" onclick="world('team')">👥 Team</button>
    <button class="hdr-btn" onclick="world('arch')">🏗️ Architektur</button>
    <button class="hdr-btn" onclick="exportJSON()">📥</button>
    <button class="theme-btn" onclick="toggleTheme()" id="themeBtn">🌙</button>
  </div>
</header>

<div class="cyc" id="cycleNav">
  <button class="cyc-btn active" data-step="encounter">Begegnung</button>
  <button class="cyc-btn" data-step="trace">Spur</button>
  <button class="cyc-btn" data-step="meaning">Bedeutung</button>
  <button class="cyc-btn" data-step="possibility">Möglichkeit</button>
  <button class="cyc-btn" data-step="action">Handlung</button>
  <button class="cyc-btn" data-step="return">neue Begegnung</button>
</div>

<div class="leg">
  <div class="leg-i"><span class="leg-d" style="background:var(--blue)"></span>Mathematik</div>
  <div class="leg-i"><span class="leg-d" style="background:var(--red)"></span>Sprache</div>
  <div class="leg-i"><span class="leg-d" style="background:var(--orange)"></span>Problemlösen</div>
  <div class="leg-i"><span class="leg-d" style="background:var(--green)"></span>Soziales</div>
  <div class="leg-i"><span class="leg-d" style="background:var(--yellow)"></span>Kreativität</div>
</div>

<div class="pnl" id="panel"><div class="pnl-in" id="panelContent"></div></div>
<div class="tt" id="tt"><div class="ttn" id="ttn"></div><div class="ttd" id="ttd"></div></div>
<div class="ovl" id="overlayTeam"><div class="ovl-card" id="overlayTeamContent"></div></div>
<div class="ovl" id="overlayArch"><div class="ovl-card" id="overlayArchContent"></div></div>
<div class="toast" id="toast"></div>

<script>
// ═══════════════ DATA ═══════════════
const D={
  traces:[
    {id:'t1',date:'Okt 2025',title:'Türme stapeln',text:'Lena stapelt Holzklötze zu Türmen, vergleicht Höhen („meiner ist höher"). Erstes dokumentiertes Vergleichen ohne Messwerkzeug.'},
    {id:'t2',date:'Dez 2025',title:'Backen',text:'„Wir brauchen mehr Mehl, der Teig ist zu klebrig." — Mengenvergleich mit Handlungsfolge.'},
    {id:'t3',date:'14. März 2026',title:'Stallbox passt nicht',text:'Lena baut einen Pferdestall. Die Box ist zu klein. Sie vergleicht mit der Hand, verlängert die Wand, testet dreimal. „Diese hier ist größer, weil das braune Pferd dicker ist."'},
    {id:'t4',date:'28. März 2026',title:'Bandmaß-Messung',text:'Nimmt Bandmaß: „Das Pferd ist sieben, der Stall muss acht sein." Erste Messwerkzeug-Nutzung mit Zahlbegriff.'},
  ],
  plants:[
    {id:'math',x:0.28,y:0.36,r:48,color:[61,166,218],name:'Größen & Messen',domain:'Mathematik',phase:'bloom',traceIds:['t1','t3','t4']},
    {id:'lang',x:0.54,y:0.30,r:40,color:[189,24,42],name:'Sprache & Ausdruck',domain:'Sprache',phase:'growing',traceIds:['t3']},
    {id:'social',x:0.74,y:0.44,r:34,color:[68,167,53],name:'Miteinander',domain:'Soziales',phase:'seedling',traceIds:[]},
    {id:'creative',x:0.60,y:0.60,r:36,color:[255,206,5],name:'Bauen & Gestalten',domain:'Kreativität',phase:'budding',traceIds:['t3']},
    {id:'problem',x:0.38,y:0.62,r:44,color:[226,94,43],name:'Problemlösen',domain:'Überfachlich',phase:'bloom',traceIds:['t1','t2','t3']},
  ],
  cons:[[0,1,0.6],[0,4,0.9],[1,3,0.4],[4,2,0.5],[3,0,0.3]],
  reviews:[
    {id:'r1',title:'Mathematik: Größen & Messen',text:'Die Veränderung der Boxengröße als Anschlussstelle zu „Größen und Messen" prüfen.',evidence:'Direkter Längenvergleich, iteratives Anpassen (3×), vergleichende Aussage.',boundary:'Kein Messwerkzeug. Kein Zahlbegriff zum Zeitpunkt der Beobachtung.',status:'unpr',ref:'math'},
    {id:'r2',title:'Sprache: Begründen & Beschreiben',text:'Sprachlich komplexe Begründung (Komparativ + Kausalanschluss) im Handlungskontext.',evidence:'„Diese hier ist größer, weil das braune Pferd dicker ist." — vollständiger Kausalsatz.',boundary:'Einzeläußerung. Kein schriftlicher Ausdruck.',status:'unpr',ref:'lang'},
    {id:'r3',title:'⚠️ Identitätszuschreibung (KI-Fehler)',text:'„Lena zeigt ausgeprägtes mathematisch-analytisches Talent."',evidence:'Keine ausreichende Evidenz. Eine Lernspur ≠ stabile Eigenschaft.',boundary:'Dies ist eine Identitätszuschreibung, keine Spurenauswertung. Das System darf keine Eigenschaften zuschreiben.',status:'unpr',ref:null},
    {id:'r4',title:'Problemlösen: Iteration & Selbstkorrektur',text:'Dreimaliger Zyklus Testen→Anpassen→Prüfen. Selbstkorrektur ohne Hilfe.',evidence:'Drei dokumentierte Durchläufe. Später erweiterte Messhandlung mit Bandmaß.',boundary:'Kein Beleg für Übertragbarkeit außerhalb von Bausituationen.',status:'unpr',ref:'problem'},
  ],
  possibilities:[
    {id:'p1',icon:'📏',title:'Alltagsobjekte vergleichen',desc:'Gefäße, Schnüre, Naturmaterialien'},
    {id:'p2',icon:'💬',title:'Nachbefragung',desc:'„Was war schwierig?" — Kind-Perspektive einholen'},
    {id:'p3',icon:'✏️',title:'Bauplan zeichnen',desc:'Konstruktion sprachlich dokumentieren'},
    {id:'p4',icon:'📐',title:'Arbeitsblatt',desc:'„Welches Tier passt in welche Box?"'},
    {id:'p5',icon:'🤝',title:'Partnerarbeit',desc:'Gemeinsam planen und bauen'},
    {id:'p6',icon:'🌱',title:'Nicht intervenieren',desc:'Lernspur wirken lassen'},
  ],
  team:[
    {name:'Frau Meier',role:'Klassenlehrerin',text:'„Lena konzentriert sich stark auf Größenvergleiche — wachsendes Interesse am Messen. Arbeitet selten in Partnerarbeit."',status:'Autorisiert',color:'var(--green)'},
    {name:'Herr Yılmaz',role:'Kunstpädagoge',text:'„Die dreimalige Wiederholung ist ästhetische Suche. Die zweite Box ist symmetrisch zur ersten — es geht um ‚richtig aussehen\', nicht nur um Passform."',status:'Alternativ',color:'var(--orange)'},
    {name:'Herr Schneider',role:'Schulsozialarbeit',text:'„Kein mathematisches, sondern ein soziales Phänomen: Lena gewährt anderen keinen Zugang zum Baumaterial. Unter welchen sozialen Bedingungen lernt sie?"',status:'Widerspruch',color:'var(--red)'},
  ]
};

// ═══════════════ STATE ═══════════════
let hovered=null, selected=null, activeStep='encounter', selPoss=null, dark=false;

// ═══════════════ P5 GARDEN ═══════════════
const sketch=p=>{
  const particles=[],N=80;
  const cycleNodes=[{l:'Begegnung',x:.15,y:.18},{l:'Spur',x:.35,y:.13},{l:'Bedeutung',x:.55,y:.13},{l:'Möglichkeit',x:.74,y:.20},{l:'Handlung',x:.80,y:.44},{l:'neue Begegnung',x:.70,y:.68}];
  for(let i=0;i<N;i++)particles.push({t:i/N,sp:.00015+Math.random()*.00035,sz:1.5+Math.random()*3,off:(Math.random()-.5)*.05});
  function cr(p0,p1,p2,p3,t){const t2=t*t,t3=t2*t;return{x:.5*((2*p1.x)+(-p0.x+p2.x)*t+(2*p0.x-5*p1.x+4*p2.x-p3.x)*t2+(-p0.x+3*p1.x-3*p2.x+p3.x)*t3),y:.5*((2*p1.y)+(-p0.y+p2.y)*t+(2*p0.y-5*p1.y+4*p2.y-p3.y)*t2+(-p0.y+3*p1.y-3*p2.y+p3.y)*t3)}}
  function cPos(t){const n=cycleNodes.length,seg=t*n,i=Math.floor(seg)%n,f=seg-Math.floor(seg);return cr(cycleNodes[(i-1+n)%n],cycleNodes[i],cycleNodes[(i+1)%n],cycleNodes[(i+2)%n],f)}

  p.setup=()=>{
    p.createCanvas(1,1);p.pixelDensity(1);p.colorMode(p.HSB,360,100,100,100);resizeCanvas();
  };

  function resizeCanvas(){const w=window.innerWidth,h=window.innerHeight-108;p.resizeCanvas(w,h)}

  p.draw=()=>{
    const W=p.width,H=p.height;
    const bg=dark?[40,10,12]:[42,12,97];
    p.background(bg);

    // Soil gradient
    for(let i=0;i<H;i++){const a=p.map(i,0,H,1,0.5);p.stroke(bg[0],bg[1],bg[2]*a);p.line(0,i,W,i)}

    // Connections
    D.cons.forEach(c=>{
      const a=D.plants[c[0]],b=D.plants[c[1]];if(!a||!b)return;
      const fx=a.x*W,fy=a.y*H, tx=b.x*W,ty=b.y*H;
      p.stroke(38,15,70,0.12+c[2]*0.1);p.strokeWeight(1+c[2]);p.drawingContext.setLineDash([6,10]);
      p.noFill();p.beginShape();p.vertex(fx,fy);
      const mx=(fx+tx)/2,my=(fy+ty)/2-35;
      p.quadraticVertex(mx,my,tx,ty);p.endShape();
      p.drawingContext.setLineDash([]);
      p.fill(42,70,80,0.12+0.08*p.sin(p.millis()*0.001+c[2]*3));p.noStroke();p.circle(mx,my,3);
    });

    // Plants
    D.plants.forEach(pl=>{
      const px=pl.x*W,py=pl.y*H,r=pl.r;
      const pulse=1+0.03*p.sin(p.millis()*0.002+pl.x*8);
      const sel=pl===selected,hov=pl===hovered;

      // Roots
      p.stroke(28,20,50,0.15);p.strokeWeight(1);
      for(let i=0;i<4;i++){const a=-0.35+i*0.22,len=r*(0.5+i*0.18);p.line(px,py+r*0.25,px+p.cos(a)*len,py+r*0.25+len*0.7)}

      // Stem
      const sh=r*(1+0.5*(pl.phase==='seedling'?0.3:pl.phase==='growing'?0.6:pl.phase==='budding'?0.8:1));
      p.stroke(pl.color[0],35,65);p.strokeWeight(sel?5:3.5);
      p.noFill();p.beginShape();p.vertex(px,py+r*0.2);p.quadraticVertex(px-4,py-sh*0.5,px,py-sh);p.endShape();

      // Leaves
      const lc=pl.phase==='seedling'?2:pl.phase==='growing'?3:pl.phase==='budding'?4:6;
      for(let i=0;i<lc;i++){const ly=py-sh*(0.28+i*0.14),side=i%2===0?1:-1;p.fill(120,50,60,0.35);p.noStroke();p.ellipse(px+side*15,ly,20,9)}
      // Bloom
      const br=r*(pl.phase==='bloom'?0.5:pl.phase==='budding'?0.28:pl.phase==='growing'?0.18:0.1),by=py-sh;
      const glowR=br*2.8*pulse;
      for(let g=3;g>0;g--){p.fill(pl.color[0],50,90,0.08/g);p.noStroke();p.circle(px,by,glowR*g)}
      const pc=pl.phase==='bloom'?8:5;
      for(let i=0;i<pc;i++){const a=p.TWO_PI*i/pc+p.millis()*0.0004,pr=br*0.7*pulse;p.fill(pl.color[0],60,85,sel?1:0.8);p.noStroke();p.circle(px+p.cos(a)*pr*0.55,by+p.sin(a)*pr*0.55,pr*0.8)}
      p.fill(42,10,95);p.noStroke();p.circle(px,by,br*0.3);

      // Label
      p.textAlign(p.CENTER);p.textSize(sel?11.5:10.5);
      p.fill(sel?'#fff':hov?'rgba(255,255,255,0.85)':'rgba(255,255,255,0.5)');
      p.text(pl.name,px,py+r+18);

      // Selection ring
      if(sel){p.stroke(pl.color[0],80,90);p.strokeWeight(2.5);p.noFill();p.drawingContext.setLineDash([4,4]);p.circle(px,py,r+14);p.drawingContext.setLineDash([])}
    });

    // Cycle path
    p.stroke(42,60,85,0.15);p.strokeWeight(2.5);p.noFill();p.drawingContext.setLineDash([6,14]);
    p.beginShape();
    for(let i=0;i<=1;i+=0.004){const pos=cPos(i);p.vertex(pos.x*W,pos.y*H)}p.endShape();
    p.drawingContext.setLineDash([]);

    // Cycle particles
    particles.forEach(pt=>{pt.t=(pt.t+pt.sp)%1;const pos=cPos(pt.t);const px=pos.x*W+pt.off*W,py=pos.y*H+pt.off*H;
      p.fill(42,80,95,0.2+0.3*p.sin(p.millis()*0.003+pt.t*15));p.noStroke();p.circle(px,py,pt.sz)});

    // Cycle nodes
    cycleNodes.forEach((n,i)=>{const px=n.x*W,py=n.y*H;const isA=activeStep===['encounter','trace','meaning','possibility','action','return'][i];
      p.fill(isA?42:0,isA?80:0,isA?90:60,isA?1:0.25);p.noStroke();p.circle(px,py,isA?6:4);
      p.textAlign(p.CENTER);p.textSize(isA?10.5:9);p.fill(isA?'#fff':'rgba(255,255,255,0.4)');p.text(n.l,px,py-12)});
  };

  p.mouseMoved=()=>{
    const W=p.width,H=p.height;let f=null;
    D.plants.forEach(pl=>{const dx=p.mouseX-pl.x*W,dy=p.mouseY-pl.y*H;if(p.sqrt(dx*dx+dy*dy)<pl.r+16)f=pl});
    if(f!==hovered){hovered=f;p.cursor(f?'pointer':'default');
      const tt=document.getElementById('tt');if(f){document.getElementById('ttn').textContent=f.name;document.getElementById('ttd').textContent=f.domain+' · '+f.traceIds.length+' Lernspur'+(f.traceIds.length!==1?'en':'');tt.style.left=(p.mouseX+18)+'px';tt.style.top=(p.mouseY-50)+'px';tt.classList.add('on')}else tt.classList.remove('on')}
  };

  p.mouseClicked=()=>{if(hovered){selected=hovered;openDetail(hovered)}}
  p.windowResized=resizeCanvas;
};

new p5(sketch);

// ═══════════════ PANEL ═══════════════
function openDetail(plant){
  const traces=D.traces.filter(t=>plant.traceIds.includes(t.id));
  const reviews=D.reviews.filter(r=>r.ref===plant.id||(r.ref===null&&r.id==='r3'));
  const pc=document.getElementById('panelContent');
  pc.innerHTML=`
    <button class="close" onclick="closePnl()">×</button>
    <h2>${plant.name}</h2><div class="meta">${plant.domain} · ${traces.length} Lernspuren · ${plant.phase==='bloom'?'🌼 blühend':plant.phase==='budding'?'🌷 knospend':'🌱 wachsend'}</div>
    <div class="sec"><h3>📋 Lernspuren</h3><div class="tl">${traces.map(t=>`<div class="tl-i"><div class="tl-d"></div><div class="tl-date">${t.date} · ${t.title}</div><div class="tl-text">${t.text}</div></div>`).join('')}</div></div>
    ${traces.length===0?`<p style="color:var(--text2);font-style:italic;font-size:0.8rem">Noch keine Lernspuren — hier ist Platz für Entwicklung.</p>`:''}
    <div class="sec"><h3>🔗 Bezüge prüfen</h3>${reviews.map(r=>`
      <div class="rc" id="review-${r.id}">
        <div class="rc-head"><span class="rc-title">${r.title}</span><span class="rc-status rc-st${r.status==='ok'?1:r.status==='lim'?2:r.status==='no'?3:0}" id="status-${r.id}">${r.status==='ok'?'✓ Tragfähig':r.status==='lim'?'⚠ Begrenzt':r.status==='no'?'✗ Abgelehnt':'ungeprüft'}</span></div>
        <div class="rc-evid"><strong>Beleg:</strong> ${r.evidence}</div>
        <div class="rc-bound">⚠️ ${r.boundary}</div>
        <div class="rc-acts">
          <button class="rc-btn ok" onclick="review('${r.id}','ok')">✓ Tragfähig</button>
          <button class="rc-btn lim" onclick="review('${r.id}','lim')">⚠ Begrenzt</button>
          <button class="rc-btn no" onclick="review('${r.id}','no')">✗ Ablehnen</button>
        </div>
      </div>`).join('')}</div>
    <div class="sec"><h3>🌿 Möglichkeiten</h3><div class="poss">${D.possibilities.map(p=>`<div class="pc" onclick="pick('${p.id}',this)"><div class="pc-i">${p.icon}</div><div class="pc-t">${p.title}</div><div class="pc-d">${p.desc}</div></div>`).join('')}</div></div>
    <div id="selSec" style="display:none;margin-top:8px;padding:12px;background:var(--bg2);border-radius:var(--radius-sm)"><strong style="color:var(--green)">✅ Ausgewählt:</strong> <span id="selName"></span><br><button class="rc-btn ok" style="margin-top:6px" onclick="prepare()">Handlung vorbereiten →</button></div>
  `;
  document.getElementById('panel').classList.add('open');
}
function closePnl(){document.getElementById('panel').classList.remove('open');selected=null}
function review(id,st){D.reviews.find(r=>r.id===id).status=st;const el=document.getElementById('status-'+id);el.textContent=st==='ok'?'✓ Tragfähig':st==='lim'?'⚠ Begrenzt':'✗ Abgelehnt';el.className='rc-status rc-st'+(st==='ok'?1:st==='lim'?2:3);toast('Prüfung: '+el.textContent)}
function pick(id,el){document.querySelectorAll('.pc').forEach(c=>c.classList.remove('sel'));el.classList.add('sel');selPoss=id;document.getElementById('selSec').style.display='block';document.getElementById('selName').textContent=D.possibilities.find(p=>p.id===id).title}
function prepare(){toast('✅ Handlung vorbereitet. Team-Benachrichtigung → Umgebungsänderung → neue Begegnung → neue Lernspur.');activeStep='action';updateCyc()}

// ═══════════════ NAVIGATION ═══════════════
function updateCyc(){document.querySelectorAll('.cyc-btn').forEach(b=>b.classList.remove('active'));document.querySelector(`[data-step="${activeStep}"]`)?.classList.add('active')}
document.getElementById('cycleNav').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;activeStep=b.dataset.step;updateCyc();const idx=['encounter','trace','meaning','possibility','action','return'].indexOf(activeStep);if(idx>=0&&D.plants[idx]){selected=D.plants[idx];openDetail(D.plants[idx])}});

function world(w){
  closePnl();document.getElementById('overlayTeam').classList.remove('on');document.getElementById('overlayArch').classList.remove('on');
  document.querySelectorAll('.hdr-btn').forEach(b=>b.classList.remove('active'));
  if(w==='garden')document.querySelector('.hdr-btn:nth-child(1)').classList.add('active');
  else if(w==='team'){document.querySelector('.hdr-btn:nth-child(2)').classList.add('active');openTeam()}
  else{document.querySelector('.hdr-btn:nth-child(3)').classList.add('active');openArch()}
}

function openTeam(){
  const c=document.getElementById('overlayTeamContent');
  c.innerHTML=`<button class="close" onclick="world('garden')">×</button><h2>👥 Team-Perspektiven</h2><p style="color:var(--text2);font-size:0.85rem;margin-bottom:14px">Alle Perspektiven bleiben sichtbar — keine wird harmonisiert.</p>${D.team.map(t=>`<div style="background:var(--bg2);border-left:3px solid ${t.color};border-radius:0 12px 12px 0;padding:14px;margin-bottom:10px"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;font-weight:700;font-size:0.85rem"><span>${t.name} · ${t.role}</span><span style="font-size:0.7rem;color:${t.color}">${t.status}</span></div><p style="font-size:0.82rem;line-height:1.6;color:var(--text)">${t.text}</p></div>`).join('')}<h3 style="font-size:0.7rem;text-transform:uppercase;letter-spacing:0.08em;color:var(--green);margin:18px 0 8px">🔐 Zweckgebundene Freigaben</h3><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:0.78rem">${[['Elternansicht','Entwicklung ohne Bezugsnorm','var(--green)'],['Fördergutachten','Nur Mathe-Bezug','var(--text2)'],['Kollegiale Fallberatung','Alle Bezüge + Perspektiven','var(--green)'],['Bildungsplan-Nachweis','Nur autorisierte Bezüge','var(--text2)']].map(f=>`<div style="background:var(--bg2);padding:10px;border-radius:10px;border-left:2px solid ${f[2]}"><strong>${f[0]}</strong><br><span style="color:var(--text2)">${f[1]}</span></div>`).join('')}</div>`;
  document.getElementById('overlayTeam').classList.add('on');
}

function openArch(){
  const c=document.getElementById('overlayArchContent');
  c.innerHTML=`<button class="close" onclick="world('garden')">×</button><h2>🏗️ Architektur</h2>
    <div style="border:2px solid var(--blue);border-radius:14px;padding:14px;margin:8px 0;text-align:center;background:rgba(61,166,218,0.05)"><strong>Werdegefüge</strong><p style="color:var(--text2);font-size:0.75rem;margin-top:4px">Verfassung · Organe · Spuren · Muster · Werkstattkompositionen</p></div>
    <div style="text-align:center;color:var(--text2);margin:3px 0;font-weight:700;font-size:0.8rem">↓</div>
    <div style="border:2px solid var(--red);border-radius:14px;padding:14px;margin:8px 0;text-align:center;background:rgba(189,24,42,0.04)"><strong>Erfahrungslandschaftskern</strong><p style="color:var(--red);font-weight:700;font-size:0.8rem;margin-top:4px">Begegnung → Spur → Bedeutung → Möglichkeit → Handlung → neue Begegnung</p></div>
    <div style="text-align:center;color:var(--text2);margin:3px 0;font-weight:700;font-size:0.8rem">↓ Pädagogik</div>
    <div style="border:2px solid var(--orange);border-radius:14px;padding:14px;margin:8px 0;text-align:center;background:rgba(226,94,43,0.04)"><strong>FASKA-Domänenprofil</strong><p style="color:var(--text2);font-size:0.75rem;margin-top:4px">Lernlandschaft · Bildungsplanbezüge · Team-Prüfung</p></div>
    <div style="text-align:center;color:var(--text2);margin:3px 0;font-weight:700;font-size:0.8rem">↓</div>
    <div style="border:2px solid var(--green);border-radius:14px;padding:14px;margin:8px 0;text-align:center;background:rgba(68,167,53,0.04)"><strong>FASKA Invaria 2</strong><p style="color:var(--text2);font-size:0.75rem;margin-top:4px">Lena · Frau Meier · Team · Garten-Projektion</p></div>
    <h3 style="font-size:0.7rem;text-transform:uppercase;letter-spacing:0.08em;color:var(--green);margin:18px 0 8px">🤖 KI-Rolle</h3>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;font-size:0.78rem">
      <div style="background:rgba(68,167,53,0.06);padding:10px;border-radius:10px;border-left:2px solid var(--green)">✅ „Diese Beobachtung könnte mit Größenvergleich verbunden sein."</div>
      <div style="background:rgba(189,24,42,0.04);padding:10px;border-radius:10px;border-left:2px solid var(--red)">🚫 „Dieses Kind besitzt Kompetenz X."</div>
    </div>
    <h3 style="font-size:0.7rem;text-transform:uppercase;letter-spacing:0.08em;color:var(--green);margin:18px 0 8px">🔑 Fraktalkohärenz</h3>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:0.75rem">
      ${[['🏫','Lernlandschaft','Nichtwissen → Erfahrung → Verstehen'],['🎮','Spielwelt','Unbekannt → Erkundung → Entscheidung'],['✍️','Werkstatt','Idee → Entwurf → Überarbeitung'],['🧠','Denkraum','Frage → Verbindung → Einsicht']].map(f=>`<div style="background:var(--bg2);padding:10px;border-radius:10px"><strong>${f[0]} ${f[1]}</strong><br><span style="color:var(--text2)">${f[2]}</span></div>`).join('')}
    </div>`;
  document.getElementById('overlayArch').classList.add('on');
}

// ═══════════════ UTILS ═══════════════
function resetAll(){closePnl();activeStep='encounter';updateCyc();selected=null;document.getElementById('overlayTeam').classList.remove('on');document.getElementById('overlayArch').classList.remove('on')}
function toggleTheme(){dark=!dark;document.documentElement.classList.toggle('dark',dark);document.getElementById('themeBtn').textContent=dark?'☀️':'🌙'}
function exportJSON(){const d={time:new Date().toISOString(),traces:D.traces,reviews:D.reviews.map(r=>({...r})),team:D.team};const b=new Blob([JSON.stringify(d,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='faska-invaria-2-'+new Date().toISOString().slice(0,10)+'.json';a.click();toast('📥 Exportiert')}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500)}

updateCyc();
</script>
