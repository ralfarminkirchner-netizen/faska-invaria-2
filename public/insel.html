<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>FASKA · Die Geltungsinseln — Der Lena-Fall</title>
<link rel="icon" href="faska-logo-official.svg">
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<style>
:root{
  --blau:#3da6da; --rot:#bd182a; --orange:#e25e2b; --gruen:#44a735; --gelb:#ffce05;
  --creme:#fefcf7; --creme2:#f5efe1; --tinte:#2b2314; --tinte2:#6e6149;
  --rand:#e7dfcd; --karte:#fff;
  --schatten:0 2px 16px rgba(60,45,20,.10); --gross:0 26px 70px rgba(50,38,16,.24);
  --r:20px; --rs:13px;
  --font:'Inter',-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --kopf:60px;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#cfe6f2;color:var(--tinte);
  font:15px/1.55 var(--font);-webkit-font-smoothing:antialiased}
canvas{display:block;touch-action:none}
button{font-family:inherit}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:rgba(120,105,75,.3);border-radius:8px}

#welt{position:fixed;inset:0;z-index:1}
#schilder{position:fixed;inset:0;z-index:2;pointer-events:none;overflow:hidden}

/* ── Beschriftung ─────────────────────────────────────────────────
   Nadel am Objekt, Fähnchen in einer Spalte rechts, Leine dazwischen.
   Zwölf Fähnchen direkt über den Objekten überdecken die Inseln, die
   sie erklären sollen. In der Spalte, nach Bildhöhe sortiert, kreuzen
   sich die Leinen nicht — und der Turm bleibt frei.               */
#leinen{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
#leinen path{fill:none;stroke:rgba(43,35,20,.3);stroke-width:1.4}

.nadel{position:absolute;width:10px;height:10px;border-radius:50%;pointer-events:none;
  transform:translate(-50%,-50%);opacity:var(--o,1);
  box-shadow:0 0 0 2.5px rgba(255,253,247,.95),0 1px 5px rgba(50,38,16,.32);transition:opacity .22s}
.schild{position:absolute;transform:translateY(-50%);white-space:nowrap;pointer-events:auto;
  cursor:pointer;padding:4px 12px 5px;border-radius:12px;opacity:var(--o,1);
  background:rgba(255,253,247,.92);backdrop-filter:blur(6px);
  border:1px solid rgba(231,223,205,.95);border-left:3px solid var(--pf,var(--rand));
  box-shadow:0 2px 9px rgba(50,38,16,.12);
  transition:opacity .22s,background .18s,border-color .18s}
.schild:hover{background:#fff;box-shadow:0 4px 16px rgba(50,38,16,.2)}
.schild .n{font:800 12.4px var(--font);letter-spacing:-.012em;color:#241c0d}
.schild .u{font:600 9.4px var(--font);color:#6b5d43;margin-top:1px}
.schild.fern,.nadel.fern{opacity:calc(var(--o,1) * .26)}
.schild.wach{background:#fff;border-color:var(--blau)}
@media(max-width:900px){ .schild .u{display:none} .schild{padding:3px 9px 4px} .schild .n{font-size:11.2px} }

/* ── Ebenen-Tafeln in der Luft ── */
.etage{position:absolute;transform:translate(-50%,-50%);pointer-events:auto;cursor:pointer;
  font:800 10.5px var(--font);letter-spacing:.14em;text-transform:uppercase;
  padding:6px 13px;border-radius:15px;background:rgba(255,253,247,.9);
  backdrop-filter:blur(8px);box-shadow:0 2px 12px rgba(50,38,16,.15);white-space:nowrap;
  border:1px solid rgba(231,223,205,.9);border-left-width:4px;transition:transform .18s}
.etage:hover{transform:translate(-50%,-50%) scale(1.035)}
.etage small{display:block;font:600 8.6px var(--font);letter-spacing:.04em;text-transform:none;
  color:var(--tinte2);margin-top:1px}
.etage.leer{background:rgba(255,242,242,.93);border:1.5px dashed var(--rot);color:var(--rot)}

/* ── Kopfleiste ── */
.kopf{position:fixed;z-index:30;top:0;left:0;right:0;height:var(--kopf);display:flex;
  align-items:center;justify-content:space-between;gap:12px;padding:0 15px;
  background:rgba(255,253,247,.8);backdrop-filter:blur(16px) saturate(1.4);
  border-bottom:1px solid rgba(231,223,205,.9)}
.marke{display:flex;align-items:center;gap:10px;cursor:pointer;min-width:0}
.marke img{width:30px;height:30px;flex-shrink:0}
.marke>div{min-width:0}
.marke b{display:block;font-weight:800;font-size:.97rem;letter-spacing:-.02em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.marke i{display:block;font-style:normal;font-size:.59rem;font-weight:700;color:var(--tinte2);
  letter-spacing:.12em;text-transform:uppercase;white-space:nowrap}
.kopf-r{display:flex;align-items:center;gap:5px;flex-shrink:0}
.kbtn{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:22px;
  border:1.5px solid var(--rand);background:rgba(255,255,255,.9);color:var(--tinte);cursor:pointer;
  font:700 11.5px var(--font);white-space:nowrap;transition:transform .16s,border-color .18s,color .18s}
.kbtn:hover{border-color:var(--blau);color:var(--blau);transform:translateY(-1px)}
.kbtn:focus-visible{outline:2px solid var(--blau);outline-offset:2px}

/* ── Umsichts-Schalter ── */
.umsicht{position:fixed;z-index:26;left:50%;transform:translateX(-50%);bottom:20px;
  display:flex;align-items:center;gap:13px;padding:10px 15px;border-radius:26px;
  background:rgba(255,253,247,.9);backdrop-filter:blur(16px) saturate(1.4);
  border:1px solid var(--rand);box-shadow:var(--gross)}
.ende{font:800 11px var(--font);letter-spacing:.09em;text-transform:uppercase;color:var(--tinte2);
  cursor:pointer;user-select:none;white-space:nowrap;transition:color .2s}
.ende.an{color:var(--blau)}
.ende small{display:block;font-size:8.4px;font-weight:600;letter-spacing:.04em;text-transform:none;
  opacity:.75;margin-top:1px}
.schiene{position:relative;width:186px;height:30px;flex-shrink:0}
.schiene::before{content:'';position:absolute;left:0;right:0;top:13px;height:4px;border-radius:3px;
  background:linear-gradient(90deg,var(--blau),var(--gruen))}
.knopf{position:absolute;top:1px;width:28px;height:28px;border-radius:50%;background:#fff;
  border:2.5px solid var(--blau);box-shadow:0 3px 10px rgba(50,38,16,.24);transform:translateX(-50%);
  pointer-events:none;display:flex;align-items:center;justify-content:center;font-size:12px}
.schiene input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;margin:0}

/* ── Stockwerks-Leiste ── */
.leiste{position:fixed;z-index:20;left:15px;top:calc(var(--kopf) + 14px);width:212px;
  background:rgba(255,253,247,.88);backdrop-filter:blur(14px);border:1px solid var(--rand);
  border-radius:var(--r);box-shadow:var(--schatten);overflow:hidden}
.leiste-k{padding:11px 14px 7px;font:800 9.4px var(--font);letter-spacing:.14em;
  text-transform:uppercase;color:var(--tinte2)}
.st{display:flex;align-items:center;gap:9px;padding:8px 14px;cursor:pointer;transition:background .18s}
.st:hover{background:rgba(245,239,225,.9)}
.st .z{width:23px;height:23px;border-radius:7px;display:flex;align-items:center;justify-content:center;
  font:800 11px var(--font);color:#fff;flex-shrink:0}
.st .t{min-width:0}
.st .t b{display:block;font:800 11.4px var(--font)}
.st .t span{display:block;font-size:9.3px;line-height:1.35;color:var(--tinte2);font-weight:600}
.st.leer{background:repeating-linear-gradient(135deg,transparent 0 7px,rgba(189,24,42,.055) 7px 14px)}
.st.leer .z{background:transparent;border:1.5px dashed var(--rot);color:var(--rot)}
.st.leer .t b{color:var(--rot)}
.leiste-f{padding:8px 14px 11px;border-top:1px solid var(--rand);font-size:9.3px;line-height:1.6;color:var(--tinte2)}
.leiste-f b{color:var(--gruen)}

/* ── Tafel ── */
.tafel{position:fixed;z-index:40;right:0;top:0;bottom:0;width:min(468px,100vw);
  background:var(--karte);border-left:1px solid var(--rand);box-shadow:-20px 0 60px rgba(50,38,16,.18);
  overflow-y:auto;transform:translateX(102%);transition:transform .46s cubic-bezier(.22,1,.36,1);
  overscroll-behavior:contain}
.tafel.auf{transform:none}
.tafel-in{padding:20px 24px 60px}
.zu{position:sticky;top:0;float:right;width:34px;height:34px;border-radius:50%;border:1.5px solid var(--rand);
  background:#fff;color:var(--tinte2);cursor:pointer;font-size:16px;line-height:1;display:flex;
  align-items:center;justify-content:center;z-index:3}
.zu:hover{border-color:var(--rot);color:var(--rot)}
.tafel h2{font-size:1.32rem;font-weight:800;letter-spacing:-.02em;margin:8px 0 4px;line-height:1.25}
.marker{display:inline-block;padding:4px 11px;border-radius:13px;color:#fff;font:800 9.4px var(--font);
  letter-spacing:.1em;text-transform:uppercase}
.zeile{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0 18px}
.pille{display:inline-block;padding:3px 10px;border-radius:11px;font:700 9.4px var(--font);
  letter-spacing:.06em;text-transform:uppercase;background:var(--creme2);color:var(--tinte2)}
.p-blau{background:rgba(61,166,218,.14);color:#1f74a1} .p-gelb{background:rgba(255,206,5,.22);color:#8a6d00}
.p-orange{background:rgba(226,94,43,.14);color:#b5441b} .p-rot{background:rgba(189,24,42,.11);color:var(--rot)}
.p-gruen{background:rgba(68,167,53,.15);color:#2e7823}
.datum{font-size:11px;color:var(--tinte2);font-weight:600}
.blk{margin-bottom:20px}
.blk>h3{font:800 9.4px var(--font);letter-spacing:.14em;text-transform:uppercase;color:var(--tinte2);
  margin-bottom:9px;display:flex;align-items:center;gap:7px}
.blk>h3::after{content:'';flex:1;height:1px;background:var(--rand)}
.zitat{font-size:.94rem;line-height:1.62;font-weight:500;padding:14px 16px;border-radius:var(--rs);
  background:var(--creme2);border-left:4px solid var(--blau)}
.z-gelb{border-left-color:var(--gelb)} .z-rot{border-left-color:var(--rot)}
.z-gruen{border-left-color:var(--gruen)} .z-orange{border-left-color:var(--orange)}
.paar{display:flex;gap:10px;font-size:.83rem;margin:6px 0;align-items:flex-start}
.paar .k{color:var(--tinte2);font-weight:700;min-width:116px;flex-shrink:0;font-size:.755rem}
.balken{height:7px;border-radius:4px;background:var(--creme2);overflow:hidden;margin:5px 0 10px}
.balken i{display:block;height:100%;border-radius:4px}
.liste{list-style:none}
.liste li{font-size:.84rem;line-height:1.6;padding-left:16px;position:relative;margin-bottom:6px}
.liste li::before{content:'';position:absolute;left:2px;top:.62em;width:5px;height:5px;border-radius:50%;
  background:var(--tinte2);opacity:.45}
.k2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.kachel{border-radius:var(--rs);padding:12px 14px;font-size:.8rem;line-height:1.55}
.kachel h5{font:800 8.8px var(--font);letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px}
.k-blau{background:rgba(61,166,218,.09)} .k-blau h5{color:#1f74a1}
.k-gelb{background:rgba(255,206,5,.16)} .k-gelb h5{color:#8a6d00}
.k-rot{background:rgba(189,24,42,.07)} .k-rot h5{color:var(--rot)}
.k-gruen{background:rgba(68,167,53,.1)} .k-gruen h5{color:#2e7823}
.k-orange{background:rgba(226,94,43,.09)} .k-orange h5{color:#b5441b}
.k-leer{background:transparent;border:1.5px dashed var(--rand);color:var(--tinte2);font-style:italic}
.herkunft{margin-top:16px;padding:12px 14px;border-radius:var(--rs);background:var(--creme2);
  border:1px dashed var(--rand);font-size:.72rem;line-height:1.62;color:var(--tinte2)}
.herkunft b{color:var(--tinte)}
.mono{font-family:var(--mono);font-size:.68rem;color:var(--tinte2);overflow-wrap:anywhere}
.tbtn{display:block;width:100%;padding:12px;border-radius:var(--rs);border:none;background:var(--blau);
  color:#fff;font:800 12.5px var(--font);cursor:pointer;margin-top:10px;transition:filter .18s,transform .18s}
.tbtn:hover{filter:brightness(1.07);transform:translateY(-1px)}
.tbtn.gruen{background:var(--gruen)} .tbtn.rot{background:var(--rot)}

.waage{display:grid;grid-template-columns:1fr 58px 1fr;margin:12px 0 4px;align-items:stretch}
.waage .seite{border-radius:var(--rs);padding:13px;font-size:.81rem;line-height:1.6}
.waage h4{font:800 8.8px var(--font);letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px}
.w-b{background:rgba(61,166,218,.1);border:1.5px solid rgba(61,166,218,.3)} .w-b h4{color:#1f74a1}
.w-d{background:rgba(255,206,5,.17);border:1.5px solid rgba(255,206,5,.45)} .w-d h4{color:#8a6d00}
.w-m{position:relative;margin:0 6px;border-radius:11px;overflow:hidden;
  background:linear-gradient(180deg,rgba(61,166,218,.07),rgba(255,206,5,.13))}
.w-m::before{content:'';position:absolute;inset:-40px 0;
  background:repeating-linear-gradient(180deg,transparent 0 13px,rgba(61,166,218,.2) 13px 15px);
  animation:fluss 2.6s linear infinite}
@keyframes fluss{to{transform:translateY(28px)}}
.w-z{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:2;background:#fff;
  border:1.5px solid var(--blau);color:var(--blau);border-radius:11px;padding:6px 4px;
  font:800 8.2px var(--font);text-align:center;line-height:1.4}
.spannung{display:grid;grid-template-columns:1fr 52px 1fr;gap:7px;margin:12px 0}
.blase{border-radius:var(--rs);padding:13px;font-size:.8rem;line-height:1.55}
.blase b{display:block;font-size:.74rem;margin-bottom:5px}
.blase em{display:block;font-style:normal;margin-top:7px;font-weight:700;font-size:.82rem}
.b-l{background:rgba(61,166,218,.1);border:1.5px solid rgba(61,166,218,.34);animation:nL 3.4s ease-in-out infinite}
.b-r{background:rgba(189,24,42,.08);border:1.5px solid rgba(189,24,42,.3);animation:nR 3.4s ease-in-out infinite}
@keyframes nL{0%,100%{transform:none}50%{transform:translateX(4px)}}
@keyframes nR{0%,100%{transform:none}50%{transform:translateX(-4px)}}
.riss{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.riss span{font-size:1.25rem;animation:bl 1.3s ease-in-out infinite}
@keyframes bl{0%,100%{opacity:.3;transform:scale(.9)}50%{opacity:1;transform:scale(1.14)}}
.riss small{font:800 7.4px var(--font);letter-spacing:.06em;text-transform:uppercase;color:var(--rot);
  text-align:center;line-height:1.45}

.ueber{position:fixed;z-index:60;inset:0;background:rgba(40,32,16,.5);backdrop-filter:blur(3px);
  display:flex;align-items:center;justify-content:center;padding:18px;opacity:0;pointer-events:none;
  transition:opacity .3s}
.ueber.auf{opacity:1;pointer-events:all}
.ukarte{background:var(--karte);border-radius:var(--r);padding:26px 28px;max-width:720px;width:100%;
  max-height:86vh;overflow-y:auto;box-shadow:var(--gross)}
.ukarte h2{font-size:1.28rem;font-weight:800;letter-spacing:-.02em;margin-bottom:5px}
.ukarte .unter{font-size:.85rem;color:var(--tinte2);margin-bottom:18px;line-height:1.6}
.ukarte .zu{position:static;float:right}
.leiter{display:flex;flex-direction:column-reverse;gap:6px;margin:14px 0}
.sprosse{display:flex;align-items:center;gap:12px;padding:11px 15px;border-radius:var(--rs);
  background:var(--creme2);border-left:5px solid var(--rand)}
.sprosse .s{font:800 11.4px var(--font);letter-spacing:.05em;text-transform:uppercase;min-width:104px}
.sprosse .w{font-size:.78rem;color:var(--tinte2);line-height:1.5}
.sprosse.zu-{background:repeating-linear-gradient(135deg,transparent 0 8px,rgba(189,24,42,.06) 8px 16px);
  border:1.5px dashed var(--rot);border-left:5px dashed var(--rot)}
.sprosse.zu- .s{color:var(--rot)}
.pruef{width:100%;min-height:76px;border-radius:var(--rs);border:2px solid var(--rand);
  background:var(--creme2);padding:13px 15px;font:500 .94rem var(--font);color:var(--tinte);resize:vertical}
.pruef:focus{outline:none;border-color:var(--blau)}
.urteil{margin-top:12px;border-radius:var(--rs);padding:15px 17px;font-size:.85rem;line-height:1.6}
.u-frei{background:rgba(68,167,53,.1);border:1.5px solid rgba(68,167,53,.42)}
.u-stopp{background:rgba(189,24,42,.08);border:1.5px solid rgba(189,24,42,.42)}
.u-leer{background:var(--creme2);border:1.5px dashed var(--rand);color:var(--tinte2)}
.verstoss{background:#fff;border:1px solid var(--rand);border-left:4px solid var(--rot);border-radius:10px;
  padding:11px 13px;margin-top:9px;font-size:.79rem;line-height:1.55}
mark{background:rgba(189,24,42,.22);border-radius:3px;padding:0 3px;color:inherit}
.mbtn{padding:6px 12px;border-radius:9px;border:1px solid var(--rand);background:#fff;color:var(--tinte2);
  cursor:pointer;font:700 11px var(--font)}
.mbtn:hover{border-color:var(--blau);color:var(--blau)}

/* unten über dem Umsichts-Schalter — oben steht die leere Insel, und die
   ist das Erste, was man sehen soll */
.hinweis{position:fixed;z-index:70;bottom:80px;left:50%;transform:translateX(-50%) translateY(8px);
  background:var(--tinte);color:var(--creme);padding:11px 22px;border-radius:24px;
  font:700 12.4px var(--font);opacity:0;transition:all .3s;pointer-events:none;max-width:86vw;text-align:center}
.hinweis.auf{opacity:1;transform:translateX(-50%)}
.laden{position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;
  background:#dceaf3;transition:opacity .6s}
.laden.weg{opacity:0;pointer-events:none}
.laden div{text-align:center;font:700 13px var(--font);color:#5b6b74}
.laden b{display:block;font-size:1.1rem;color:#31424c;margin-bottom:6px;letter-spacing:-.02em}

@media(max-width:900px){ .leiste{width:186px;left:10px} .kbtn .txt{display:none} .kbtn{padding:8px 11px} }
@media(max-width:620px){
  .marke i{display:none} .marke b{font-size:.82rem}
  /* Schmal: die Leiter legt sich quer unter den Kopf und gibt die
     Bildfläche frei — hochkant stünde sie mitten im Turm. */
  .leiste{width:auto;left:8px;right:8px;display:flex}
  .leiste-k,.leiste-f{display:none}
  .st{flex:1;flex-direction:column;gap:3px;padding:7px 3px;text-align:center;min-width:0}
  .st .z{width:21px;height:21px}
  .st .t{width:100%} .st .t span{display:none}
  .st .t b{font-size:9.4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .umsicht{bottom:12px;gap:9px;padding:9px 12px} .schiene{width:112px} .ende small{display:none}
  .tafel{width:100vw} .hinweis{bottom:74px}
  .etage{font-size:9.4px;padding:5px 10px} .etage small{display:none}
}
@media(prefers-reduced-motion:reduce){ *{animation-duration:.001ms!important;transition-duration:.001ms!important} }
</style>
</head>
<body>

<div class="laden" id="laden"><div><b>Die Geltungsinseln</b>Der Lena-Fall wird gebaut …</div></div>

<header class="kopf">
  <div class="marke" onclick="allesZu()">
    <img src="faska-logo-official.svg" alt="FASKA" onerror="this.remove()">
    <div><b>Die Geltungsinseln</b><i>FASKA · der Lena-Fall</i></div>
  </div>
  <div class="kopf-r">
    <button class="kbtn" onclick="oeffneDecke()" title="Warum die oberste Insel leer ist">🔒 <span class="txt">Die Decke</span></button>
    <button class="kbtn" onclick="oeffnePruefung()" title="Aussagen gegen das Profil prüfen">🛡 <span class="txt">Prüfung</span></button>
    <button class="kbtn" onclick="oeffneLesehilfe()" title="Wie diese Inseln zu lesen sind">❓ <span class="txt">Lesehilfe</span></button>
  </div>
</header>

<div id="schilder"></div>
<div class="leiste" id="leiste"></div>

<div class="umsicht">
  <span class="ende an" id="endeSchnitt" onclick="fahreZu(0)">Schnitt<small>lesen</small></span>
  <div class="schiene"><input type="range" id="regler" min="0" max="1000" value="1000" aria-label="Umsicht"><div class="knopf" id="knopf">⛰</div></div>
  <span class="ende" id="endeLand" onclick="fahreZu(1)">Inseln<small>umsehen</small></span>
</div>

<div class="tafel" id="tafel"><div class="tafel-in" id="tafelIn"></div></div>
<div class="ueber" id="ueber"><div class="ukarte" id="ueberIn"></div></div>
<div class="hinweis" id="hinweis"></div>

<script>
'use strict';
/* ═══════════════════════════════════════════════════════════════════
   FASKA · DIE GELTUNGSINSELN
   Vier schwebende Inseln, eine je Geltungsstufe. Die oberste bleibt
   leer — nicht als Gestaltung, sondern weil claim_ceiling sie leer
   lässt. Echtes WebGL: Polar-Terrain mit Vertexfarben, Meer, Nebel,
   weiche Schatten.
   ═══════════════════════════════════════════════════════════════════ */

const F = { blau:0x3da6da, rot:0xbd182a, orange:0xe25e2b, gruen:0x44a735, gelb:0xffce05 };
const FH= { blau:'#3da6da', rot:'#bd182a', orange:'#e25e2b', gruen:'#44a735', gelb:'#ffce05' };
const SCHIEFER = 0x8d8a83, SCHIEFER_H = '#8d8a83';

/* ── Farbraum ──────────────────────────────────────────────────────
   Der Renderer gibt in sRGB aus (outputEncoding). Three r128 rechnet
   im Shader linear und konvertiert erst am Ende. Alle hier notierten
   Hex-Werte sind aber sRGB-Literale (die Logofarben eben). Ohne
   Umrechnung landen sie ungebremst im Linearraum und kommen zu hell
   und entsättigt heraus — daher genau einmal hier umrechnen. */
const SC = h => new THREE.Color(h).convertSRGBToLinear();
/* Mischen zweier sRGB-Literale, Ergebnis wieder als sRGB-Literal */
const mix = (a,b,t) => new THREE.Color(a).lerp(new THREE.Color(b), t).getHex();
const TYP_F = { appearance:F.blau, relation:F.gelb, potential:F.orange, transition:F.orange,
  coordination:F.rot, embodiment:F.gruen, orientation:F.gruen, renewal:F.gelb, dormancy:SCHIEFER };
const TYP_H = { appearance:FH.blau, relation:FH.gelb, potential:FH.orange, transition:FH.orange,
  coordination:FH.rot, embodiment:FH.gruen, orientation:FH.gruen, renewal:FH.gelb, dormancy:SCHIEFER_H };

const STUFEN = [
  { id:'erscheinung', name:'Erscheinung', hex:FH.blau,   farbe:F.blau,   frage:'Was tritt hervor?' },
  { id:'perspektiv',  name:'Perspektiv',  hex:FH.gelb,   farbe:F.gelb,   frage:'Wie wird es gelesen?' },
  { id:'epistemisch', name:'Epistemisch', hex:FH.orange, farbe:F.orange, frage:'Wofür steht das Team ein?' },
  { id:'handlung',    name:'Handlung',    hex:FH.rot,    farbe:F.rot,    frage:'Wer darf handeln?' }
];
const NR = { erscheinung:0, perspektiv:1, epistemisch:2, handlung:3 };

const SCHL = ['a1','a2','b1','b2','b3','b4','b5','bd','b6','b7','b8','kn'];
const TITEL = { a1:'Der Regalbau', a2:'Ein erster Bezug', b1:'Die Stallbox', b2:'Der KI-Vorschlag',
  b3:'Der Möglichkeitsraum', b4:'Der nächste Schritt', b5:'Die Teamsitzung', bd:'Die schlafende Knospe',
  b6:'Zollstock und Maßband', b7:'Die Ausrichtung', b8:'Die Futterraufe', kn:'Der Aussichtspunkt' };
const UNTER = { a1:'Mai · Kette A', a2:'Mai · Kette A', b1:'Juni · Kette B', b2:'Juni · Kette B',
  b3:'Juni · Kette B', b4:'Juni · Kette B', b5:'05.06. · Kette B', bd:'abgelehnt · bewahrt',
  b6:'06.06. · Kette B', b7:'07.06. · Kette B', b8:'18.06. · Kette B', kn:'Kette A + B' };

/* Platz auf der jeweiligen Insel. kette/unten/mitte stehen fest —
   Winkel und Radius rechnet jede Insel selbst aus (orteRechnen),
   sonst drängeln sich die sieben Perspektiv-Patterns übereinander,
   sobald die Objekte auf lesbare Größe wachsen. */
const ORT = {
  a1:{ kette:-1 },  a2:{ kette:-1 },
  b1:{ kette: 1 },  b2:{ kette: 1 },  b3:{ kette: 1 },  b4:{ kette: 1 },
  bd:{ kette: 1, unten:true },
  b5:{ kette: 1 },  b6:{ kette: 1 },  b7:{ kette: 1 },  b8:{ kette: 1 },
  kn:{ kette: 0, mitte:true }
};
const SKALA = 1.85;   /* Alle Pattern-Objekte — im Rohbau verschwanden sie neben den Inseln */

function orteRechnen(){
  const proInsel={};
  SCHL.forEach(k=>{ const i=NR[P[k].claim_ceiling]; (proInsel[i]=proInsel[i]||[]).push(k); });
  Object.keys(proInsel).forEach(si=>{
    const i=+si, alle=proInsel[si];
    const ring=alle.filter(k=>!ORT[k].mitte);
    /* Kette A zuerst, dann B: so spannen die goldenen Querkanten
       sichtbar über die Insel statt sich zu verknäueln. */
    ring.sort((x,y)=>ORT[x].kette-ORT[y].kette || SCHL.indexOf(x)-SCHL.indexOf(y));
    const n=ring.length;
    const rf=.30+Math.min(.34, n*.055);          /* mehr Patterns → weiter außen */
    const start=[-2.45,-1.75,-0.65,0][i]||0;      /* je Insel anders angesetzt */
    ring.forEach((k,j)=>{
      ORT[k].w = start + j/n*Math.PI*2;
      ORT[k].r = (ORT[k].unten? .70 : rf + ((j%2)? .05 : -.05));
    });
    alle.filter(k=>ORT[k].mitte).forEach(k=>{ ORT[k].w=0; ORT[k].r=0; });
  });
}

/* ── Weltmaße ──────────────────────────────────────────────────────
   Der senkrechte Abstand muss größer sein als der Felssockel der
   Insel darüber, sonst stecken die Inseln ineinander und man sieht
   von den Grasflächen nichts mehr. Sockeltiefe ≈ RADIUS·0.78.
     Lücke 52 > Sockel 33 · Lücke 46 > 23 · Lücke 42 > 12          */
const HOEHE = [0, 52, 98, 140];              /* Höhe je Insel */
const RADIUS= [50, 44, 31, 24];              /* Radius je Insel — nach oben wird der Platz knapper */
const VERSATZ=[[0,0],[17,-11],[-14,15],[6,-7]];  /* Versatz auf einer sanften Spirale */
/* Himmel: oben kühl, am Horizont warmes Creme — die Hausfarbe */
const HIMMEL_OBEN = 0xb7d7ee, HIMMEL_MITTE = 0xd9e9f2, HIMMEL_UNTEN = 0xfdf4e2;
const MEER_Y = -212;                         /* Wasser weit unten: alle vier Inseln schweben */
const MEER_R = 250;                          /* Lagune statt Weltmeer — sonst frisst der Horizont den Himmel */
const ZIEL_Y = 58;                           /* Kamera-Zielhöhe im Insel-Modus */

let DATEN=null, P={}, VON_ID={}, OBJ={}, KANTEN=[];
let szene, kamera, renderer, uhr, wurzel;
let gewaehlt=null, schwebt=null;
let morph=1, zielMorph=1;
/* nick flach halten: Höhe soll als Höhe lesbar bleiben, nicht als Draufsicht */
const START={ gier:-0.62, nick:0.27, dist:436 };
let bahn={...START}, zielBahn={...START};
let zoomBeruehrt=false;   /* sobald der Nutzer selbst zoomt, mischt sich die Automatik nicht mehr ein */
/* Der Turm misst vom Sockel der Basisinsel bis zur Torkrone rund 210
   Einheiten. Der Abstand folgt daraus, nicht aus einem Fixwert — sonst
   ragt er auf hohen, schmalen Schirmen in Kopf- und Fußleiste. */
function passendeDistanz(){
  const spanne=210, halbFov=36*Math.PI/360;
  let d=(spanne*.72)/Math.tan(halbFov);
  if(innerWidth<820) d*=1.2;            /* oben liegt dort die Querleiter */
  return klemme(d, 300, 680);
}
const strahl=new THREE.Raycaster(), maus=new THREE.Vector2();
let anklickbar=[], schilderEl={}, etagenEl=[];

/* ═══ Rauschen (deterministisch) ═══ */
function hsh(x,y){ let n=Math.sin(x*127.1+y*311.7)*43758.5453; return n-Math.floor(n); }
function glatt(t){ return t*t*(3-2*t); }
function rausch(x,y){
  const xi=Math.floor(x), yi=Math.floor(y), xf=x-xi, yf=y-yi;
  const a=hsh(xi,yi), b=hsh(xi+1,yi), c=hsh(xi,yi+1), d=hsh(xi+1,yi+1);
  const u=glatt(xf), v=glatt(yf);
  return (a*(1-u)+b*u)*(1-v) + (c*(1-u)+d*u)*v;
}
/* Höhe der Inseloberfläche an einer Stelle (Inselkoordinaten, r in 0..1) */
function gelaende(x,z,radius,saat,amp){
  const d=Math.hypot(x,z)/radius;
  if(d>=1) return 0;
  const f=Math.pow(1-d*d, 1.25);
  const n=rausch(x*.055+saat, z*.055+saat)*1 + rausch(x*.14+saat*3, z*.14+saat*3)*.35;
  return (n/1.35)*f*amp;
}

/* ═══ Inselgeometrie: Polargitter mit Rock nach unten ═══ */
function inselGeometrie(radius, amp, saat, kahl, stufe){
  const RINGE=26, SEKT=64, ROCK=9;
  const pos=[], col=[], idx=[];
  /* Erdtöne ausschließlich aus den fünf Logofarben gemischt: Gras aus
     Grün+Gelb, Sand aus Gelb+Creme, Fels aus Orange+Tinte. Dazu ein
     Hauch der eigenen Geltungsfarbe im Fels — so trägt jede Insel ihre
     Stufe auch als Farbe, nicht nur als Höhe. */
  const c_gras1=SC(mix(F.gruen, F.gelb, .34));
  const c_gras2=SC(mix(F.gruen, 0x2b2314, .30));
  const c_sand =SC(mix(F.gelb, 0xfefcf7, .64));
  const c_fels1=SC(mix(mix(mix(F.orange,0x2b2314,.42), stufe, .34), 0xd8c3a4, .18));
  const c_fels2=SC(mix(mix(mix(F.orange,0x2b2314,.60), stufe, .26), 0xd8c3a4, .10));
  const c_stein=SC(mix(0xe9e4d8, 0x2b2314, .30));   /* die leere Insel: Farbe entzogen */

  for(let i=0;i<=RINGE+ROCK;i++){
    for(let j=0;j<=SEKT;j++){
      const a=j/SEKT*Math.PI*2;
      let r,y,c;
      if(i<=RINGE){
        r = (i/RINGE)*radius;
        const x=Math.cos(a)*r, z=Math.sin(a)*r;
        y = gelaende(x,z,radius,saat,amp);
        const ufer = i/RINGE;
        if(kahl){ c = c_stein.clone().lerp(c_fels2, rausch(x*.2+saat,z*.2)*0.45); }
        else if(ufer>.9) c = c_sand.clone();
        else {
          const hoch=Math.min(1, y/(amp*.72));
          c = c_gras1.clone().lerp(c_gras2, hoch);
          if(ufer>.82) c.lerp(c_sand, (ufer-.82)/.08*.75);
        }
      }else{
        /* Rock: verjüngt sich nach unten zu einer Spitze */
        const t=(i-RINGE)/ROCK;
        const zack = .82 + .18*rausch(a*2.4+saat, t*3);
        r = radius*(1-Math.pow(t,.72))*zack;
        y = -Math.pow(t,.8)*radius*(kahl?.5:.78) - amp*.1;
        c = c_fels1.clone().lerp(c_fels2, t*.85 + rausch(a*3+saat,t*5)*.15);
      }
      pos.push(Math.cos(a)*r, y, Math.sin(a)*r);
      col.push(c.r,c.g,c.b);
    }
  }
  /* Wicklung: a=(Ring i,Sektor j), b=(i,j+1), c=(i+1,j), d=(i+1,j+1).
     Die Reihenfolge a,c,b hätte die Normalen nach UNTEN gedreht — dann
     schneidet FrontSide die ganze Grasfläche weg und man sieht nur noch
     von innen gegen den Felssockel. Deshalb a,b,c. */
  for(let i=0;i<RINGE+ROCK;i++){
    for(let j=0;j<SEKT;j++){
      const a=i*(SEKT+1)+j, b=a+1, c=a+(SEKT+1), d=c+1;
      idx.push(a,b,c, b,d,c);
    }
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('color',    new THREE.Float32BufferAttribute(col,3));
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}

/* Ein Verlauf auf 2×256 Pixeln, als Hintergrundtextur. encoding sagt
   dem Renderer, dass die Werte sRGB sind und dekodiert werden müssen. */
function himmelVerlauf(){
  const c=document.createElement('canvas'); c.width=2; c.height=256;
  const g=c.getContext('2d'), v=g.createLinearGradient(0,0,0,256);
  const h=n=>'#'+n.toString(16).padStart(6,'0');
  v.addColorStop(0, h(HIMMEL_OBEN)); v.addColorStop(.56, h(HIMMEL_MITTE));
  v.addColorStop(1, h(HIMMEL_UNTEN));
  g.fillStyle=v; g.fillRect(0,0,2,256);
  const t=new THREE.CanvasTexture(c);
  t.encoding=THREE.sRGBEncoding; t.magFilter=THREE.LinearFilter; t.minFilter=THREE.LinearFilter;
  return t;
}

/* ═══ Aufbau ═══ */
function bauen(){
  szene=new THREE.Scene();
  szene.background=himmelVerlauf();
  szene.fog=new THREE.Fog(SC(HIMMEL_MITTE), 190, 460);  /* Nebel mischt im Shader → linear */

  kamera=new THREE.PerspectiveCamera(36, innerWidth/innerHeight, 1, 3600);

  renderer=new THREE.WebGLRenderer({antialias:true, alpha:false});
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.setSize(innerWidth,innerHeight);
  renderer.shadowMap.enabled=true;
  renderer.shadowMap.type=THREE.PCFSoftShadowMap;
  renderer.outputEncoding=THREE.sRGBEncoding;
  renderer.toneMapping=THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure=1.08;
  renderer.domElement.id='welt';
  document.body.appendChild(renderer.domElement);

  uhr=new THREE.Clock();
  wurzel=new THREE.Group(); szene.add(wurzel);

  /* Licht */
  szene.add(new THREE.HemisphereLight(SC(0xdff0fb), SC(0x6b7f52), 0.72));
  const sonne=new THREE.DirectionalLight(SC(0xfff3d6), 1.5);
  sonne.position.set(-190,290,150);
  sonne.castShadow=true;
  sonne.shadow.mapSize.set(2048,2048);
  /* Der Schattenkasten muss den ganzen Turm fassen: Sockel −45 bis Torbogen +165 */
  const s=sonne.shadow.camera;
  s.left=-190; s.right=190; s.top=250; s.bottom=-150; s.near=30; s.far=900;
  sonne.shadow.bias=-0.0012; sonne.shadow.normalBias=0.7;
  szene.add(sonne);
  szene.add(new THREE.AmbientLight(SC(0xfff6e6), 0.22));

  orteRechnen();
  meerBauen();
  inselnBauen();
  objekteBauen();
  kantenBauen();
  bluetenstaub();
  himmelDeko();
}

/* ── Meer ── */
let meer;
function meerBauen(){
  /* Ring statt Ebene: rund, damit keine Kante im Bild steht, und mit
     genug Radialsegmenten, dass die Wellen etwas zu verschieben haben.
     Der Rand wird per Vertexfarbe zum Himmel hin ausgeblendet — sonst
     liegt eine harte Scheibenkante quer durchs Bild. */
  const g=new THREE.RingGeometry(.5, MEER_R, 84, 20);
  g.rotateX(-Math.PI/2);
  const pos=g.attributes.position, col=[], c=new THREE.Color();
  const tief=SC(0x2d7fae), flach=SC(0x74bcdc), luft=SC(HIMMEL_MITTE);
  for(let i=0;i<pos.count;i++){
    const d=Math.min(1, Math.hypot(pos.getX(i),pos.getZ(i))/MEER_R);
    c.copy(tief).lerp(flach, Math.pow(d,.8));
    if(d>.38) c.lerp(luft, Math.pow((d-.38)/.62, 1.25));
    col.push(c.r,c.g,c.b);
  }
  g.setAttribute('color', new THREE.Float32BufferAttribute(col,3));
  const m=new THREE.MeshStandardMaterial({ vertexColors:true, roughness:.32, metalness:.1,
    side:THREE.DoubleSide });
  meer=new THREE.Mesh(g,m);
  meer.position.y=MEER_Y; meer.receiveShadow=true;
  wurzel.add(meer);
  meer.userData.grund=g.attributes.position.array.slice();
}
function meerWellen(t){
  const p=meer.geometry.attributes.position, g=meer.userData.grund;
  for(let i=0;i<p.count;i++){
    const x=g[i*3], z=g[i*3+2];
    p.setY(i, Math.sin(x*.035+t*.9)*.75 + Math.sin(z*.028+t*.62)*.6 + Math.sin((x+z)*.017+t*1.2)*.4);
  }
  p.needsUpdate=true;
  meer.geometry.computeVertexNormals();
}

/* ── Die vier Inseln ── */
const inseln=[];
function inselnBauen(){
  STUFEN.forEach((st,i)=>{
    const leer = zaehle(st.id)===0;
    const amp = leer ? 2.2 : 11 - i*1.6;
    const g = inselGeometrie(RADIUS[i], amp, 11.7+i*4.3, leer, st.farbe);
    const mat = new THREE.MeshStandardMaterial({ vertexColors:true, roughness:.94, metalness:0,
      flatShading:true });
    const mesh=new THREE.Mesh(g,mat);
    mesh.position.set(VERSATZ[i][0], HOEHE[i], VERSATZ[i][1]);
    mesh.castShadow=true; mesh.receiveShadow=true;
    wurzel.add(mesh);

    const grp=new THREE.Group();
    grp.position.copy(mesh.position);
    wurzel.add(grp);
    inseln.push({ st, i, mesh, grp, radius:RADIUS[i], amp, saat:11.7+i*4.3, leer });

    if(leer) verschlosseneInsel(grp, RADIUS[i]);
  });
}

/* Die leere Insel bekommt ein Tor, das zu ist. */
let torRing=null, torSchloss=null;
function verschlosseneInsel(grp, radius){
  /* Das verschlossene Tor ist der Kernbeweis — es muss monumental
     sein, nicht ein Detail auf der kleinsten Insel. Deshalb ein
     eigener, hochskalierter Unterbau. */
  const tor=new THREE.Group(); tor.scale.setScalar(1.55); grp.add(tor);
  const stein=new THREE.MeshStandardMaterial({color:SC(mix(0xe9e4d8,0x2b2314,.16)), roughness:.92, flatShading:true});
  /* Steinkreis */
  for(let i=0;i<9;i++){
    const a=i/9*Math.PI*2;
    const h=5.5+((i*37)%10)/2.4;
    const q=new THREE.Mesh(new THREE.BoxGeometry(2.4,h,1.9), stein);
    q.position.set(Math.cos(a)*radius*.42, h/2+1.2, Math.sin(a)*radius*.42);
    q.rotation.y=-a; q.rotation.z=((i*53)%7-3)/60;
    q.castShadow=true; q.receiveShadow=true; tor.add(q);
  }
  /* Torbogen auf zwei Pfeilern */
  const bogen=new THREE.Mesh(new THREE.TorusGeometry(6.2,1.05,12,44,Math.PI), stein);
  bogen.position.y=10.5; bogen.castShadow=true; tor.add(bogen);
  [-6.2,6.2].forEach(x=>{
    const p=new THREE.Mesh(new THREE.CylinderGeometry(1.05,1.3,10.5,12), stein);
    p.position.set(x,5.25,0); p.castShadow=true; p.receiveShadow=true; tor.add(p);
    const kn=new THREE.Mesh(new THREE.BoxGeometry(3,.9,3), stein);
    kn.position.set(x,10.7,0); kn.castShadow=true; tor.add(kn);
  });
  /* Ein rotes Siegel im Tor — es bleibt zu */
  torRing=new THREE.Mesh(new THREE.TorusGeometry(4.1,.34,10,48),
    new THREE.MeshStandardMaterial({color:SC(F.rot), emissive:SC(F.rot), emissiveIntensity:.55, roughness:.5}));
  torRing.position.y=8.4; tor.add(torRing);
  torSchloss=new THREE.Mesh(new THREE.BoxGeometry(2.7,3.1,1),
    new THREE.MeshStandardMaterial({color:SC(F.rot), emissive:SC(F.rot), emissiveIntensity:.4, roughness:.55}));
  torSchloss.position.y=8.4; torSchloss.castShadow=true; tor.add(torSchloss);
  const buegel=new THREE.Mesh(new THREE.TorusGeometry(.95,.28,8,22,Math.PI),
    new THREE.MeshStandardMaterial({color:SC(0xd8d2c4), roughness:.5}));
  buegel.position.y=10.3; tor.add(buegel);
}

/* ═══ Pattern-Objekte ═══ */
function stelle(k){
  const o=ORT[k], p=P[k], i=NR[p.claim_ceiling], ins=inseln[i];
  const x=Math.cos(o.w)*o.r*ins.radius, z=Math.sin(o.w)*o.r*ins.radius;
  const y=gelaende(x,z,ins.radius,ins.saat,ins.amp);
  return { x, y:(o.unten? y-26 : y), z, ins };
}
function objekteBauen(){
  SCHL.forEach(k=>{
    const p=P[k], s=stelle(k), g=new THREE.Group();
    g.position.set(s.x,s.y,s.z);
    g.scale.setScalar(SKALA);
    s.ins.grp.add(g);
    const farbe=TYP_F[p.pattern_type];
    switch(p.pattern_type){
      case 'appearance':   baum(g,farbe,p.phenomenon.salience||.5, k==='b1'); break;
      case 'relation':     verbindung(g,farbe); break;
      case 'potential':    faecher(g,p); break;
      case 'transition':   puppe(g,farbe); break;
      case 'coordination': runde(g,p); break;
      case 'embodiment':   werkbank(g); break;
      case 'orientation':  nadel(g); break;
      case 'renewal':      bluete(g, k==='kn'); break;
      case 'dormancy':     knospe(g); break;
    }
    if(p.sealed_by==='human') siegel(g, F.gruen, 1);
    if(p.contested)          siegel(g, F.rot, -1);
    OBJ[k]={ k, grp:g, welt:new THREE.Vector3(), typ:p.pattern_type, insel:i_von(p) };
    g.traverse(o=>{ if(o.isMesh){ o.userData.k=k; anklickbar.push(o); } });
    /* Bauhöhe einmal messen — Schilder und Kanten hängen sich daran auf,
       statt an einem festen Zahlenwert, der beim Skalieren nicht mitgeht. */
    g.updateMatrixWorld(true);
    const bb=new THREE.Box3().setFromObject(g);
    OBJ[k].hoehe = Math.max(4, bb.max.y - (s.ins.grp.position.y + s.y));
  });
}
function i_von(p){ return NR[p.claim_ceiling]; }

const M = (c,r,e)=> new THREE.MeshStandardMaterial({color:SC(c), roughness:r==null?.85:r, flatShading:true,
  emissive: e?SC(c):0x000000, emissiveIntensity: e||0});
const RINDE=new THREE.MeshStandardMaterial({color:SC(0x7a5a3c), roughness:.95, flatShading:true});

function baum(g,farbe,sal,gross){
  const h=(gross?9:7)+sal*4;
  const st=new THREE.Mesh(new THREE.CylinderGeometry(.42,.72,h,7), RINDE);
  st.position.y=h/2; st.castShadow=true; g.add(st);
  const kr=new THREE.Group(); kr.position.y=h; g.add(kr);
  const n=gross?5:4;
  for(let i=0;i<n;i++){
    const r=2.6+ (i===0?1.5:0) + ((i*29)%9)/7;
    const b=new THREE.Mesh(new THREE.IcosahedronGeometry(r,0), M(farbe,.86));
    const a=i/n*Math.PI*2;

/* ═══ Kanten zwischen den Objekten ═══ */
function kantenBauen(){
  const roh=[];
  SCHL.forEach(k=>{
    const p=P[k];
    (p.provenance.parents||[]).forEach(id=>{ const q=VON_ID[id]; if(q) roh.push({von:q,nach:k,art:'herkunft'}); });
    (p.references||[]).forEach(id=>{ const q=VON_ID[id];
      if(q&&q!==k&&!roh.some(e=>e.von===q&&e.nach===k)) roh.push({von:q,nach:k,art:'bezug'}); });
  });
  const ausA = t => ORT[t].kette===-1;
  roh.forEach(e=>{
    e.quer = ausA(e.von)!==ausA(e.nach);
    const a=weltVon(e.von), b=weltVon(e.nach);
    const hoch=(e.art==='bezug'? -1 : 1);
    const m=a.clone().add(b).multiplyScalar(.5);
    m.y += hoch*(10+a.distanceTo(b)*.16);
    m.x += (b.z-a.z)*.06; m.z -= (b.x-a.x)*.06;
    const kurve=new THREE.CatmullRomCurve3([a, m, b]);
    const farbe = e.quer? F.gelb : (e.art==='bezug'? SCHIEFER : 0x7fa85e);
    const rohr=new THREE.Mesh(new THREE.TubeGeometry(kurve, 44, e.quer?.34:.2, 6, false),
      new THREE.MeshStandardMaterial({color:SC(farbe), emissive:SC(farbe),
        emissiveIntensity:e.quer?.5:.25, roughness:.6, transparent:true, opacity:e.quer?.95:.62}));
    wurzel.add(rohr);
    /* Wanderlichter auf der Kante */
    const lichter=[];
    const n=e.quer?4:2;
    for(let i=0;i<n;i++){
      const l=new THREE.Mesh(new THREE.SphereGeometry(e.quer?.52:.36,8,7),
        new THREE.MeshBasicMaterial({color:SC(farbe)}));
      l.userData.t=i/n; wurzel.add(l); lichter.push(l);
    }
    KANTEN.push({...e, kurve, rohr, lichter});
  });
}
function weltVon(k){
  const s=stelle(k), i=NR[P[k].claim_ceiling];
  /* Kanten setzen an der Krone an, nicht am Fuß */
  return new THREE.Vector3(s.x+VERSATZ[i][0], s.y+HOEHE[i]+(OBJ[k]?OBJ[k].hoehe*.78:10), s.z+VERSATZ[i][1]);

/* ═══ Kamera: Inseln ↔ Schnitt ═══ */
function kameraSetzen(){
  const t=morph;
  const ziel=new THREE.Vector3(0, mische(66, ZIEL_Y, t), 0);
  /* Schnitt: weit weg, frontal, fast orthografisch.
     Abstand 1265 ist kein freier Wert — bei fov 11.5 sind das
     2·1265·tan(5.75°) ≈ 255 sichtbare Einheiten, und der Turm ist
     rund 205 hoch. Näher dran wird oben oder unten abgeschnitten. */
  const gier = mische(0, bahn.gier, t);
  const nick = mische(0.05, bahn.nick, t);
  const dist = mische(1265, bahn.dist, t);
  kamera.fov = mische(11.5, 36, t);
  kamera.updateProjectionMatrix();
  /* Im Insel-Modus zielt die Kamera neben den Turm, damit rechts Platz
     für die Schilderspalte bleibt. Der Rechts-Vektor der Kamera ist bei
     dieser Bahn genau (cos gier, 0, −sin gier). */
  const seit = mische(0, innerWidth<820? 0 : 46, t);
  ziel.x += Math.cos(gier)*seit; ziel.z -= Math.sin(gier)*seit;
  /* Der Nebel muss mitfahren — sonst verschluckt er im Schnitt die
     ganze Welt (das war der Grund, warum dort nichts zu sehen war). */
  szene.fog.near = mische(880, 300, t);
  szene.fog.far  = mische(2900, 980, t);
  /* Der Schnitt ist der Lesemodus: Wolken treten dort fast ganz zurück */
  if(wolkenStoff) wolkenStoff.opacity = mische(.1, .75, t);
  kamera.position.set(
    ziel.x + Math.sin(gier)*Math.cos(nick)*dist,
    ziel.y + Math.sin(nick)*dist,
    ziel.z + Math.cos(gier)*Math.cos(nick)*dist
  );
  kamera.lookAt(ziel);
}
const mische=(a,b,t)=>a+(b-a)*t;
const glaette=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const klemme=(v,a,b)=>v<a?a:v>b?b:v;

/* ═══ Schleife ═══ */
function schleife(){
  requestAnimationFrame(schleife);
  const t=uhr.getElapsedTime();

  if(Math.abs(zielMorph-morph)>.0006){ morph+=(zielMorph-morph)*.075; reglerSpiegeln(); }
  else morph=zielMorph;
  bahn.gier += (zielBahn.gier-bahn.gier)*.1;
  bahn.nick += (zielBahn.nick-bahn.nick)*.1;
  bahn.dist += (zielBahn.dist-bahn.dist)*.1;
  kameraSetzen();

  meerWellen(t);

  /* Inseln atmen leicht */
  inseln.forEach((ins,i)=>{
    const y=HOEHE[i] + (i? Math.sin(t*.42+i*1.7)*.9 : 0);
    ins.mesh.position.y=y; ins.grp.position.y=y;
  });

  /* Objekte leben */
  SCHL.forEach(k=>{
    const o=OBJ[k], u=o.grp.userData;
    if(u.wipfel) u.wipfel.rotation.y = Math.sin(t*.28 + k.charCodeAt(1))*.13;
    if(u.nadel)  u.nadel.rotation.y  = Math.sin(t*.5)*.32;
    if(u.ring)   u.ring.rotation.z   = t*.35;
    if(u.riss)   u.riss.material.emissiveIntensity = .55+.45*Math.sin(t*4.2);
    (u.siegel||[]).forEach((s,j)=>{ s.position.y = 8.6 + Math.sin(t*1.6+j)*.3; });
    o.grp.getWorldPosition(o.welt);
  });
  if(torRing){ torRing.rotation.z=t*.22; torSchloss.rotation.y=Math.sin(t*.6)*.2;
    torRing.material.emissiveIntensity=.42+.28*Math.sin(t*1.5); }

  /* Wanderlichter */
  KANTEN.forEach(e=>{
    const f=fokus(e);
    e.rohr.material.opacity = klemme((e.quer?.95:.62)*f, .05, 1);
    e.lichter.forEach(l=>{
      l.userData.t=(l.userData.t+ (e.art==='bezug'?.0016:.0026))%1;
      e.kurve.getPointAt(l.userData.t, l.position);
      l.visible = f>.4;
      l.scale.setScalar(f>1?1.5:1);
    });
  });

  /* Staub */
  const pos=staub.geometry.attributes.position;
  for(let i=0;i<pos.count;i++){
    let y=pos.getY(i)+ .03 + staub.userData.gr[i]*.03;
    if(y>180) y=-32;
    pos.setY(i,y);
    pos.setX(i, pos.getX(i)+Math.sin(t*.28+i)*.011);
  }
  pos.needsUpdate=true;

  renderer.render(szene,kamera);
  schilderSetzen();
}

function fokus(e){
  const a=(schwebt||gewaehlt);
  if(!a) return 1;
  return (e.von===a||e.nach===a)?2:.16;
}

const _v=new THREE.Vector3(), _rx=new THREE.Vector3(), _ry=new THREE.Vector3(), _rz=new THREE.Vector3();
const ueberlappt=(a,b)=> a.x<b.x+b.w && b.x<a.x+a.w && a.y<b.y+b.h && b.y<a.y+a.h;

function schilderSetzen(){

  const belegt=[];

     Der Versatz läuft über den Rechts-Vektor der Kamera, nicht über

     die Insel, statt an ihrem Rand zu bleiben. */
  kamera.matrixWorld.extractBasis(_rx,_ry,_rz);
  inseln.forEach((ins,i)=>{
    const e=etagenEl[i];
    _v.set(VERSATZ[i][0], ins.mesh.position.y + (ins.leer? 30 : ins.amp+16), VERSATZ[i][1]);
    _v.addScaledVector(_rx, -ins.radius*(schmal?1.05:1.5));
    _v.project(kamera);
    if(_v.z>1){ e.el.style.display='none'; return; }
    e.el.style.display='';
    const x=klemme((_v.x*.5+.5)*B, e.b/2+12, B-e.b/2-12),
          y=klemme((-_v.y*.5+.5)*H, OBEN+e.h/2, UNTEN-e.h/2);
    e.el.style.left=x+'px'; e.el.style.top=y+'px';
    belegt.push({x:x-e.b/2, y:y-e.h/2, w:e.b, h:e.h});
  });

  /* Nadeln sitzen am Objekt, Fähnchen sammeln sich in einer Spalte */
  const aktiv0=(schwebt||gewaehlt);
  const liste=[];
  SCHL.forEach(k=>{
    const o=OBJ[k], s=schilderEl[k];
    _v.copy(o.welt); _v.y += o.hoehe*.55;
    const abstand=kamera.position.distanceTo(_v);
    _v.project(kamera);
    const sichtbar=_v.z<1;
    /* Auf schmalen Schirmen zeigt nur das angetippte Fähnchen Text —
       zwölf Zeilen sind hier eine Textwüste, die das Bild zudeckt. */
    const zeigen = sichtbar && (!schmal || aktiv0===k);
    s.nadel.style.display = sichtbar?'':'none';
    s.el.style.display = zeigen?'':'none';
    s.leine.style.display = zeigen?'':'none';
    if(!sichtbar) return;
    if(zeigen) liste.push({ k, s, x:(_v.x*.5+.5)*B, y:(-_v.y*.5+.5)*H, tiefe:abstand });
    else { s.nadel.style.left=((_v.x*.5+.5)*B)+'px'; s.nadel.style.top=((-_v.y*.5+.5)*H)+'px';
           s.nadel.style.setProperty('--o', klemme(1.3-abstand/700,.5,1).toFixed(2)); }
  });

  /* Spalte rechts neben der breitesten Insel, aber nie über den Rand.
     Steht die Tafel offen, rückt die Spalte davor. */
  _v.set(VERSATZ[0][0], inseln[0].mesh.position.y, VERSATZ[0][1]);
  _v.addScaledVector(_rx, RADIUS[0]*1.12); _v.project(kamera);
  const breiteste=(_v.x*.5+.5)*B;
  const tafelAuf=document.getElementById('tafel').classList.contains('auf');
  const rechterRand=B - (schmal?12:236) - ((tafelAuf&&!schmal)? Math.min(468,B)-20 : 0);
  const spalte=schmal? klemme(breiteste+18, 100, B-120)
                     : klemme(breiteste+34, Math.min(B*.5, rechterRand), Math.max(300, rechterRand));

  /* Nach Bildhöhe sortiert stapeln — dann kreuzen sich die Leinen nicht */
  liste.sort((a,b)=>a.y-b.y);
  const abstandMin=6;
  let unterkante=OBEN;
  liste.forEach(it=>{ it.ziel=Math.max(it.y, unterkante+it.s.h/2); unterkante=it.ziel+it.s.h/2+abstandMin; });
  /* Läuft der Stapel unten heraus, von hinten wieder hochschieben */
  let oberkante=UNTEN;
  for(let i=liste.length-1;i>=0;i--){
    const it=liste[i];
    it.ziel=Math.min(it.ziel, oberkante-it.s.h/2);
    oberkante=it.ziel-it.s.h/2-abstandMin;
  }

  const aktiv=(schwebt||gewaehlt);
  liste.forEach(it=>{
    const s=it.s;
    if(s.erst){ s.y=it.ziel; s.erst=false; }
    s.y += (it.ziel-s.y)*.24;         /* weich nachziehen, sonst zappelt es beim Drehen */
    if(Math.abs(it.ziel-s.y)<.5) s.y=it.ziel;
    s.el.style.left=spalte+'px';
    s.el.style.top =s.y+'px';
    s.nadel.style.left=it.x+'px';
    s.nadel.style.top =it.y+'px';
    /* Leine als weiche Kurve von der Nadel zur linken Kante des Fähnchens */
    const dx=(spalte-it.x)*.42;
    s.leine.setAttribute('d','M'+it.x.toFixed(1)+' '+it.y.toFixed(1)+
      'C'+(it.x+dx).toFixed(1)+' '+it.y.toFixed(1)+','+
          (spalte-dx).toFixed(1)+' '+s.y.toFixed(1)+','+
          spalte.toFixed(1)+' '+s.y.toFixed(1));
    /* Tiefenstaffelung: was hinten steht, tritt zurück */
    const o=klemme(1.3 - it.tiefe/700, .5, 1).toFixed(2);
    s.el.style.setProperty('--o', o); s.nadel.style.setProperty('--o', o);
    const fern=!!(aktiv && aktiv!==it.k);
    s.el.classList.toggle('fern', fern);   s.nadel.classList.toggle('fern', fern);
    s.el.classList.toggle('wach', aktiv===it.k);
    s.leine.setAttribute('stroke-opacity', fern? .1 : (aktiv===it.k? .85 : .45));
  });
}

/* ═══ Steuerung ═══ */
function reglerSpiegeln(){
  const r=document.getElementById('regler');
  if(document.activeElement!==r) r.value=Math.round(morph*1000);
  document.getElementById('knopf').style.left=(morph*100)+'%';
  document.getElementById('knopf').textContent=morph>.5?'⛰':'◲';
  document.getElementById('endeSchnitt').classList.toggle('an',morph<.5);
  document.getElementById('endeLand').classList.toggle('an',morph>=.5);
}
function fahreZu(z){ zielMorph=z; }

let zieht=false, zx=0, zy=0, weg=0;
function steuerung(){
  const c=renderer.domElement;
  c.addEventListener('pointerdown',e=>{ zieht=true; weg=0; zx=e.clientX; zy=e.clientY;
    c.setPointerCapture(e.pointerId); });
  c.addEventListener('pointermove',e=>{
    if(zieht){
      const dx=e.clientX-zx, dy=e.clientY-zy; weg+=Math.abs(dx)+Math.abs(dy);
      if(morph>.2){
        zielBahn.gier -= dx*.006;
        zielBahn.nick = klemme(zielBahn.nick + dy*.004, -.05, 1.15);
      }
      zx=e.clientX; zy=e.clientY; return;
    }
    zeigen(e);
  });
  c.addEventListener('pointerup',e=>{
    if(zieht && weg<7){
      const k=treffer(e);
      if(k) oeffneTafel(k); else { gewaehlt=null; schliesseTafel(); }
    }
    zieht=false;
  });
  c.addEventListener('pointercancel',()=>{zieht=false});
  c.addEventListener('wheel',e=>{
    e.preventDefault();
    if(morph>.2){ zoomBeruehrt=true; zielBahn.dist=klemme(zielBahn.dist + e.deltaY*.5, 170, 780); }
    else zielMorph=klemme(zielMorph+(e.deltaY>0?.16:-.16),0,1);
  },{passive:false});
  addEventListener('resize',()=>{
    kamera.aspect=innerWidth/innerHeight; kamera.updateProjectionMatrix();
    renderer.setSize(innerWidth,innerHeight);
    if(!zoomBeruehrt) zielBahn.dist=passendeDistanz();
  });
  document.addEventListener('keydown',e=>{
    if(e.key==='Escape'){ allesZu(); return; }
    if(document.activeElement && /INPUT|TEXTAREA/.test(document.activeElement.tagName)) return;
    if(e.key==='ArrowRight'||e.key==='ArrowLeft'){
      e.preventDefault();
      const i=gewaehlt?SCHL.indexOf(gewaehlt):-1;
      oeffneTafel(SCHL[e.key==='ArrowRight'?(i+1)%SCHL.length:(i<=0?SCHL.length-1:i-1)]);
    }
    if(e.key==='2') fahreZu(0);
    if(e.key==='3') fahreZu(1);
  });
  document.getElementById('regler').addEventListener('input',ev=>{
    zielMorph=morph=+ev.target.value/1000; reglerSpiegeln();
  });
  document.getElementById('ueber').addEventListener('click',e=>{
    if(e.target.id==='ueber') schliesseUeber();
  });
}
function treffer(e){
  maus.x=(e.clientX/innerWidth)*2-1;
  maus.y=-(e.clientY/innerHeight)*2+1;
  strahl.setFromCamera(maus,kamera);
  const tr=strahl.intersectObjects(anklickbar,false);
  return tr.length? tr[0].object.userData.k : null;
}
function zeigen(e){
  const k=treffer(e);
  if(k!==schwebt){ schwebt=k; renderer.domElement.style.cursor=k?'pointer':(morph>.2?'grab':'default'); }
}

/* ═══ Daten ═══ */
function zaehle(id){ return SCHL.filter(k=>P[k].claim_ceiling===id).length; }
function leisteBauen(){
  let h='<div class="leiste-k">Geltung ist Höhe</div>';
  for(let i=STUFEN.length-1;i>=0;i--){
    const st=STUFEN[i], n=zaehle(st.id), leer=n===0;
    h+='<div class="st'+(leer?' leer':'')+'" onclick="'+(leer?'oeffneDecke()':'zurStufe(\''+st.id+'\')')+'">'+
       '<span class="z" style="'+(leer?'':'background:'+st.hex)+'">'+n+'</span>'+
       '<span class="t"><b>'+st.name+'</b><span>'+(leer?'für kein Pattern erreichbar':st.frage)+'</span></span></div>';
  }
  h+='<div class="leiste-f">Kein Pattern erreicht die oberste Insel. Handlung entsteht nur als '+
     '<b>menschlich autorisierter Akt</b> — nie als Eigenschaft.</div>';
  document.getElementById('leiste').innerHTML=h;
}
function zurStufe(id){
  const t=SCHL.filter(k=>P[k].claim_ceiling===id);
  if(t.length) oeffneTafel(t[0]);
}

    case 'dormancy': { const d=p.dormancy, v=p.protected_value;

        blk('Wird sie je geöffnet?','<div class="kachel k-leer">'+liste(d.review_criteria)+'</div>')+

        herkunftKarte(p)+'<button class="tbtn rot" onclick="oeffnePruefung()">🛡 Warum diese Form unzulässig ist</button>'; }
    case 'embodiment': { const a=p.authorization, ef=p.effect_trace, rs=p.resonance, ae=p.appearance_event;
      return kopf(k)+
        blk('Die Autorisierung — der einzige Weg zur Handlung',
          '<div class="zitat z-gruen"><b style="color:'+FH.gruen+';font-size:1rem">✓ '+e_(a.status)+'</b><br>'+
          '<span style="font-size:.82rem">durch <b>'+e_(a.authorized_by)+'</b> am '+datum(a.authorized_at)+
          '</span><br><br>'+e_(a.reason)+'</div><p style="font-size:.76rem;color:var(--tinte2);margin-top:8px">'+
          'Die einzige Stelle im ganzen Fall, an der gehandelt wird. Kein Pattern hat sich das verdient — '+
          'ein Mensch hat es verantwortet.</p>')+
        blk('Kandidaten der Verkörperung', p.candidates.map(c=>'<div class="kachel k-gruen" style="margin-bottom:7px">'+
          '<b>'+e_(c.form)+'</b> <span class="pille">'+e_(c.fidelity)+'</span><br><span style="color:var(--tinte2)">'+
          e_(c.medium)+' · '+c.accessibility.map(e_).join(', ')+'</span><br><span style="color:var(--rot)">'+
          c.constraints.map(e_).join(', ')+'</span></div>').join(''))+
        blk('Was daraufhin geschah', paar('erschien',datum(ae.appeared_at)+' · '+e_(ae.appeared_in))+
          paar('Zustand',e_(ae.initial_state))+paar('beobachtet',ef.observed_effects.map(e_).join('<br>'),FH.gruen)+
          paar('unerwartet',ef.unexpected_effects.map(e_).join('<br>'),FH.orange))+
        blk('Resonanz','<div class="zitat z-orange" style="font-size:.86rem">'+e_(rs.description)+'</div>'+
          '<div style="margin-top:8px">'+paar('Intensität',rs.intensity)+balken(rs.intensity,FH.orange)+'</div>')+
        herkunftKarte(p); }
    case 'orientation': { const v=p.vectors[0], st=p.standpoint;
      return kopf(k)+
        blk('Wohin die Umgebung zeigt','<div class="k2"><div class="kachel k-gruen"><h5>hin zu</h5>'+e_(v.toward)+
          '</div><div class="kachel k-leer"><h5>weg von</h5>'+e_(v.away_from)+'</div></div><div style="margin-top:10px">'+
          paar('implizite Werte',v.implicit_values.map(e_).join('<br>'))+
          paar('Aufforderungen',v.affordances.map(e_).join('<br>'),FH.gruen)+
          paar('Entmutigungen',v.discouragements.map(e_).join('<br>'),FH.rot)+'</div>')+
        blk('Wer schaut hier?', paar('Standpunkt',e_(st.explicit_standpoint))+
          paar('versteckte Annahmen',st.hidden_assumptions.map(e_).join('<br>'),FH.orange)+
          paar('andere Ausrichtungen',st.alternative_orientations.map(e_).join('<br>'),FH.blau))+
        blk('Was neu sichtbar wurde',(p.possibility_space_history||[]).map(h=>
          '<div class="kachel k-blau" style="margin-bottom:7px"><h5>'+datum(h.recognized_at)+'</h5><b>'+
          e_(h.newly_visible_direction)+'</b><br><span style="color:var(--tinte2)">vorher abwesend: '+
          e_(h.previously_absent)+'</span></div>').join(''))+
        herkunftKarte(p); }
    case 'renewal': { const istK=(k==='kn'), ch=p.changes, re=p.re_entry;
      const regel=DATEN.profile.chains.entwicklungsknoten;
      const ketten=[...new Set((p.references||[]).map(r=>VON_ID[r]).filter(Boolean)
                    .map(x=>ORT[x].kette===-1?'A':'B'))].sort();
      let h=kopf(k);
      if(istK) h+='<div class="zitat z-gelb" style="margin-bottom:18px"><b>🔭 Ein Aussichtspunkt, kein Abschluss.</b>'+
        '<br><br>Verdichtet die Ketten <b>'+ketten.join(' und ')+'</b>. Das Profil verlangt '+
        '<span class="mono">min_referenced_chains: '+regel.min_referenced_chains+'</span> — '+
        (ketten.length>=regel.min_referenced_chains?'<b style="color:'+FH.gruen+'">erfüllt</b>':
        '<b style="color:'+FH.rot+'">verletzt</b>')+'.<br><br>Und trotzdem steht er auf <b>derselben Insel</b> '+
        'wie eine gewöhnliche Verbindung: perspektiv. Weiter sehen heißt nicht mehr behaupten dürfen.</div>';
      return h+
        blk('Was sich geändert hat', ch.revised_hypotheses.map(x=>'<div class="k2" style="margin-bottom:8px">'+
          '<div class="kachel k-leer"><h5>vorher</h5>'+e_(x.before)+'</div>'+
          '<div class="kachel k-gruen"><h5>nachher</h5>'+e_(x.after)+'</div></div>'+
          paar('Auslöser',e_(x.trigger),FH.orange)).join(''))+
        blk('Der Möglichkeitsraum danach', ch.revised_candidate_space.map(r=>
          '<div style="margin-bottom:10px"><b style="font-size:.85rem">'+e_(r.dimension)+'</b>'+
          '<div class="k2" style="margin:7px 0"><div class="kachel k-leer"><h5>vorher</h5>'+
          r.before.map(e_).join('<br>')+'</div><div class="kachel k-gelb"><h5>nachher</h5>'+
          r.after.map(e_).join('<br>')+'</div></div>'+
          paar('neu sichtbar',r.newly_visible.map(e_).join('<br>'),FH.gruen)+
          paar('neu abwesend',r.newly_absent.map(e_).join('<br>'),SCHIEFER_H)+'</div>').join(''))+
        blk('Wo die Kette wieder eintritt', paar('Prozess',e_(re.process_re_entry.original_process)+' → <b>'+
          e_(re.process_re_entry.re_entry_point)+'</b>')+
          paar('bewahrt',re.process_re_entry.context_preserved.map(e_).join('<br>'),FH.gruen)+
          paar('damals unsichtbar',re.condition_re_entry.what_was_invisible_then.map(e_).join('<br>'),FH.orange)+
          paar('jetzt sichtbar',re.condition_re_entry.what_is_visible_now.map(e_).join('<br>'),FH.blau))+
        (p.new_capabilities.length?blk('Neue Fähigkeiten',liste(p.new_capabilities)):'')+
        herkunftKarte(p); }
  }
  return '';
}
function oeffneTafel(k){
  if(!P[k]) return;
  gewaehlt=k;
  document.getElementById('tafelIn').innerHTML=inhalt(k);
  const t=document.getElementById('tafel'); t.classList.add('auf'); t.scrollTop=0;
}
function schliesseTafel(){ document.getElementById('tafel').classList.remove('auf'); gewaehlt=null; }
function zeigeUeber(h){ document.getElementById('ueberIn').innerHTML=h;
  document.getElementById('ueber').classList.add('auf'); }
function schliesseUeber(){ document.getElementById('ueber').classList.remove('auf'); }
function allesZu(){ schliesseTafel(); schliesseUeber(); }
function hinweis(t){
  const el=document.getElementById('hinweis'); el.textContent=t; el.classList.add('auf');
  clearTimeout(hinweis._t); hinweis._t=setTimeout(()=>el.classList.remove('auf'),3400);
}

function oeffneDecke(){
  const caps=DATEN.profile.claim_ceiling_caps, pn=DATEN.profile.projection_names;
  const pro={}; Object.keys(caps).forEach(t=>{ (pro[caps[t]]=pro[caps[t]]||[]).push(pn[t]||t); });
  let l='';
  STUFEN.forEach((st,i)=>{
    const leer=i===3;
    l+='<div class="sprosse'+(leer?' zu-':'')+'"'+(leer?'':' style="border-left-color:'+st.hex+'"')+'>'+
      '<span class="s"'+(leer?'':' style="color:'+st.hex+'"')+'>'+(leer?'🔒 ':'')+st.name+'</span>'+
      '<span class="w">'+(leer?'Für kein Pattern erreichbar. Handlung entsteht ausschließlich als menschlich '+
      'autorisiertes <span class="mono">embodiment.authorization</span> — als Akt, nicht als Eigenschaft.':
      (pro[st.id]||[]).map(e_).join(' · '))+'</span></div>';
  });
  zeigeUeber('<button class="zu" onclick="schliesseUeber()">×</button><h2>🔒 Die Decke</h2>'+
    '<div class="unter">Die oberste Insel ist leer. Nicht, weil dort noch nichts angekommen wäre — '+
    'sondern weil dort <b>nichts ankommen kann</b>. Das Tor dort oben geht nicht auf.</div>'+
    '<div class="leiter">'+l+'</div>'+
    '<div class="kachel k-gruen" style="margin-bottom:14px"><h5>Der eine Akt im ganzen Fall</h5>'+
    'Am 05.06. hat <b>team:faska-primar</b> entschieden, Zollstock und Maßband bereitzulegen — '+
    'niedrigschwellig, reversibel, ohne Aufforderungscharakter. Das ist die einzige Handlung. '+
    'Sie steht nicht am Ende einer Beweiskette, sondern unter einem Namen.</div>'+
    '<p style="font-size:.84rem;line-height:1.7;color:var(--tinte2)">'+e_(DATEN.profile.ceiling_note)+'</p>'+
    '<button class="tbtn gruen" onclick="schliesseUeber();oeffneTafel(\'b6\')">Zur autorisierten Handlung →</button>');
}
function oeffnePruefung(){
  const fc=DATEN.profile.forbidden_claims;
  const bsp=['Dieses Kind ist mathematisch kompetent.','Sie besitzt eine Kompetenz im Größenvergleich.',
    'Sie ist ein typischer Lerntyp: visuell.','Hier zeigt sich ein Defizit im Bereich Konzentration.',
    'Sie hat das Modell neben die Seitenwand gehalten.'];
  zeigeUeber('<button class="zu" onclick="schliesseUeber()">×</button><h2>🛡 Die Prüfung</h2>'+
    '<div class="unter">Schreiben Sie einen Satz über ein Kind. Das Profil prüft mit, während Sie tippen.</div>'+
    '<textarea class="pruef" id="pruefFeld" placeholder="Zum Beispiel: &bdquo;Dieses Kind ist mathematisch kompetent.&ldquo;" oninput="pruefe()"></textarea>'+
    '<div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:9px">'+
    bsp.map(b=>'<button class="mbtn" onclick="document.getElementById(\'pruefFeld\').value=this.textContent;pruefe()">'+
      e_(b)+'</button>').join('')+'</div>'+
    '<div id="pruefUrteil" class="urteil u-leer">Noch nichts eingegeben.</div>'+
    '<h3 style="font:800 9.4px var(--font);letter-spacing:.14em;text-transform:uppercase;color:var(--rot);margin:22px 0 8px">'+
    'Die vier unzulässigen Formen</h3>'+
    fc.map(f=>'<div class="verstoss" style="border-left-color:'+FH.orange+'"><b style="color:'+FH.orange+'">'+
      e_(f.name)+'</b><br>'+e_(f.why)+'<div class="mono" style="margin-top:5px">'+e_(f.pattern)+'</div></div>').join('')+
    '<h3 style="font:800 9.4px var(--font);letter-spacing:.14em;text-transform:uppercase;color:'+FH.gruen+';margin:22px 0 8px">'+
    'Der Fall, der wirklich passiert ist</h3>'+
    '<div class="verstoss"><b>„Dieses Kind ist mathematisch kompetent."</b><br>KI-Vorschlag von '+
    '<span class="mono">tisch/kimi</span>. Geprüft gegen Kern und Profil:'+
    DATEN.overclaim_violations.map(v=>'<div style="margin-top:7px"><span class="pille p-rot">'+e_(v.severity)+' · '+
      e_(v.layer)+'</span> <b>'+e_(v.rule)+'</b><br><span style="color:var(--tinte2)">'+e_(v.detail)+'</span></div>').join('')+
    '<div style="margin-top:9px">Ergebnis: <b style="color:'+FH.rot+'">nicht registriert</b> — aber auch nicht gelöscht. '+
    'Er lebt als <a href="#" onclick="schliesseUeber();oeffneTafel(\'bd\');return false" style="color:'+FH.blau+
    ';font-weight:700">schlafende Knospe</a> weiter.</div></div>');
}
function pruefe(){
  const ein=document.getElementById('pruefFeld').value.trim();
  const el=document.getElementById('pruefUrteil');
  if(!ein){ el.className='urteil u-leer'; el.textContent='Noch nichts eingegeben.'; return; }
  const tr=[];
  DATEN.profile.forbidden_claims.forEach(f=>{
    let re; try{ re=new RegExp(f.pattern,'i'); }catch(x){ return; }
    const m=re.exec(ein); if(m) tr.push({f,m});
  });
  if(!tr.length){
    el.className='urteil u-frei';
    el.innerHTML='<b style="color:'+FH.gruen+';font-size:1rem">✓ Keine unzulässige Form.</b><br>'+
      '<span style="font-size:.83rem">Bleibt die zweite Frage: auf welcher <b>Insel</b> darf dieser Satz stehen? '+
      'Eine Beobachtung deckelt bei <b>erscheinung</b>, eine Deutung bei <b>perspektiv</b>. '+
      'Und keine Stufe ersetzt die Unterschrift eines Menschen.</span>';
  }else{
    el.className='urteil u-stopp';
    el.innerHTML='<b style="color:'+FH.rot+';font-size:1rem">✗ Unzulässig — '+tr.length+' Form'+
      (tr.length>1?'en':'')+' erkannt.</b>'+
      tr.map(t=>'<div class="verstoss"><b>'+e_(t.f.name)+'</b> — '+e_(t.f.why)+'<div style="margin-top:6px">'+
        e_(ein.slice(0,t.m.index))+'<mark>'+e_(t.m[0])+'</mark>'+e_(ein.slice(t.m.index+t.m[0].length))+
        '</div></div>').join('')+
      '<div style="font-size:.79rem;margin-top:9px;color:var(--tinte2)">Das System verwaltet <b>Übergänge</b>, '+
      'keine Eigenschaften.</div>';
  }
}
function oeffneLesehilfe(){
  zeigeUeber('<button class="zu" onclick="schliesseUeber()">×</button><h2>❓ Wie diese Inseln zu lesen sind</h2>'+
    '<div class="unter">Vier Inseln, eine je Geltungsstufe. Je höher eine Insel, desto mehr darf ein Pattern '+
    'behaupten, das auf ihr steht. Die oberste ist leer und ihr Tor ist zu.</div>'+
    '<div class="k2" style="margin-bottom:16px">'+
    '<div class="kachel k-blau"><h5>⛰ Inseln — umsehen</h5>Ziehen dreht, Rad zoomt. Von unten siehst du '+
    'das verschlossene Tor über allem.</div>'+
    '<div class="kachel k-gruen"><h5>◲ Schnitt — lesen</h5>Die Kamera fährt weit zurück und wird flach. '+
    'Die vier Inseln liegen als Bänder übereinander.</div></div>'+
    '<h3 style="font:800 9.4px var(--font);letter-spacing:.14em;text-transform:uppercase;color:var(--tinte2);margin:0 0 9px">'+
    'Die Verbindungen</h3>'+
    '<div style="font-size:.85rem;line-height:1.75;margin-bottom:16px">'+
    '<b style="color:#5e8a3f">Herkunft</b> (<span class="mono">provenance.parents</span>) — woraus etwas entstand. '+
    'Wölbt sich nach oben.<br><b style="color:'+SCHIEFER_H+'">Bezug</b> (<span class="mono">references</span>) — '+
    'worauf es sich stützt. Hängt nach unten durch.<br><b style="color:#b89400">Gold</b> — läuft über beide Ketten. '+
    'Genau davon lebt der Aussichtspunkt.</div>'+
    '<h3 style="font:800 9.4px var(--font);letter-spacing:.14em;text-transform:uppercase;color:var(--tinte2);margin:0 0 9px">'+
    'Die Zeichen</h3><div style="font-size:.85rem;line-height:1.75">'+
    '<b style="color:'+FH.gruen+'">grüne Kugel</b> — von einem Menschen besiegelt (3 von 12).<br>'+
    '<b style="color:'+FH.rot+'">rote Kugel</b> — umstritten, nicht aufgelöst (1 von 12).<br>'+
    '<b style="color:'+SCHIEFER_H+'">Knospe unter der Insel</b> — schläft. Abgelehnt, aber bewahrt.</div>'+
    '<button class="tbtn" onclick="schliesseUeber();fahreZu(1)">Inseln ansehen →</button>');
}

/* ═══ Start ═══ */
async function start(){
  try{
    if(typeof THREE==='undefined') throw new Error('Three.js konnte nicht geladen werden (CDN gesperrt?).');
    if(typeof EINGEBETTETE_DATEN!=='undefined'){ DATEN=EINGEBETTETE_DATEN; }
    else{
      const r=await fetch('lena-stallbox.json');
      if(!r.ok) throw new Error('HTTP '+r.status+' für lena-stallbox.json');
      DATEN=await r.json();
    }
    DATEN.patterns.forEach((p,i)=>{ VON_ID[p.id]=SCHL[i]; P[SCHL[i]]=p; });
    bauen(); leisteBauen(); schilderBauen(); steuerung(); reglerSpiegeln();
    bahn.dist=zielBahn.dist=passendeDistanz();
    schleife();
    setTimeout(()=>document.getElementById('laden').classList.add('weg'), 300);
    setTimeout(()=>hinweis('Ziehen dreht die Inseln · Regler unten wechselt zum Schnitt'), 1400);
  }catch(e){
    document.getElementById('laden').innerHTML='<div><b>Konnte nicht laden</b>'+
      String(e && e.message || e)+'</div>';
  }
}
start();
</script>
