<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>FASKA · Die Geltungsinseln — Der Lena-Fall</title>
<link rel="icon" href="faska-logo-official.svg">
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<style>
:root{
  --blau:#3da6da; --rot:#bd182a; --orange:#e25e2b; --gruen:#44a735; --gelb:#ffce05;
  --creme:#fefcf7; --creme2:#f5efe1; --tinte:#2b2314; --tinte2:#6e6149;
  --rand:#e7dfcd; --karte:#fff;
  --schatten:0 2px 16px rgba(60,45,20,.10); --gross:0 26px 70px rgba(50,38,16,.24);
  --r:20px; --rs:13px;
  --font:'Inter',-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --kopf:60px;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#cfe6f2;color:var(--tinte);
  font:15px/1.55 var(--font);-webkit-font-smoothing:antialiased}
canvas{display:block;touch-action:none}
button{font-family:inherit}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:rgba(120,105,75,.3);border-radius:8px}

#welt{position:fixed;inset:0;z-index:1}
#schilder{position:fixed;inset:0;z-index:2;pointer-events:none;overflow:hidden}

/* ── Schilder über den Objekten ── */
.schild{position:absolute;transform:translate(-50%,0);text-align:center;pointer-events:auto;
  cursor:pointer;white-space:nowrap;transition:opacity .25s}
.schild .n{font:800 12.5px var(--font);letter-spacing:-.01em;color:#22 1a0c;
  color:#241c0d;text-shadow:0 1px 0 rgba(255,253,247,.85),0 0 9px rgba(255,253,247,.95)}
.schild .u{font:600 9.6px var(--font);color:#6b5d43;
  text-shadow:0 1px 0 rgba(255,253,247,.85),0 0 8px rgba(255,253,247,.95)}
.schild .pin{width:7px;height:7px;border-radius:50%;margin:0 auto 4px;box-shadow:0 0 0 3px rgba(255,253,247,.7)}
.schild:hover .n{color:#000}
.schild.fern{opacity:.42}

/* ── Ebenen-Tafeln in der Luft ── */
.etage{position:absolute;transform:translate(-50%,-50%);pointer-events:none;
  font:800 10.5px var(--font);letter-spacing:.14em;text-transform:uppercase;
  padding:5px 12px;border-radius:14px;background:rgba(255,253,247,.82);
  backdrop-filter:blur(6px);box-shadow:0 2px 10px rgba(50,38,16,.14);white-space:nowrap}
.etage small{display:block;font:600 8.6px var(--font);letter-spacing:.04em;text-transform:none;
  color:var(--tinte2);margin-top:1px}
.etage.leer{background:rgba(255,240,240,.9);border:1.5px dashed var(--rot);color:var(--rot)}

/* ── Kopfleiste ── */
.kopf{position:fixed;z-index:30;top:0;left:0;right:0;height:var(--kopf);display:flex;
  align-items:center;justify-content:space-between;gap:12px;padding:0 15px;
  background:rgba(255,253,247,.8);backdrop-filter:blur(16px) saturate(1.4);
  border-bottom:1px solid rgba(231,223,205,.9)}
.marke{display:flex;align-items:center;gap:10px;cursor:pointer;min-width:0}
.marke img{width:30px;height:30px;flex-shrink:0}
.marke>div{min-width:0}
.marke b{display:block;font-weight:800;font-size:.97rem;letter-spacing:-.02em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.marke i{display:block;font-style:normal;font-size:.59rem;font-weight:700;color:var(--tinte2);
  letter-spacing:.12em;text-transform:uppercase;white-space:nowrap}
.kopf-r{display:flex;align-items:center;gap:5px;flex-shrink:0}
.kbtn{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:22px;
  border:1.5px solid var(--rand);background:rgba(255,255,255,.9);color:var(--tinte);cursor:pointer;
  font:700 11.5px var(--font);white-space:nowrap;transition:transform .16s,border-color .18s,color .18s}
.kbtn:hover{border-color:var(--blau);color:var(--blau);transform:translateY(-1px)}
.kbtn:focus-visible{outline:2px solid var(--blau);outline-offset:2px}

/* ── Umsichts-Schalter ── */
.umsicht{position:fixed;z-index:26;left:50%;transform:translateX(-50%);bottom:20px;
  display:flex;align-items:center;gap:13px;padding:10px 15px;border-radius:26px;
  background:rgba(255,253,247,.9);backdrop-filter:blur(16px) saturate(1.4);
  border:1px solid var(--rand);box-shadow:var(--gross)}
.ende{font:800 11px var(--font);letter-spacing:.09em;text-transform:uppercase;color:var(--tinte2);
  cursor:pointer;user-select:none;white-space:nowrap;transition:color .2s}
.ende.an{color:var(--blau)}
.ende small{display:block;font-size:8.4px;font-weight:600;letter-spacing:.04em;text-transform:none;
  opacity:.75;margin-top:1px}
.schiene{position:relative;width:186px;height:30px;flex-shrink:0}
.schiene::before{content:'';position:absolute;left:0;right:0;top:13px;height:4px;border-radius:3px;
  background:linear-gradient(90deg,var(--blau),var(--gruen))}
.knopf{position:absolute;top:1px;width:28px;height:28px;border-radius:50%;background:#fff;
  border:2.5px solid var(--blau);box-shadow:0 3px 10px rgba(50,38,16,.24);transform:translateX(-50%);
  pointer-events:none;display:flex;align-items:center;justify-content:center;font-size:12px}
.schiene input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;margin:0}

/* ── Stockwerks-Leiste ── */
.leiste{position:fixed;z-index:20;left:15px;top:calc(var(--kopf) + 14px);width:212px;
  background:rgba(255,253,247,.88);backdrop-filter:blur(14px);border:1px solid var(--rand);
  border-radius:var(--r);box-shadow:var(--schatten);overflow:hidden}
.leiste-k{padding:11px 14px 7px;font:800 9.4px var(--font);letter-spacing:.14em;
  text-transform:uppercase;color:var(--tinte2)}
.st{display:flex;align-items:center;gap:9px;padding:8px 14px;cursor:pointer;transition:background .18s}
.st:hover{background:rgba(245,239,225,.9)}
.st .z{width:23px;height:23px;border-radius:7px;display:flex;align-items:center;justify-content:center;
  font:800 11px var(--font);color:#fff;flex-shrink:0}
.st .t{min-width:0}
.st .t b{display:block;font:800 11.4px var(--font)}
.st .t span{display:block;font-size:9.3px;line-height:1.35;color:var(--tinte2);font-weight:600}
.st.leer{background:repeating-linear-gradient(135deg,transparent 0 7px,rgba(189,24,42,.055) 7px 14px)}
.st.leer .z{background:transparent;border:1.5px dashed var(--rot);color:var(--rot)}
.st.leer .t b{color:var(--rot)}
.leiste-f{padding:8px 14px 11px;border-top:1px solid var(--rand);font-size:9.3px;line-height:1.6;color:var(--tinte2)}
.leiste-f b{color:var(--gruen)}

/* ── Tafel ── */
.tafel{position:fixed;z-index:40;right:0;top:0;bottom:0;width:min(468px,100vw);
  background:var(--karte);border-left:1px solid var(--rand);box-shadow:-20px 0 60px rgba(50,38,16,.18);
  overflow-y:auto;transform:translateX(102%);transition:transform .46s cubic-bezier(.22,1,.36,1);
  overscroll-behavior:contain}
.tafel.auf{transform:none}
.tafel-in{padding:20px 24px 60px}
.zu{position:sticky;top:0;float:right;width:34px;height:34px;border-radius:50%;border:1.5px solid var(--rand);
  background:#fff;color:var(--tinte2);cursor:pointer;font-size:16px;line-height:1;display:flex;
  align-items:center;justify-content:center;z-index:3}
.zu:hover{border-color:var(--rot);color:var(--rot)}
.tafel h2{font-size:1.32rem;font-weight:800;letter-spacing:-.02em;margin:8px 0 4px;line-height:1.25}
.marker{display:inline-block;padding:4px 11px;border-radius:13px;color:#fff;font:800 9.4px var(--font);
  letter-spacing:.1em;text-transform:uppercase}
.zeile{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0 18px}
.pille{display:inline-block;padding:3px 10px;border-radius:11px;font:700 9.4px var(--font);
  letter-spacing:.06em;text-transform:uppercase;background:var(--creme2);color:var(--tinte2)}
.p-blau{background:rgba(61,166,218,.14);color:#1f74a1} .p-gelb{background:rgba(255,206,5,.22);color:#8a6d00}
.p-orange{background:rgba(226,94,43,.14);color:#b5441b} .p-rot{background:rgba(189,24,42,.11);color:var(--rot)}
.p-gruen{background:rgba(68,167,53,.15);color:#2e7823}
.datum{font-size:11px;color:var(--tinte2);font-weight:600}
.blk{margin-bottom:20px}
.blk>h3{font:800 9.4px var(--font);letter-spacing:.14em;text-transform:uppercase;color:var(--tinte2);
  margin-bottom:9px;display:flex;align-items:center;gap:7px}
.blk>h3::after{content:'';flex:1;height:1px;background:var(--rand)}
.zitat{font-size:.94rem;line-height:1.62;font-weight:500;padding:14px 16px;border-radius:var(--rs);
  background:var(--creme2);border-left:4px solid var(--blau)}
.z-gelb{border-left-color:var(--gelb)} .z-rot{border-left-color:var(--rot)}
.z-gruen{border-left-color:var(--gruen)} .z-orange{border-left-color:var(--orange)}
.paar{display:flex;gap:10px;font-size:.83rem;margin:6px 0;align-items:flex-start}
.paar .k{color:var(--tinte2);font-weight:700;min-width:116px;flex-shrink:0;font-size:.755rem}
.balken{height:7px;border-radius:4px;background:var(--creme2);overflow:hidden;margin:5px 0 10px}
.balken i{display:block;height:100%;border-radius:4px}
.liste{list-style:none}
.liste li{font-size:.84rem;line-height:1.6;padding-left:16px;position:relative;margin-bottom:6px}
.liste li::before{content:'';position:absolute;left:2px;top:.62em;width:5px;height:5px;border-radius:50%;
  background:var(--tinte2);opacity:.45}
.k2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.kachel{border-radius:var(--rs);padding:12px 14px;font-size:.8rem;line-height:1.55}
.kachel h5{font:800 8.8px var(--font);letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px}
.k-blau{background:rgba(61,166,218,.09)} .k-blau h5{color:#1f74a1}
.k-gelb{background:rgba(255,206,5,.16)} .k-gelb h5{color:#8a6d00}
.k-rot{background:rgba(189,24,42,.07)} .k-rot h5{color:var(--rot)}
.k-gruen{background:rgba(68,167,53,.1)} .k-gruen h5{color:#2e7823}
.k-orange{background:rgba(226,94,43,.09)} .k-orange h5{color:#b5441b}
.k-leer{background:transparent;border:1.5px dashed var(--rand);color:var(--tinte2);font-style:italic}
.herkunft{margin-top:16px;padding:12px 14px;border-radius:var(--rs);background:var(--creme2);
  border:1px dashed var(--rand);font-size:.72rem;line-height:1.62;color:var(--tinte2)}
.herkunft b{color:var(--tinte)}
.mono{font-family:var(--mono);font-size:.68rem;color:var(--tinte2);overflow-wrap:anywhere}
.tbtn{display:block;width:100%;padding:12px;border-radius:var(--rs);border:none;background:var(--blau);
  color:#fff;font:800 12.5px var(--font);cursor:pointer;margin-top:10px;transition:filter .18s,transform .18s}
.tbtn:hover{filter:brightness(1.07);transform:translateY(-1px)}
.tbtn.gruen{background:var(--gruen)} .tbtn.rot{background:var(--rot)}

.waage{display:grid;grid-template-columns:1fr 58px 1fr;margin:12px 0 4px;align-items:stretch}
.waage .seite{border-radius:var(--rs);padding:13px;font-size:.81rem;line-height:1.6}
.waage h4{font:800 8.8px var(--font);letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px}
.w-b{background:rgba(61,166,218,.1);border:1.5px solid rgba(61,166,218,.3)} .w-b h4{color:#1f74a1}
.w-d{background:rgba(255,206,5,.17);border:1.5px solid rgba(255,206,5,.45)} .w-d h4{color:#8a6d00}
.w-m{position:relative;margin:0 6px;border-radius:11px;overflow:hidden;
  background:linear-gradient(180deg,rgba(61,166,218,.07),rgba(255,206,5,.13))}
.w-m::before{content:'';position:absolute;inset:-40px 0;
  background:repeating-linear-gradient(180deg,transparent 0 13px,rgba(61,166,218,.2) 13px 15px);
  animation:fluss 2.6s linear infinite}
@keyframes fluss{to{transform:translateY(28px)}}
.w-z{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:2;background:#fff;
  border:1.5px solid var(--blau);color:var(--blau);border-radius:11px;padding:6px 4px;
  font:800 8.2px var(--font);text-align:center;line-height:1.4}
.spannung{display:grid;grid-template-columns:1fr 52px 1fr;gap:7px;margin:12px 0}
.blase{border-radius:var(--rs);padding:13px;font-size:.8rem;line-height:1.55}
.blase b{display:block;font-size:.74rem;margin-bottom:5px}
.blase em{display:block;font-style:normal;margin-top:7px;font-weight:700;font-size:.82rem}
.b-l{background:rgba(61,166,218,.1);border:1.5px solid rgba(61,166,218,.34);animation:nL 3.4s ease-in-out infinite}
.b-r{background:rgba(189,24,42,.08);border:1.5px solid rgba(189,24,42,.3);animation:nR 3.4s ease-in-out infinite}
@keyframes nL{0%,100%{transform:none}50%{transform:translateX(4px)}}
@keyframes nR{0%,100%{transform:none}50%{transform:translateX(-4px)}}
.riss{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.riss span{font-size:1.25rem;animation:bl 1.3s ease-in-out infinite}
@keyframes bl{0%,100%{opacity:.3;transform:scale(.9)}50%{opacity:1;transform:scale(1.14)}}
.riss small{font:800 7.4px var(--font);letter-spacing:.06em;text-transform:uppercase;color:var(--rot);
  text-align:center;line-height:1.45}

.ueber{position:fixed;z-index:60;inset:0;background:rgba(40,32,16,.5);backdrop-filter:blur(3px);
  display:flex;align-items:center;justify-content:center;padding:18px;opacity:0;pointer-events:none;
  transition:opacity .3s}
.ueber.auf{opacity:1;pointer-events:all}
.ukarte{background:var(--karte);border-radius:var(--r);padding:26px 28px;max-width:720px;width:100%;
  max-height:86vh;overflow-y:auto;box-shadow:var(--gross)}
.ukarte h2{font-size:1.28rem;font-weight:800;letter-spacing:-.02em;margin-bottom:5px}
.ukarte .unter{font-size:.85rem;color:var(--tinte2);margin-bottom:18px;line-height:1.6}
.ukarte .zu{position:static;float:right}
.leiter{display:flex;flex-direction:column-reverse;gap:6px;margin:14px 0}
.sprosse{display:flex;align-items:center;gap:12px;padding:11px 15px;border-radius:var(--rs);
  background:var(--creme2);border-left:5px solid var(--rand)}
.sprosse .s{font:800 11.4px var(--font);letter-spacing:.05em;text-transform:uppercase;min-width:104px}
.sprosse .w{font-size:.78rem;color:var(--tinte2);line-height:1.5}
.sprosse.zu-{background:repeating-linear-gradient(135deg,transparent 0 8px,rgba(189,24,42,.06) 8px 16px);
  border:1.5px dashed var(--rot);border-left:5px dashed var(--rot)}
.sprosse.zu- .s{color:var(--rot)}
.pruef{width:100%;min-height:76px;border-radius:var(--rs);border:2px solid var(--rand);
  background:var(--creme2);padding:13px 15px;font:500 .94rem var(--font);color:var(--tinte);resize:vertical}
.pruef:focus{outline:none;border-color:var(--blau)}
.urteil{margin-top:12px;border-radius:var(--rs);padding:15px 17px;font-size:.85rem;line-height:1.6}
.u-frei{background:rgba(68,167,53,.1);border:1.5px solid rgba(68,167,53,.42)}
.u-stopp{background:rgba(189,24,42,.08);border:1.5px solid rgba(189,24,42,.42)}
.u-leer{background:var(--creme2);border:1.5px dashed var(--rand);color:var(--tinte2)}
.verstoss{background:#fff;border:1px solid var(--rand);border-left:4px solid var(--rot);border-radius:10px;
  padding:11px 13px;margin-top:9px;font-size:.79rem;line-height:1.55}
mark{background:rgba(189,24,42,.22);border-radius:3px;padding:0 3px;color:inherit}
.mbtn{padding:6px 12px;border-radius:9px;border:1px solid var(--rand);background:#fff;color:var(--tinte2);
  cursor:pointer;font:700 11px var(--font)}
.mbtn:hover{border-color:var(--blau);color:var(--blau)}

.hinweis{position:fixed;z-index:70;top:74px;left:50%;transform:translateX(-50%) translateY(-8px);
  background:var(--tinte);color:var(--creme);padding:11px 22px;border-radius:24px;
  font:700 12.4px var(--font);opacity:0;transition:all .3s;pointer-events:none;max-width:86vw;text-align:center}
.hinweis.auf{opacity:1;transform:translateX(-50%)}
.laden{position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;
  background:#dceaf3;transition:opacity .6s}
.laden.weg{opacity:0;pointer-events:none}
.laden div{text-align:center;font:700 13px var(--font);color:#5b6b74}
.laden b{display:block;font-size:1.1rem;color:#31424c;margin-bottom:6px;letter-spacing:-.02em}

@media(max-width:900px){ .leiste{width:186px;left:10px} .kbtn .txt{display:none} .kbtn{padding:8px 11px} }
@media(max-width:620px){
  .marke i{display:none} .marke b{font-size:.82rem}
  .leiste{width:auto} .st .t span{display:none} .leiste-f{display:none}
  .umsicht{bottom:12px;gap:9px;padding:9px 12px} .schiene{width:112px} .ende small{display:none}
  .tafel{width:100vw} .hinweis{top:auto;bottom:78px}
  .schild .u{display:none}
}
@media(prefers-reduced-motion:reduce){ *{animation-duration:.001ms!important;transition-duration:.001ms!important} }
</style>
</head>
<body>

<div class="laden" id="laden"><div><b>Die Geltungsinseln</b>Der Lena-Fall wird gebaut …</div></div>

<header class="kopf">
  <div class="marke" onclick="allesZu()">
    <img src="faska-logo-official.svg" alt="FASKA" onerror="this.remove()">
    <div><b>Die Geltungsinseln</b><i>FASKA · der Lena-Fall</i></div>
  </div>
  <div class="kopf-r">
    <button class="kbtn" onclick="oeffneDecke()" title="Warum die oberste Insel leer ist">🔒 <span class="txt">Die Decke</span></button>
    <button class="kbtn" onclick="oeffnePruefung()" title="Aussagen gegen das Profil prüfen">🛡 <span class="txt">Prüfung</span></button>
    <button class="kbtn" onclick="oeffneLesehilfe()" title="Wie diese Inseln zu lesen sind">❓ <span class="txt">Lesehilfe</span></button>
  </div>
</header>

<div id="schilder"></div>
<div class="leiste" id="leiste"></div>

<div class="umsicht">
  <span class="ende an" id="endeSchnitt" onclick="fahreZu(0)">Schnitt<small>lesen</small></span>
  <div class="schiene"><input type="range" id="regler" min="0" max="1000" value="1000" aria-label="Umsicht"><div class="knopf" id="knopf">⛰</div></div>
  <span class="ende" id="endeLand" onclick="fahreZu(1)">Inseln<small>umsehen</small></span>
</div>

<div class="tafel" id="tafel"><div class="tafel-in" id="tafelIn"></div></div>
<div class="ueber" id="ueber"><div class="ukarte" id="ueberIn"></div></div>
<div class="hinweis" id="hinweis"></div>

<script>
'use strict';
/* ═══════════════════════════════════════════════════════════════════
   FASKA · DIE GELTUNGSINSELN
   Vier schwebende Inseln, eine je Geltungsstufe. Die oberste bleibt
   leer — nicht als Gestaltung, sondern weil claim_ceiling sie leer
   lässt. Echtes WebGL: Polar-Terrain mit Vertexfarben, Meer, Nebel,
   weiche Schatten.
   ═══════════════════════════════════════════════════════════════════ */

const F = { blau:0x3da6da, rot:0xbd182a, orange:0xe25e2b, gruen:0x44a735, gelb:0xffce05 };
const FH= { blau:'#3da6da', rot:'#bd182a', orange:'#e25e2b', gruen:'#44a735', gelb:'#ffce05' };
const SCHIEFER = 0x8d8a83, SCHIEFER_H = '#8d8a83';
const TYP_F = { appearance:F.blau, relation:F.gelb, potential:F.orange, transition:F.orange,
  coordination:F.rot, embodiment:F.gruen, orientation:F.gruen, renewal:F.gelb, dormancy:SCHIEFER };
const TYP_H = { appearance:FH.blau, relation:FH.gelb, potential:FH.orange, transition:FH.orange,
  coordination:FH.rot, embodiment:FH.gruen, orientation:FH.gruen, renewal:FH.gelb, dormancy:SCHIEFER_H };

const STUFEN = [
  { id:'erscheinung', name:'Erscheinung', hex:FH.blau,   farbe:F.blau,   frage:'Was tritt hervor?' },
  { id:'perspektiv',  name:'Perspektiv',  hex:FH.gelb,   farbe:F.gelb,   frage:'Wie wird es gelesen?' },
  { id:'epistemisch', name:'Epistemisch', hex:FH.orange, farbe:F.orange, frage:'Wofür steht das Team ein?' },
  { id:'handlung',    name:'Handlung',    hex:FH.rot,    farbe:F.rot,    frage:'Wer darf handeln?' }
];
const NR = { erscheinung:0, perspektiv:1, epistemisch:2, handlung:3 };

const SCHL = ['a1','a2','b1','b2','b3','b4','b5','bd','b6','b7','b8','kn'];

/* ═══ Rauschen (deterministisch) ═══ */
function hsh(x,y){ let n=Math.sin(x*127.1+y*311.7)*43758.5453; return n-Math.floor(n); }
function glatt(t){ return t*t*(3-2*t); }
function rausch(x,y){
  const xi=Math.floor(x), yi=Math.floor(y), xf=x-xi, yf=y-yi;
  const a=hsh(xi,yi), b=hsh(xi+1,yi), c=hsh(xi,yi+1), d=hsh(xi+1,yi+1);
  const u=glatt(xf), v=glatt(yf);
  return (a*(1-u)+b*u)*(1-v) + (c*(1-u)+d*u)*v;
}
/* Höhe der Inseloberfläche an einer Stelle (Inselkoordinaten, r in 0..1) */
function gelaende(x,z,radius,saat,amp){
  const d=Math.hypot(x,z)/radius;
  if(d>=1) return 0;
  const f=Math.pow(1-d*d, 1.25);
  const n=rausch(x*.055+saat, z*.055+saat)*1 + rausch(x*.14+saat*3, z*.14+saat*3)*.35;
  return (n/1.35)*f*amp;
}

/* ═══ Inselgeometrie: Polargitter mit Rock nach unten ═══ */
function inselGeometrie(radius, amp, saat, kahl){
  const RINGE=26, SEKT=64, ROCK=9;
  const pos=[], col=[], idx=[];
  const c_gras1=new THREE.Color(0x6fae46), c_gras2=new THREE.Color(0x548f39);
  const c_sand =new THREE.Color(0xe3d3a8), c_fels1=new THREE.Color(0x8a7a63),
        c_fels2=new THREE.Color(0x6a5c49), c_stein=new THREE.Color(0xa9a294);
  const reihen=RINGE+ROCK+1;

  for(let i=0;i<=RINGE+ROCK;i++){
    for(let j=0;j<=SEKT;j++){
      const a=j/SEKT*Math.PI*2;
      let r,y,c;
      if(i<=RINGE){
        r = (i/RINGE)*radius;
        const x=Math.cos(a)*r, z=Math.sin(a)*r;
        y = gelaende(x,z,radius,saat,amp);
        const ufer = i/RINGE;
        if(kahl){ c = c_stein.clone().lerp(c_fels1, rausch(x*.2+saat,z*.2)*0.5); }
        else if(ufer>.9) c = c_sand.clone();
        else {
          const hoch=Math.min(1, y/(amp*.72));
          c = c_gras1.clone().lerp(c_gras2, hoch);
          if(ufer>.82) c.lerp(c_sand, (ufer-.82)/.08*.75);
        }
      }else{
        /* Rock: verjüngt sich nach unten zu einer Spitze */
        const t=(i-RINGE)/ROCK;
        const zack = .82 + .18*rausch(a*2.4+saat, t*3);
        r = radius*(1-Math.pow(t,.72))*zack;
        y = -Math.pow(t,.8)*radius*(kahl?.55:1.15) - amp*.1;
        c = c_fels1.clone().lerp(c_fels2, t*.85 + rausch(a*3+saat,t*5)*.15);
      }
      pos.push(Math.cos(a)*r, y, Math.sin(a)*r);
      col.push(c.r,c.g,c.b);
    }
  }
  for(let i=0;i<RINGE+ROCK;i++){
    for(let j=0;j<SEKT;j++){
      const a=i*(SEKT+1)+j, b=a+1, c=a+(SEKT+1), d=c+1;
      idx.push(a,c,b, b,c,d);
    }
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('color',    new THREE.Float32BufferAttribute(col,3));
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}

/* ── Meer ── */
let meer;
function meerBauen(){
  const g=new THREE.PlaneGeometry(1600,1600,60,60);
  g.rotateX(-Math.PI/2);
  const m=new THREE.MeshStandardMaterial({ color:0x4f9fc4, roughness:.28, metalness:.05,
    transparent:true, opacity:.9 });
  meer=new THREE.Mesh(g,m);
  meer.position.y=-9; meer.receiveShadow=true;
  wurzel.add(meer);
  meer.userData.grund=g.attributes.position.array.slice();
}
function meerWellen(t){
  const p=meer.geometry.attributes.position, g=meer.userData.grund;
  for(let i=0;i<p.count;i++){
    const x=g[i*3], z=g[i*3+2];
    p.setY(i, Math.sin(x*.035+t*.9)*.75 + Math.sin(z*.028+t*.62)*.6 + Math.sin((x+z)*.017+t*1.2)*.4);
  }
  p.needsUpdate=true;
  meer.geometry.computeVertexNormals();
}

/* ── Die vier Inseln ── */
const inseln=[];
function inselnBauen(){
  STUFEN.forEach((st,i)=>{
    const leer = zaehle(st.id)===0;
    const amp = leer ? 1.6 : 7.5 - i*1.1;
    const g = inselGeometrie(RADIUS[i], amp, 11.7+i*4.3, leer);
    const mat = new THREE.MeshStandardMaterial({ vertexColors:true, roughness:.94, metalness:0,
      flatShading:true });
    const mesh=new THREE.Mesh(g,mat);
    mesh.position.set(VERSATZ[i][0], HOEHE[i], VERSATZ[i][1]);
    mesh.castShadow=true; mesh.receiveShadow=true;
    wurzel.add(mesh);

    const grp=new THREE.Group();
    grp.position.copy(mesh.position);
    wurzel.add(grp);
    inseln.push({ st, i, mesh, grp, radius:RADIUS[i], amp, saat:11.7+i*4.3, leer });

    if(leer) verschlosseneInsel(grp, RADIUS[i]);
  });
}

/* Die leere Insel bekommt ein Tor, das zu ist. */
let torRing=null, torSchloss=null;
function verschlosseneInsel(grp, radius){
  const stein=new THREE.MeshStandardMaterial({color:0xb9b2a4, roughness:.9, flatShading:true});
  /* Steinkreis */
  for(let i=0;i<9;i++){
    const a=i/9*Math.PI*2;
    const h=4+((i*37)%10)/3;
    const q=new THREE.Mesh(new THREE.BoxGeometry(2.2,h,1.7), stein);
    q.position.set(Math.cos(a)*radius*.6, h/2+1.4, Math.sin(a)*radius*.6);
    q.rotation.y=-a; q.rotation.z=((i*53)%7-3)/60;
    q.castShadow=true; q.receiveShadow=true; grp.add(q);
  }
  /* Torbogen */
  const bogen=new THREE.Mesh(new THREE.TorusGeometry(6.2,.85,10,40,Math.PI), stein);
  bogen.position.y=7.4; bogen.castShadow=true; grp.add(bogen);
  const pf=new THREE.MeshStandardMaterial({color:0xb9b2a4,roughness:.9});
  [-6.2,6.2].forEach(x=>{
    const p=new THREE.Mesh(new THREE.CylinderGeometry(.85,1,7.4,10), pf);
    p.position.set(x,3.7,0); p.castShadow=true; grp.add(p);
  });
  /* Ein rotes Siegel im Tor — es bleibt zu */
  torRing=new THREE.Mesh(new THREE.TorusGeometry(3.4,.28,8,44),
    new THREE.MeshStandardMaterial({color:F.rot, emissive:F.rot, emissiveIntensity:.55, roughness:.5}));
  torRing.position.y=6.4; grp.add(torRing);
  torSchloss=new THREE.Mesh(new THREE.BoxGeometry(2.1,2.4,.8),
    new THREE.MeshStandardMaterial({color:F.rot, emissive:F.rot, emissiveIntensity:.4, roughness:.55}));
  torSchloss.position.y=6.4; grp.add(torSchloss);
  const buegel=new THREE.Mesh(new THREE.TorusGeometry(.75,.22,8,20,Math.PI),
    new THREE.MeshStandardMaterial({color:0xd8d2c4, roughness:.5}));
  buegel.position.y=7.9; grp.add(buegel);
}

/* ═══ Pattern-Objekte ═══ */
function stelle(k){
  const o=ORT[k], p=P[k], i=NR[p.claim_ceiling], ins=inseln[i];
  const x=Math.cos(o.w)*o.r*ins.radius, z=Math.sin(o.w)*o.r*ins.radius;
  const y=gelaende(x,z,ins.radius,ins.saat,ins.amp);
  return { x, y:(o.unten? y-16 : y), z, ins };
}
function objekteBauen(){
  SCHL.forEach(k=>{
    const p=P[k], s=stelle(k), g=new THREE.Group();
    g.position.set(s.x,s.y,s.z);
    s.ins.grp.add(g);
    const farbe=TYP_F[p.pattern_type];
    switch(p.pattern_type){
      case 'appearance':   baum(g,farbe,p.phenomenon.salience||.5, k==='b1'); break;
      case 'relation':     verbindung(g,farbe); break;
      case 'potential':    faecher(g,p); break;
      case 'transition':   puppe(g,farbe); break;
      case 'coordination': runde(g,p); break;
      case 'embodiment':   werkbank(g); break;
      case 'orientation':  nadel(g); break;
      case 'renewal':      bluete(g, k==='kn'); break;
      case 'dormancy':     knospe(g); break;
    }
    if(p.sealed_by==='human') siegel(g, F.gruen, 1);
    if(p.contested)          siegel(g, F.rot, -1);
    OBJ[k]={ k, grp:g, welt:new THREE.Vector3(), typ:p.pattern_type, insel:i_von(p) };
    g.traverse(o=>{ if(o.isMesh){ o.userData.k=k; anklickbar.push(o); } });
  });
}
function i_von(p){ return NR[p.claim_ceiling]; }

const M = (c,r,e)=> new THREE.MeshStandardMaterial({color:c, roughness:r==null?.85:r, flatShading:true,
  emissive: e?c:0x000000, emissiveIntensity: e||0});
const RINDE=new THREE.MeshStandardMaterial({color:0x7a5a3c, roughness:.95, flatShading:true});

function baum(g,farbe,sal,gross){
  const h=(gross?9:7)+sal*4;
  const st=new THREE.Mesh(new THREE.CylinderGeometry(.42,.72,h,7), RINDE);
  st.position.y=h/2; st.castShadow=true; g.add(st);
  const kr=new THREE.Group(); kr.position.y=h; g.add(kr);
  const n=gross?5:4;
  for(let i=0;i<n;i++){
    const r=2.6+ (i===0?1.5:0) + ((i*29)%9)/7;
    const b=new THREE.Mesh(new THREE.IcosahedronGeometry(r,0), M(farbe,.86));
    const a=i/n*Math.PI*2;
    b.position.set(Math.cos(a)*(i===0?0:2.5), (i===0?1.4:0)+((i*17)%8)/5, Math.sin(a)*(i===0?0:2.5));
    b.castShadow=true; b.receiveShadow=true; kr.add(b);
  }
  /* Blüten der Aufmerksamkeit */
  const bl=Math.round(3+sal*5);
  for(let i=0;i<bl;i++){
    const a=i/bl*Math.PI*2, r=3.2;
    const f=new THREE.Mesh(new THREE.SphereGeometry(.52,7,6), M(F.gelb,.5,.35));
    f.position.set(Math.cos(a)*r, 1+((i*23)%9)/4, Math.sin(a)*r);
    kr.add(f);
  }
  g.userData.wipfel=kr;
}
function verbindung(g,farbe){
  const s=new THREE.Mesh(new THREE.CylinderGeometry(.3,.42,5.5,6), RINDE);
  s.position.y=2.75; s.castShadow=true; g.add(s);
  const k=new THREE.Group(); k.position.y=6; g.add(k);
  const mitte=new THREE.Mesh(new THREE.IcosahedronGeometry(1.5,0), M(farbe,.6,.18));
  mitte.castShadow=true; k.add(mitte);
  for(let i=0;i<3;i++){
    const a=i/3*Math.PI*2;
    const o=new THREE.Mesh(new THREE.IcosahedronGeometry(.62,0), M(farbe,.6,.3));
    o.position.set(Math.cos(a)*3, Math.sin(i*1.7)*.9, Math.sin(a)*3);
    k.add(o);
    const b=new THREE.Mesh(new THREE.TorusGeometry(1.6,.09,6,20,Math.PI*.9),
      M(farbe,.7,.15));
    b.position.set(Math.cos(a)*1.5, .3, Math.sin(a)*1.5);
    b.rotation.set(Math.PI/2, 0, -a); k.add(b);
  }
  g.userData.wipfel=k;
}
function faecher(g,p){
  const dom={mathematik:F.blau,sprache:F.rot,werken:F.orange,biologie:F.gruen,keine:SCHIEFER};
  const eps=(p.candidate_space&&p.candidate_space.entry_points)||[];
  const gw =(p.candidate_space&&p.candidate_space.domain_weights)||{};
  const s=new THREE.Mesh(new THREE.CylinderGeometry(.34,.5,4,6), RINDE);
  s.position.y=2; s.castShadow=true; g.add(s);
  const k=new THREE.Group(); k.position.y=4.2; g.add(k);
  eps.forEach((e,i)=>{
    const a=-1.35 + i*(2.7/Math.max(1,eps.length-1));
    const w=gw[e.domain]||.3, len=3.4+w*2.4;
    const st=new THREE.Mesh(new THREE.CylinderGeometry(.1,.14,len,5), M(0x6f8f4e,.9));
    st.position.set(Math.cos(a)*len*.36, len*.42, Math.sin(a)*len*.36);
    st.rotation.z=-Math.cos(a)*.62; st.rotation.x=Math.sin(a)*.62; k.add(st);
    const b=new THREE.Mesh(new THREE.SphereGeometry(.5+w*.75,8,7), M(dom[e.domain]||F.orange,.65,.16));
    b.position.set(Math.cos(a)*len*.72, len*.84, Math.sin(a)*len*.72);
    b.castShadow=true; k.add(b);
  });
  g.userData.wipfel=k;
}
function puppe(g,farbe){
  const s=new THREE.Mesh(new THREE.CylinderGeometry(.3,.44,4.2,6), RINDE);
  s.position.y=2.1; s.castShadow=true; g.add(s);
  const k=new THREE.Group(); k.position.y=5.6; g.add(k);
  const alt=new THREE.Mesh(new THREE.SphereGeometry(1.05,8,7), M(farbe,.9));
  alt.material.transparent=true; alt.material.opacity=.35;
  alt.position.set(-1.7,-1.5,0); k.add(alt);
  const neu=new THREE.Mesh(new THREE.SphereGeometry(1.5,9,8), M(farbe,.55,.2));
  neu.scale.y=1.5; neu.castShadow=true; k.add(neu);
  const sp=new THREE.Mesh(new THREE.SphereGeometry(.55,7,6), M(F.gelb,.4,.5));
  sp.position.y=1.5; k.add(sp);
  g.userData.wipfel=k; g.userData.pfeil=neu;
}
function runde(g,p){
  const farben=[F.gruen,F.blau,F.rot];
  const k=new THREE.Group(); g.add(k);
  (p.participants||[]).forEach((pt,i)=>{
    const x=(i-1)*3.1, h=4.4+pt.weight*3.4;
    const st=new THREE.Mesh(new THREE.CylinderGeometry(.28,.42,h,6), RINDE);
    st.position.set(x,h/2,0); st.castShadow=true; k.add(st);
    const kp=new THREE.Mesh(new THREE.IcosahedronGeometry(.85+pt.weight*1.5,0), M(farben[i],.6,.16));
    kp.position.set(x,h+.7,0); kp.castShadow=true; k.add(kp);
  });
  /* Der Riss zwischen Mark und Ines — er wird nicht geschlossen */
  const punkte=[];
  for(let i=0;i<=10;i++){
    const t=i/10;
    punkte.push(new THREE.Vector3(-.2+t*6.4, 6.6+((i%2)?.55:-.55), 0));
  }
  const riss=new THREE.Mesh(
    new THREE.TubeGeometry(new THREE.CatmullRomCurve3(punkte),40,.13,5,false),
    M(F.rot,.5,.85));
  k.add(riss);
  g.userData.riss=riss; g.userData.wipfel=k;
}
function werkbank(g){
  const holz=new THREE.MeshStandardMaterial({color:0xb9905c, roughness:.9, flatShading:true});
  const pl=new THREE.Mesh(new THREE.BoxGeometry(7,.55,3.4), holz);
  pl.position.y=3.1; pl.castShadow=true; pl.receiveShadow=true; g.add(pl);
  [[-3,-1.3],[3,-1.3],[-3,1.3],[3,1.3]].forEach(([x,z])=>{
    const b=new THREE.Mesh(new THREE.BoxGeometry(.42,3.1,.42), holz);
    b.position.set(x,1.55,z); b.castShadow=true; g.add(b);
  });
  const zoll=new THREE.Mesh(new THREE.BoxGeometry(4.2,.2,.55), M(F.gelb,.5,.14));
  zoll.position.set(-1,3.48,0); zoll.rotation.y=.2; zoll.castShadow=true; g.add(zoll);
  const band=new THREE.Mesh(new THREE.CylinderGeometry(.85,.85,.5,14), M(F.rot,.55,.1));
  band.rotation.x=Math.PI/2; band.position.set(2.2,3.65,.3); band.castShadow=true; g.add(band);
  const licht=new THREE.Mesh(new THREE.SphereGeometry(1.1,10,9), M(F.gruen,.4,.55));
  licht.position.y=6.2; g.add(licht);
  g.userData.wipfel=licht;
}
function nadel(g){
  const so=new THREE.Mesh(new THREE.CylinderGeometry(1.6,2.1,1.1,12), M(0xb9b2a4,.9));
  so.position.y=.55; so.castShadow=true; so.receiveShadow=true; g.add(so);
  const st=new THREE.Mesh(new THREE.CylinderGeometry(.22,.28,3.4,6), RINDE);
  st.position.y=2.5; st.castShadow=true; g.add(st);
  const ring=new THREE.Mesh(new THREE.TorusGeometry(2,.16,8,30), M(F.gruen,.6,.12));
  ring.position.y=4.6; ring.rotation.x=Math.PI/2; g.add(ring);
  const n=new THREE.Mesh(new THREE.ConeGeometry(.55,3.2,6), M(F.gruen,.5,.3));
  n.position.y=4.6; n.rotation.z=-Math.PI/2; n.castShadow=true; g.add(n);
  g.userData.nadel=n; g.userData.wipfel=ring;

function bluete(g,gross){
  const h=gross?7.5:5.4;
  const st=new THREE.Mesh(new THREE.CylinderGeometry(.34,.5,h,6), M(0x6f8f4e,.9));
  st.position.y=h/2; st.castShadow=true; g.add(st);
  const k=new THREE.Group(); k.position.y=h; g.add(k);
  const bl=gross?9:7;
  for(let i=0;i<bl;i++){
    const a=i/bl*Math.PI*2;
    const b=new THREE.Mesh(new THREE.SphereGeometry(gross?1.5:1.15,8,7), M(F.gelb,.6,.2));
    b.scale.set(1,.5,1.7);
    b.position.set(Math.cos(a)*(gross?2.5:1.9), 0, Math.sin(a)*(gross?2.5:1.9));
    b.rotation.y=-a; b.castShadow=true; k.add(b);
  }
  const m=new THREE.Mesh(new THREE.SphereGeometry(gross?1.35:1,9,8), M(gross?F.orange:F.gelb,.5,.4));
  k.add(m);
  if(gross){
    /* Fernrohr auf dem Aussichtspunkt */
    const rohr=new THREE.Mesh(new THREE.CylinderGeometry(.45,.62,5,10), M(0x8d8a83,.5));
    rohr.position.set(2.6,1.6,0); rohr.rotation.z=-.75; rohr.castShadow=true; k.add(rohr);
  }
  g.userData.wipfel=k;
}
function knospe(g){
  const st=new THREE.Mesh(new THREE.CylinderGeometry(.24,.34,3.6,6), M(0x76786e,.95));
  st.position.y=1.8; g.add(st);
  const k=new THREE.Group(); k.position.y=4.4; g.add(k);
  const b=new THREE.Mesh(new THREE.SphereGeometry(1.5,9,9), M(SCHIEFER,.9));
  b.scale.y=1.6; b.castShadow=true; k.add(b);
  for(let i=0;i<3;i++){
    const a=i/3*Math.PI*2;
    const bl=new THREE.Mesh(new THREE.SphereGeometry(.72,7,7), M(0x6f7169,.9));
    bl.scale.set(.6,1.7,.6);
    bl.position.set(Math.cos(a)*.85,-.1,Math.sin(a)*.85);
    k.add(bl);
  }
  /* Schutzring — sie wird nicht geöffnet */
  const ring=new THREE.Mesh(new THREE.TorusGeometry(3.4,.1,6,50), M(SCHIEFER,.7,.25));
  ring.rotation.x=Math.PI/2; k.add(ring);
  g.userData.ring=ring; g.userData.wipfel=k;
}
function siegel(g,farbe,seite){
  const s=new THREE.Mesh(new THREE.SphereGeometry(.62,9,8),
    new THREE.MeshStandardMaterial({color:farbe, emissive:farbe, emissiveIntensity:.7, roughness:.4}));
  s.position.set(seite*2.4, 8.6, 0);
  g.add(s); g.userData.siegel=(g.userData.siegel||[]).concat(s);
}

/* ═══ Kanten zwischen den Objekten ═══ */
function kantenBauen(){
  const roh=[];
  SCHL.forEach(k=>{
    const p=P[k];
    (p.provenance.parents||[]).forEach(id=>{ const q=VON_ID[id]; if(q) roh.push({von:q,nach:k,art:'herkunft'}); });
    (p.references||[]).forEach(id=>{ const q=VON_ID[id];
      if(q&&q!==k&&!roh.some(e=>e.von===q&&e.nach===k)) roh.push({von:q,nach:k,art:'bezug'}); });
  });
  const ausA = t => ORT[t].kette===-1;
  roh.forEach(e=>{
    e.quer = ausA(e.von)!==ausA(e.nach);
    const a=weltVon(e.von), b=weltVon(e.nach);
    const hoch=(e.art==='bezug'? -1 : 1);
    const m=a.clone().add(b).multiplyScalar(.5);
    m.y += hoch*(10+a.distanceTo(b)*.16);
    m.x += (b.z-a.z)*.06; m.z -= (b.x-a.x)*.06;
    const kurve=new THREE.CatmullRomCurve3([a, m, b]);
    const farbe = e.quer? F.gelb : (e.art==='bezug'? SCHIEFER : 0x7fa85e);
    const rohr=new THREE.Mesh(new THREE.TubeGeometry(kurve, 44, e.quer?.34:.2, 6, false),
      new THREE.MeshStandardMaterial({color:farbe, emissive:farbe,
        emissiveIntensity:e.quer?.5:.25, roughness:.6, transparent:true, opacity:e.quer?.95:.62}));
    wurzel.add(rohr);
    /* Wanderlichter auf der Kante */
    const lichter=[];
    const n=e.quer?4:2;
    for(let i=0;i<n;i++){
      const l=new THREE.Mesh(new THREE.SphereGeometry(e.quer?.52:.36,8,7),
        new THREE.MeshBasicMaterial({color:farbe}));
      l.userData.t=i/n; wurzel.add(l); lichter.push(l);
    }
    KANTEN.push({...e, kurve, rohr, lichter});
  });
}
function weltVon(k){
  const s=stelle(k), i=NR[P[k].claim_ceiling];
  return new THREE.Vector3(s.x+VERSATZ[i][0], s.y+HOEHE[i]+5.5, s.z+VERSATZ[i][1]);
}

/* ═══ Atmosphäre ═══ */
let staub;
function bluetenstaub(){
  const n=420, pos=new Float32Array(n*3), gr=new Float32Array(n);
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2, r=18+Math.random()*70;
    pos[i*3]=Math.cos(a)*r; pos[i*3+1]=Math.random()*105; pos[i*3+2]=Math.sin(a)*r;
    gr[i]=Math.random();
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos,3));
  staub=new THREE.Points(g, new THREE.PointsMaterial({ color:0xfff0b0, size:.85,
    transparent:true, opacity:.75, depthWrite:false }));
  staub.userData.gr=gr;
  wurzel.add(staub);
}
function himmelDeko(){
  /* Wolkenbänke aus weichen Kugeln, weit hinten */
  const w=new THREE.MeshStandardMaterial({color:0xffffff, roughness:1, transparent:true, opacity:.75,
    flatShading:true});
  for(let i=0;i<7;i++){
    const g=new THREE.Group();
    const a=Math.random()*Math.PI*2, r=200+Math.random()*130;
    g.position.set(Math.cos(a)*r, 60+Math.random()*70, Math.sin(a)*r);
    for(let j=0;j<4;j++){
      const s=new THREE.Mesh(new THREE.IcosahedronGeometry(9+Math.random()*9,0), w);
      s.position.set((j-1.5)*11+Math.random()*5, Math.random()*5, Math.random()*7);
      s.scale.y=.55; g.add(s);
    }
    wurzel.add(g);
  }
  const sonne=new THREE.Mesh(new THREE.SphereGeometry(15,20,18),
    new THREE.MeshBasicMaterial({color:0xfff2c4, transparent:true, opacity:.92, fog:false}));
  sonne.position.set(-190,175,-130); wurzel.add(sonne);
}

/* ═══ Kamera: Inseln ↔ Schnitt ═══ */
function kameraSetzen(){
  const t=morph;
  const ziel=new THREE.Vector3(0, mische(46, 44, t), 0);
  /* Schnitt: weit weg, frontal, fast orthografisch */
  const gier = mische(0, bahn.gier, t);
  const nick = mische(0.055, bahn.nick, t);
  const dist = mische(560, bahn.dist, t);
  kamera.fov = mische(11.5, 42, t);
  kamera.updateProjectionMatrix();
  kamera.position.set(
    ziel.x + Math.sin(gier)*Math.cos(nick)*dist,
    ziel.y + Math.sin(nick)*dist,
    ziel.z + Math.cos(gier)*Math.cos(nick)*dist
  );
  kamera.lookAt(ziel);
}
const mische=(a,b,t)=>a+(b-a)*t;
const glaette=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const klemme=(v,a,b)=>v<a?a:v>b?b:v;

/* ═══ Schleife ═══ */
function schleife(){
  requestAnimationFrame(schleife);
  const t=uhr.getElapsedTime();

  if(Math.abs(zielMorph-morph)>.0006){ morph+=(zielMorph-morph)*.075; reglerSpiegeln(); }
  else morph=zielMorph;
  bahn.gier += (zielBahn.gier-bahn.gier)*.1;
  bahn.nick += (zielBahn.nick-bahn.nick)*.1;
  bahn.dist += (zielBahn.dist-bahn.dist)*.1;
  kameraSetzen();

  meerWellen(t);

  /* Inseln atmen leicht */
  inseln.forEach((ins,i)=>{
    const y=HOEHE[i] + (i? Math.sin(t*.42+i*1.7)*.9 : 0);
    ins.mesh.position.y=y; ins.grp.position.y=y;
  });

  /* Objekte leben */
  SCHL.forEach(k=>{
    const o=OBJ[k], u=o.grp.userData;
    if(u.wipfel) u.wipfel.rotation.y = Math.sin(t*.28 + k.charCodeAt(1))*.13;
    if(u.nadel)  u.nadel.rotation.y  = Math.sin(t*.5)*.32;
    if(u.ring)   u.ring.rotation.z   = t*.35;
    if(u.riss)   u.riss.material.emissiveIntensity = .55+.45*Math.sin(t*4.2);
    (u.siegel||[]).forEach((s,j)=>{ s.position.y = 8.6 + Math.sin(t*1.6+j)*.3; });
    o.grp.getWorldPosition(o.welt);
  });
  if(torRing){ torRing.rotation.z=t*.22; torSchloss.rotation.y=Math.sin(t*.6)*.2;
    torRing.material.emissiveIntensity=.42+.28*Math.sin(t*1.5); }

  /* Wanderlichter */
  KANTEN.forEach(e=>{
    const f=fokus(e);
    e.rohr.material.opacity = klemme((e.quer?.95:.62)*f, .05, 1);
    e.lichter.forEach(l=>{
      l.userData.t=(l.userData.t+ (e.art==='bezug'?.0016:.0026))%1;
      e.kurve.getPointAt(l.userData.t, l.position);
      l.visible = f>.4;
      l.scale.setScalar(f>1?1.5:1);
    });
  });

  /* Staub */
  const pos=staub.geometry.attributes.position;
  for(let i=0;i<pos.count;i++){
    let y=pos.getY(i)+ .022 + staub.userData.gr[i]*.02;
    if(y>112) y=-2;
    pos.setY(i,y);
    pos.setX(i, pos.getX(i)+Math.sin(t*.28+i)*.011);
  }
  pos.needsUpdate=true;

  renderer.render(szene,kamera);
  schilderSetzen();
}

function fokus(e){
  const a=(schwebt||gewaehlt);
  if(!a) return 1;
  return (e.von===a||e.nach===a)?2:.16;
}

/* ═══ Schilder als HTML über der Szene ═══ */
function schilderBauen(){
  const w=document.getElementById('schilder');
  w.innerHTML='';
  SCHL.forEach(k=>{
    const d=document.createElement('div');
    d.className='schild';
    d.innerHTML='<div class="pin" style="background:'+TYP_H[P[k].pattern_type]+'"></div>'+
                '<div class="n">'+TITEL[k]+'</div><div class="u">'+UNTER[k]+'</div>';
    d.onclick=()=>oeffneTafel(k);
    d.onpointerenter=()=>{ schwebt=k; };
    d.onpointerleave=()=>{ schwebt=null; };
    w.appendChild(d); schilderEl[k]=d;
  });
  etagenEl=[];
  STUFEN.forEach((st,i)=>{
    const leer=zaehle(st.id)===0;

    d.innerHTML=st.name+'<small>'+(leer?'0 Patterns — verschlossen':zaehle(st.id)+' Patterns · '+st.frage)+'</small>';
    w.appendChild(d); etagenEl.push(d);
  });
}
const _v=new THREE.Vector3();
function schilderSetzen(){
  const B=innerWidth, H=innerHeight;
  SCHL.forEach(k=>{
    const o=OBJ[k], el=schilderEl[k];
    _v.copy(o.welt); _v.y += 12;
    _v.project(kamera);
    const sichtbar = _v.z<1;
    if(!sichtbar){ el.style.display='none'; return; }
    el.style.display='';
    el.style.left=((_v.x*.5+.5)*B)+'px';
    el.style.top =((-_v.y*.5+.5)*H)+'px';
    const fern = (schwebt||gewaehlt) && (schwebt||gewaehlt)!==k;
    el.classList.toggle('fern', !!fern);
  });
  inseln.forEach((ins,i)=>{
    _v.set(VERSATZ[i][0], ins.mesh.position.y + (ins.leer? 20 : ins.amp+13), VERSATZ[i][1]);
    _v.x -= ins.radius*1.05;
    _v.project(kamera);
    const el=etagenEl[i];
    if(_v.z>1){ el.style.display='none'; return; }
    el.style.display='';
    el.style.left=((_v.x*.5+.5)*B)+'px';
    el.style.top =((-_v.y*.5+.5)*H)+'px';
  });
}

/* ═══ Steuerung ═══ */
function reglerSpiegeln(){
  const r=document.getElementById('regler');
  if(document.activeElement!==r) r.value=Math.round(morph*1000);
  document.getElementById('knopf').style.left=(morph*100)+'%';
  document.getElementById('knopf').textContent=morph>.5?'⛰':'◲';
  document.getElementById('endeSchnitt').classList.toggle('an',morph<.5);
  document.getElementById('endeLand').classList.toggle('an',morph>=.5);
}
function fahreZu(z){ zielMorph=z; }

let zieht=false, zx=0, zy=0, weg=0;
function steuerung(){
  const c=renderer.domElement;
  c.addEventListener('pointerdown',e=>{ zieht=true; weg=0; zx=e.clientX; zy=e.clientY;
    c.setPointerCapture(e.pointerId); });
  c.addEventListener('pointermove',e=>{
    if(zieht){
      const dx=e.clientX-zx, dy=e.clientY-zy; weg+=Math.abs(dx)+Math.abs(dy);
      if(morph>.2){
        zielBahn.gier -= dx*.006;
        zielBahn.nick = klemme(zielBahn.nick + dy*.004, -.05, 1.15);
      }
      zx=e.clientX; zy=e.clientY; return;
    }
    zeigen(e);
  });
  c.addEventListener('pointerup',e=>{
    if(zieht && weg<7){
      const k=treffer(e);
      if(k) oeffneTafel(k); else { gewaehlt=null; schliesseTafel(); }
    }
    zieht=false;
  });
  c.addEventListener('pointercancel',()=>{zieht=false});
  c.addEventListener('wheel',e=>{
    e.preventDefault();
    if(morph>.2) zielBahn.dist=klemme(zielBahn.dist + e.deltaY*.35, 90, 400);
    else zielMorph=klemme(zielMorph+(e.deltaY>0?.16:-.16),0,1);
  },{passive:false});
  addEventListener('resize',()=>{
    kamera.aspect=innerWidth/innerHeight; kamera.updateProjectionMatrix();
    renderer.setSize(innerWidth,innerHeight);
  });
  document.addEventListener('keydown',e=>{
    if(e.key==='Escape'){ allesZu(); return; }
    if(document.activeElement && /INPUT|TEXTAREA/.test(document.activeElement.tagName)) return;
    if(e.key==='ArrowRight'||e.key==='ArrowLeft'){
      e.preventDefault();
      const i=gewaehlt?SCHL.indexOf(gewaehlt):-1;
      oeffneTafel(SCHL[e.key==='ArrowRight'?(i+1)%SCHL.length:(i<=0?SCHL.length-1:i-1)]);
    }
    if(e.key==='2') fahreZu(0);
    if(e.key==='3') fahreZu(1);
  });
  document.getElementById('regler').addEventListener('input',ev=>{
    zielMorph=morph=+ev.target.value/1000; reglerSpiegeln();
  });
  document.getElementById('ueber').addEventListener('click',e=>{
    if(e.target.id==='ueber') schliesseUeber();
  });
}
function treffer(e){
  maus.x=(e.clientX/innerWidth)*2-1;
  maus.y=-(e.clientY/innerHeight)*2+1;
  strahl.setFromCamera(maus,kamera);
  const tr=strahl.intersectObjects(anklickbar,false);
  return tr.length? tr[0].object.userData.k : null;
}
function zeigen(e){
  const k=treffer(e);
  if(k!==schwebt){ schwebt=k; renderer.domElement.style.cursor=k?'pointer':(morph>.2?'grab':'default'); }
}

/* ═══ Daten ═══ */
function zaehle(id){ return SCHL.filter(k=>P[k].claim_ceiling===id).length; }
function leisteBauen(){
  let h='<div class="leiste-k">Geltung ist Höhe</div>';
  for(let i=STUFEN.length-1;i>=0;i--){
    const st=STUFEN[i], n=zaehle(st.id), leer=n===0;
    h+='<div class="st'+(leer?' leer':'')+'" onclick="'+(leer?'oeffneDecke()':'zurStufe(\''+st.id+'\')')+'">'+
       '<span class="z" style="'+(leer?'':'background:'+st.hex)+'">'+n+'</span>'+
       '<span class="t"><b>'+st.name+'</b><span>'+(leer?'für kein Pattern erreichbar':st.frage)+'</span></span></div>';
  }
  h+='<div class="leiste-f">Kein Pattern erreicht die oberste Insel. Handlung entsteht nur als '+
     '<b>menschlich autorisierter Akt</b> — nie als Eigenschaft.</div>';
  document.getElementById('leiste').innerHTML=h;
}
function zurStufe(id){
  const t=SCHL.filter(k=>P[k].claim_ceiling===id);
  if(t.length) oeffneTafel(t[0]);
}

function inhalt(k){

        blk('Was gesehen wurde — und was nicht','<div class="k2">'+

    case 'potential': { const cs=p.candidate_space, c=p.constraints;

function pruefe(){
  const ein=document.getElementById('pruefFeld').value.trim();
  const el=document.getElementById('pruefUrteil');
  if(!ein){ el.className='urteil u-leer'; el.textContent='Noch nichts eingegeben.'; return; }
  const tr=[];
  DATEN.profile.forbidden_claims.forEach(f=>{
    let re; try{ re=new RegExp(f.pattern,'i'); }catch(x){ return; }
    const m=re.exec(ein); if(m) tr.push({f,m});
  });
  if(!tr.length){
    el.className='urteil u-frei';
    el.innerHTML='<b style="color:'+FH.gruen+';font-size:1rem">✓ Keine unzulässige Form.</b><br>'+
      '<span style="font-size:.83rem">Bleibt die zweite Frage: auf welcher <b>Insel</b> darf dieser Satz stehen? '+
      'Eine Beobachtung deckelt bei <b>erscheinung</b>, eine Deutung bei <b>perspektiv</b>. '+
      'Und keine Stufe ersetzt die Unterschrift eines Menschen.</span>';
  }else{
    el.className='urteil u-stopp';
    el.innerHTML='<b style="color:'+FH.rot+';font-size:1rem">✗ Unzulässig — '+tr.length+' Form'+
      (tr.length>1?'en':'')+' erkannt.</b>'+
      tr.map(t=>'<div class="verstoss"><b>'+e_(t.f.name)+'</b> — '+e_(t.f.why)+'<div style="margin-top:6px">'+
        e_(ein.slice(0,t.m.index))+'<mark>'+e_(t.m[0])+'</mark>'+e_(ein.slice(t.m.index+t.m[0].length))+
        '</div></div>').join('')+
      '<div style="font-size:.79rem;margin-top:9px;color:var(--tinte2)">Das System verwaltet <b>Übergänge</b>, '+
      'keine Eigenschaften.</div>';
  }
}

async function start(){
  try{

    if(typeof EINGEBETTETE_DATEN!=='undefined'){ DATEN=EINGEBETTETE_DATEN; }
    else{
      const r=await fetch('lena-stallbox.json');
      if(!r.ok) throw new Error('HTTP '+r.status+' für lena-stallbox.json');
      DATEN=await r.json();
    }
    DATEN.patterns.forEach((p,i)=>{ VON_ID[p.id]=SCHL[i]; P[SCHL[i]]=p; });
    bauen(); leisteBauen(); schilderBauen(); steuerung(); reglerSpiegeln();
    schleife();
    setTimeout(()=>document.getElementById('laden').classList.add('weg'), 300);
    setTimeout(()=>hinweis('Ziehen dreht die Inseln · Regler unten wechselt zum Schnitt'), 1400);
  }catch(e){
    document.getElementById('laden').innerHTML='<div><b>Konnte nicht laden</b>'+
      String(e && e.message || e)+'</div>';
  }
}
start();
</script>
</body>
