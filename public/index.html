<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FASKA Invaria 2 · Lernlandschaft — Der Lena-Fall</title>
<link rel="icon" href="faska-logo-official.svg">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.3/p5.min.js"></script>
<script>p5.disableFriendlyErrors=true;</script>
<style>
:root {
  --blue:#3da6da; --red:#bd182a; --orange:#e25e2b; --green:#44a735; --yellow:#ffce05;
  --blue-soft:rgba(61,166,218,.10); --red-soft:rgba(189,24,42,.08); --orange-soft:rgba(226,94,43,.10);
  --green-soft:rgba(68,167,53,.10); --yellow-soft:rgba(255,206,5,.14);
  --bg:#fefcf7; --bg2:#f8f4eb; --text:#2d2412; --text2:#6b5e48; --card:#fff;
  --border:#e8e0d0; --shadow:0 2px 12px rgba(0,0,0,0.06);
  --radius:18px; --radius-sm:12px;
  --font:'Inter',system-ui,sans-serif; --mono:'JetBrains Mono',monospace;
  --nav-h:56px; --cycle-h:52px;
}
.dark{--bg:#1a1814;--bg2:#22201a;--text:#e8e2d4;--text2:#9e9680;--card:#282520;--border:#3a3428;--shadow:0 2px 16px rgba(0,0,0,0.3);
  --blue-soft:rgba(61,166,218,.16);--red-soft:rgba(189,24,42,.16);--orange-soft:rgba(226,94,43,.16);--green-soft:rgba(68,167,53,.16);--yellow-soft:rgba(255,206,5,.14)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;font:14px/1.5 var(--font);color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased}
canvas{display:block}
#gardenCanvas{position:fixed;inset:var(--nav-h) 0 var(--cycle-h) 0;z-index:1}

/* ── Header ── */
.hdr{position:fixed;z-index:20;top:0;left:0;right:0;height:var(--nav-h);display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:var(--card);border-bottom:1px solid var(--border);box-shadow:var(--shadow)}
.logo{display:flex;align-items:center;gap:9px;cursor:pointer;color:var(--text);font-weight:800;font-size:1rem;letter-spacing:-0.02em;white-space:nowrap}
.logo img{width:30px;height:auto}
.logo small{display:block;font-size:.58rem;font-weight:600;color:var(--text2);letter-spacing:.05em}
.hdr-r{display:flex;gap:5px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.hdr-btn{padding:7px 13px;border-radius:24px;border:1.5px solid var(--border);background:var(--card);color:var(--text);cursor:pointer;font:600 12px var(--font);transition:all .2s;white-space:nowrap}
.hdr-btn:hover{border-color:var(--blue);color:var(--blue)}
.hdr-btn.active{background:var(--blue);color:#fff;border-color:var(--blue)}
.theme-btn{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--border);background:var(--card);cursor:pointer;font-size:1.1rem;display:flex;align-items:center;justify-content:center;transition:all .2s;flex-shrink:0}
.theme-btn:hover{border-color:var(--yellow)}

/* ── Cycle nav ── */
.cyc{position:fixed;z-index:20;bottom:0;left:0;right:0;height:var(--cycle-h);display:flex;align-items:center;justify-content:center;gap:3px;padding:0 10px;background:var(--card);border-top:1px solid var(--border);box-shadow:0 -2px 12px rgba(0,0,0,0.04)}
.cyc-btn{padding:7px 15px;border-radius:22px;border:none;background:transparent;color:var(--text2);cursor:pointer;font:600 12px var(--font);transition:all .25s;white-space:nowrap}
.cyc-btn:hover{color:var(--text)}
.cyc-btn.active{background:var(--green);color:#fff}
.cyc-lbl{font-size:.62rem;text-transform:uppercase;letter-spacing:.09em;color:var(--text2);margin-right:6px;font-weight:700}

/* ── Detail panel ── */
.pnl{position:fixed;z-index:30;right:12px;top:66px;width:430px;max-width:calc(100vw - 20px);max-height:calc(100vh - 132px);background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:0 16px 48px rgba(0,0,0,.14);overflow-y:auto;transform:translateX(120%);transition:transform .35s cubic-bezier(.22,1,.36,1)}
.pnl.open{transform:translateX(0)}
.pnl-in{padding:22px}
.pnl h2{font-size:1.18rem;font-weight:800;margin:6px 0 2px;letter-spacing:-0.01em}
.pnl .meta{font-size:.72rem;color:var(--text2);margin-bottom:16px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pnl .sec{margin-bottom:18px}
.pnl .sec>h3{font-size:.64rem;text-transform:uppercase;letter-spacing:.1em;color:var(--green);margin-bottom:7px;font-weight:800}
.pnl .sec p,.pnl .sec li{font-size:.83rem;line-height:1.6}
.pnl ul{padding-left:18px}
.pnl .close{position:sticky;top:0;float:right;width:32px;height:32px;border-radius:50%;border:1.5px solid var(--border);background:var(--card);color:var(--text2);cursor:pointer;font-size:1.1rem;display:flex;align-items:center;justify-content:center;z-index:2;transition:all .2s}
.pnl .close:hover{border-color:var(--red);color:var(--red)}

/* ── Reusable bits ── */
.pchip{display:inline-block;font-size:.62rem;font-weight:800;text-transform:uppercase;letter-spacing:.08em;padding:3px 10px;border-radius:12px;color:#fff}
.chip{display:inline-block;font-size:.7rem;font-weight:600;padding:3px 10px;border-radius:12px;margin:2px 3px 2px 0;border:1px solid var(--border);background:var(--bg2);color:var(--text)}
.chip-b{background:var(--blue-soft);border-color:transparent;color:var(--blue)}
.chip-r{background:var(--red-soft);border-color:transparent;color:var(--red)}
.chip-o{background:var(--orange-soft);border-color:transparent;color:var(--orange)}
.chip-g{background:var(--green-soft);border-color:transparent;color:var(--green)}
.chip-y{background:var(--yellow-soft);border-color:transparent;color:#8a6d00}
.dark .chip-y{color:var(--yellow)}
.chip-n{opacity:.75}
.quote{font-size:.9rem;line-height:1.65;padding:13px 15px;border-radius:var(--radius-sm);background:var(--bg2);border-left:3px solid var(--blue);font-weight:500}
.quote.q-y{border-left-color:var(--yellow)}
.quote.q-r{border-left-color:var(--red)}
.quote.q-g{border-left-color:var(--green)}
.kv{display:flex;gap:8px;font-size:.78rem;margin:4px 0}
.kv .k{color:var(--text2);min-width:120px;font-weight:600;flex-shrink:0}
.bar{height:7px;border-radius:4px;background:var(--bg2);overflow:hidden;margin:4px 0 8px;border:1px solid var(--border)}
.bar i{display:block;height:100%;border-radius:4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.mono{font-family:var(--mono);font-size:.68rem;color:var(--text2)}
.prov{margin-top:14px;padding:10px 12px;border-radius:var(--radius-sm);background:var(--bg2);border:1px dashed var(--border);font-size:.68rem;line-height:1.55;color:var(--text2)}
.prov b{color:var(--text)}
.mini-btn{padding:5px 12px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--text2);cursor:pointer;font:600 11px var(--font);transition:all .2s}
.mini-btn:hover{border-color:var(--blue);color:var(--blue)}
.prim-btn{display:block;width:100%;padding:11px;border-radius:var(--radius-sm);border:none;background:var(--blue);color:#fff;font:700 13px var(--font);cursor:pointer;margin-top:8px;transition:all .2s}
.prim-btn:hover{filter:brightness(1.08);transform:translateY(-1px)}
.prim-btn.g{background:var(--green)} .prim-btn.o{background:var(--orange)} .prim-btn.r{background:var(--red)} .prim-btn.y{background:var(--yellow);color:#4a3a00}
.badge{display:inline-block;font-size:.62rem;font-weight:800;padding:2px 9px;border-radius:10px;text-transform:uppercase;letter-spacing:.05em}
.b-blue{background:var(--blue-soft);color:var(--blue)} .b-y{background:var(--yellow-soft);color:#8a6d00}
.dark .b-y{color:var(--yellow)}
.b-o{background:var(--orange-soft);color:var(--orange)} .b-g{background:var(--green-soft);color:var(--green)}
.b-r{background:var(--red-soft);color:var(--red)} .b-n{background:rgba(120,110,90,.12);color:var(--text2)}

/* Review cards (Bezüge prüfen) */
.rc{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 14px;margin-bottom:8px;transition:all .2s}
.rc-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:5px}
.rc-title{font-weight:700;font-size:.8rem}
.rc-acts{display:flex;gap:5px;margin-top:8px}
.rc-btn{padding:4px 10px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--text2);cursor:pointer;font:600 10.5px var(--font);transition:all .2s}
.rc-btn.ok:hover{background:var(--green-soft);border-color:var(--green);color:var(--green)}
.rc-btn.lim:hover{background:var(--orange-soft);border-color:var(--orange);color:var(--orange)}
.rc-btn.no:hover{background:var(--red-soft);border-color:var(--red);color:var(--red)}
.rc-status{font-size:.65rem;padding:3px 9px;border-radius:10px;font-weight:700;white-space:nowrap}
.rc-st0{background:rgba(120,110,90,.1);color:var(--text2)}
.rc-st1{background:var(--green-soft);color:var(--green)}
.rc-st2{background:var(--orange-soft);color:var(--orange)}
.rc-st3{background:var(--red-soft);color:var(--red)}

/* Entry-point cards (Möglichkeitsraum) */
.ep{background:var(--bg2);border:2px solid transparent;border-radius:var(--radius-sm);padding:11px 12px;cursor:pointer;transition:all .2s;margin-bottom:6px;display:flex;gap:10px;align-items:flex-start}
.ep:hover{border-color:var(--orange)}
.ep.sel{border-color:var(--green);background:var(--green-soft)}
.ep .dot{width:11px;height:11px;border-radius:50%;flex-shrink:0;margin-top:3px}
.ep .t{font-weight:700;font-size:.78rem}
.ep .d{font-size:.72rem;color:var(--text2);margin-top:1px}

/* ── Overlays ── */
.ovl{position:fixed;z-index:50;inset:0;background:rgba(40,32,16,.55);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .3s;padding:14px}
.ovl.on{opacity:1;pointer-events:all}
.ovl-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:26px 28px;max-width:660px;width:100%;max-height:88vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.ovl-card.wide{max-width:900px}
.ovl-card h2{font-size:1.22rem;font-weight:800;margin-bottom:4px;letter-spacing:-0.01em}
.ovl-card .sub{font-size:.8rem;color:var(--text2);margin-bottom:16px}
.ovl-card .close{float:right;width:30px;height:30px;border-radius:50%;border:1.5px solid var(--border);background:var(--card);cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center;transition:all .2s}
.ovl-card .close:hover{border-color:var(--red);color:var(--red)}

/* ── Übersetzungs-Brücke ── */
.bridge{display:grid;grid-template-columns:1fr 110px 1fr;gap:0;margin:14px 0 6px;align-items:stretch}
.br-col{border-radius:var(--radius-sm);padding:15px;font-size:.8rem;line-height:1.6}
.br-col h4{font-size:.64rem;text-transform:uppercase;letter-spacing:.09em;margin-bottom:8px;font-weight:800}
.br-obs{background:var(--blue-soft);border:1.5px solid rgba(61,166,218,.35)}
.br-obs h4{color:var(--blue)}
.br-deut{background:var(--yellow-soft);border:1.5px solid rgba(255,206,5,.45)}
.br-deut h4{color:#8a6d00}.dark .br-deut h4{color:var(--yellow)}
.br-river{position:relative;margin:0 8px;border-radius:14px;overflow:hidden;background:linear-gradient(180deg,rgba(61,166,218,.07),rgba(61,166,218,.16));min-height:180px}
.br-river::before{content:'';position:absolute;inset:-40px 0;background:repeating-linear-gradient(180deg,transparent 0 16px,rgba(61,166,218,.22) 16px 18px);animation:flow 2.4s linear infinite}
@keyframes flow{to{transform:translateY(34px)}}
.br-badge{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:var(--card);border:1.5px solid var(--blue);color:var(--blue);font:800 .6rem var(--font);padding:7px 9px;border-radius:12px;text-align:center;z-index:2;box-shadow:var(--shadow);letter-spacing:.04em;line-height:1.4}
.br-note{font-size:.74rem;color:var(--text2);text-align:center;font-style:italic;margin:8px 0 14px}

/* ── Spannungsfeld ── */
.tension{display:grid;grid-template-columns:1fr 86px 1fr;gap:8px;align-items:stretch;margin:14px 0}
.t-bubble{border-radius:var(--radius-sm);padding:14px;font-size:.8rem;line-height:1.55}
.t-bubble b{display:block;font-size:.76rem;margin-bottom:5px}
.t-bubble em{display:block;font-style:normal;margin-top:6px;font-size:.83rem;font-weight:600}
.t-b{background:var(--blue-soft);border:1.5px solid rgba(61,166,218,.4);animation:leanL 3.2s ease-in-out infinite}
.t-r{background:var(--red-soft);border:1.5px solid rgba(189,24,42,.35);animation:leanR 3.2s ease-in-out infinite}
@keyframes leanL{0%,100%{transform:translateX(0)}50%{transform:translateX(5px)}}
@keyframes leanR{0%,100%{transform:translateX(0)}50%{transform:translateX(-5px)}}
.t-gap{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px}
.t-bolt{font-size:1.5rem;animation:bolt 1.1s ease-in-out infinite}
@keyframes bolt{0%,100%{opacity:.35;transform:scale(.9)}50%{opacity:1;transform:scale(1.15)}}
.t-label{font-size:.56rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--red);text-align:center;line-height:1.5}

/* Outcomes */
.out-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.out-card{border-radius:var(--radius-sm);padding:11px 13px;font-size:.76rem;line-height:1.55}
.out-card h5{font-size:.6rem;text-transform:uppercase;letter-spacing:.08em;margin-bottom:5px;font-weight:800}
.o-g{background:var(--green-soft);border-left:3px solid var(--green)} .o-g h5{color:var(--green)}
.o-o{background:var(--orange-soft);border-left:3px solid var(--orange)} .o-o h5{color:var(--orange)}
.o-y{background:var(--yellow-soft);border-left:3px solid var(--yellow)} .o-y h5{color:#8a6d00}.dark .o-y h5{color:var(--yellow)}
.o-b{background:var(--blue-soft);border-left:3px solid var(--blue)} .o-b h5{color:var(--blue)}

/* ── Claim-Prüfung ── */
.claim-in{width:100%;min-height:74px;border-radius:var(--radius-sm);border:2px solid var(--border);background:var(--bg2);padding:12px 14px;font:500 .92rem var(--font);color:var(--text);resize:vertical;transition:border-color .2s}
.claim-in:focus{outline:none;border-color:var(--blue)}
.claim-res{margin-top:12px;border-radius:var(--radius-sm);padding:15px 17px;font-size:.85rem;line-height:1.6;transition:all .3s}
.cr-ok{background:var(--green-soft);border:1.5px solid rgba(68,167,53,.5)}
.cr-bad{background:var(--red-soft);border:1.5px solid rgba(189,24,42,.5)}
.cr-idle{background:var(--bg2);border:1.5px dashed var(--border);color:var(--text2)}
.vcard{background:var(--card);border:1px solid var(--border);border-left:3px solid var(--red);border-radius:10px;padding:10px 13px;margin-top:8px;font-size:.78rem;line-height:1.55}
.vcard b{color:var(--red)}
mark{background:rgba(189,24,42,.22);color:inherit;border-radius:3px;padding:0 2px}
.ladder{margin:12px 0;display:flex;flex-direction:column;gap:5px}
.rung{display:flex;align-items:center;gap:10px;border-radius:10px;padding:9px 14px;font-size:.78rem;border:1px solid var(--border);background:var(--bg2)}
.rung .lv{font-weight:800;min-width:96px;font-size:.74rem;text-transform:uppercase;letter-spacing:.04em}
.rung .who{color:var(--text2);font-size:.72rem}
.rung.r1{border-left:4px solid var(--blue)} .rung.r1 .lv{color:var(--blue)}
.rung.r2{border-left:4px solid var(--yellow)} .rung.r2 .lv{color:#8a6d00}.dark .rung.r2 .lv{color:var(--yellow)}
.rung.r3{border-left:4px solid var(--orange)} .rung.r3 .lv{color:var(--orange)}
.rung.r4{border:1.5px dashed var(--red);background:var(--red-soft)} .rung.r4 .lv{color:var(--red)}

/* ── Voice ── */
.mic-zone{display:flex;flex-direction:column;align-items:center;gap:12px;padding:16px 0 8px}
.mic-btn{width:86px;height:86px;border-radius:50%;border:none;background:var(--blue);color:#fff;font-size:2rem;cursor:pointer;transition:all .25s;box-shadow:0 6px 24px rgba(61,166,218,.4)}
.mic-btn:hover{transform:scale(1.06)}
.mic-btn.rec{background:var(--red);box-shadow:0 0 0 0 rgba(189,24,42,.5);animation:pulse 1.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(189,24,42,.45)}70%{box-shadow:0 0 0 22px rgba(189,24,42,0)}100%{box-shadow:0 0 0 0 rgba(189,24,42,0)}}
.wave-wrap{width:100%;height:86px;border-radius:var(--radius-sm);background:var(--bg2);border:1px solid var(--border);overflow:hidden}
.wave-wrap canvas{width:100%;height:100%}
.rec-timer{font-family:var(--mono);font-size:.8rem;color:var(--text2)}
.rec-dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--red);margin-right:6px;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.15}}
.seg{border-radius:var(--radius-sm);padding:11px 14px;margin-bottom:8px;font-size:.84rem;line-height:1.65}
.seg-tag{display:inline-block;font-size:.58rem;font-weight:800;text-transform:uppercase;letter-spacing:.08em;margin-bottom:5px;padding:2px 8px;border-radius:8px}
.seg-obs{background:var(--blue-soft);border:1px solid rgba(61,166,218,.3)} .seg-obs .seg-tag{background:var(--blue);color:#fff}
.seg-deut{background:var(--yellow-soft);border:1px solid rgba(255,206,5,.4)} .seg-deut .seg-tag{background:var(--yellow);color:#4a3a00}
.seg-kind{background:transparent;border:1.5px dashed var(--border);color:var(--text2);font-style:italic}
.seg-kind .seg-tag{background:var(--bg2);border:1px solid var(--border);color:var(--text2)}

/* ── Toast / Tooltip / Legend ── */
.toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 22px;border-radius:24px;font-size:.83rem;font-weight:700;z-index:80;opacity:0;transition:all .3s;pointer-events:none;max-width:88vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-6px)}
.tt{position:fixed;z-index:25;pointer-events:none;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:9px 13px;font-size:.78rem;box-shadow:var(--shadow);opacity:0;transition:opacity .15s;max-width:230px}
.tt.on{opacity:1}
.tt .ttn{font-weight:700}
.tt .ttd{font-size:.68rem;color:var(--text2);margin-top:2px}
.leg{position:fixed;z-index:15;left:14px;top:68px;display:flex;flex-direction:column;gap:4px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 13px;box-shadow:var(--shadow);max-width:190px}
.leg-i{display:flex;align-items:center;gap:7px;font-size:.66rem;color:var(--text2);font-weight:500}
.leg-d{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.leg .freeze{margin-top:6px;padding-top:6px;border-top:1px solid var(--border);font-size:.6rem;line-height:1.5;color:var(--green);font-weight:700}
.load-err{position:fixed;inset:0;z-index:99;display:flex;align-items:center;justify-content:center;background:var(--bg)}
.load-err>div{max-width:420px;text-align:center;padding:30px;font-size:.9rem;line-height:1.7}

@media(max-width:760px){
  .pnl{right:4px;top:60px;width:calc(100vw - 8px);max-height:calc(100vh - 120px)}
  .hdr{padding:0 8px}
  .hdr-btn{padding:5px 8px;font-size:10px}
  .hdr-btn .lbl{display:none}
  .logo{font-size:.8rem}.logo small{display:none}
  .leg{display:none}
  .cyc-btn{padding:5px 7px;font-size:9.5px}
  .cyc-lbl{display:none}
  .bridge{grid-template-columns:1fr}
  .br-river{min-height:54px;margin:8px 0}
  .br-river::before{background:repeating-linear-gradient(90deg,transparent 0 16px,rgba(61,166,218,.22) 16px 18px)}
  .tension{grid-template-columns:1fr}
  .t-gap{flex-direction:row;padding:4px 0}
  .out-grid,.grid2{grid-template-columns:1fr}
  .grid3{grid-template-columns:1fr}
  .ovl-card{padding:18px}
}
</style>
</head>
<body>

<header class="hdr">
  <div class="logo" onclick="resetAll()">
    <img src="faska-logo-official.svg" alt="FASKA" onerror="this.outerHTML='🌱'">
    <div>FASKA Invaria 2<small>LERNLANDSCHAFT · DER LENA-FALL</small></div>
  </div>
  <div class="hdr-r">

  <div style="font-size:2.4rem;margin-bottom:10px">🥀</div>
  <b>Daten konnten nicht geladen werden.</b><br>
  <span id="loadErrMsg" class="mono"></span><br><br>
  <button class="mini-btn" onclick="location.reload()">Neu versuchen</button>
</div></div>

<script>
/* ═══════════════════════════════════════════════════════════════════
   FASKA INVARIA 2 — Lernlandschaft auf dem eingefrorenen Kern
   Daten: lena-stallbox.json (12 Patterns aus lena_stallbox.py)
   + faska.json-Profil (Deckel, verbotene Behauptungsformen)
   ═══════════════════════════════════════════════════════════════════ */

const HUES = {blue:203, red:353, orange:17, green:105, yellow:48};
const HEX  = {blue:'#3da6da', red:'#bd182a', orange:'#e25e2b', green:'#44a735', yellow:'#ffce05'};
const KEYS = ['a1','a2','b1','b2','b3','b4','b5','bd','b6','b7','b8','kn'];
const TITLES = {
  a1:'Regalbau — erste Spur', a2:'Regalbau — Verbindung',
  b1:'Stallbox-Modell', b2:'Stallbox — Verbindung (KI-Vorschlag)',
  b3:'Möglichkeitsraum Stallbox', b4:'Vom Schätzen zum Messen',
  b5:'Teamsitzung 05.06.2026', bd:'Die schlafende Knospe',
  b6:'Zollstock & Maßband', b7:'Was die Umgebung nahelegt',
  b8:'Wirkung — die Futterraufe', kn:'Entwicklungsknoten'
};
const NEXT = {a1:'a2', a2:'b1', b1:'b2', b2:'b3', b3:'b4', b4:'b5', b5:'b6', b6:'b7', b7:'b8', b8:'kn'};

let DATA=null, P={}, KEY_BY_ID={}, plants={}, edges=[], buds=[];
let hovered=null, selected=null, activeStep='encounter', dark=false;
let reviewStates={};   // user verdicts on relation evidence
let selEntry=null;     // selected entry point in b3

/* ── Daten laden ── */
async function loadData(){
  try{
    const r=await fetch('lena-stallbox.json');
    if(!r.ok) throw new Error('HTTP '+r.status);
    DATA=await r.json();
    DATA.patterns.forEach((p,i)=>{ KEY_BY_ID[p.id]=KEYS[i]; P[KEYS[i]]=p; });
    buildGarden();
    const v=DATA.chain_validation;
    document.getElementById('freezeBadge').innerHTML=
      'Freeze-Test ✓<br>'+DATA.patterns.length+' Patterns · '+v.critical+' kritische Verstöße<br>Überbehauptung abgewiesen';
  }catch(e){
    document.getElementById('loadErr').style.display='flex';
    document.getElementById('loadErrMsg').textContent=String(e);
    throw e;
  }
}

/* ── Garten-Geometrie aus den Daten bauen ── */
const LAYOUT={
  a1:{x:.075,y:.70,s:.60}, a2:{x:.140,y:.575,s:.50},
  b1:{x:.215,y:.665,s:1.00}, b2:{x:.315,y:.545,s:.78},
  b3:{x:.415,y:.665,s:.92}, b4:{x:.495,y:.520,s:.74},
  bd:{x:.565,y:.822,s:.56}, b5:{x:.625,y:.600,s:.92},
  b6:{x:.715,y:.500,s:.80}, b7:{x:.775,y:.690,s:.72},
  b8:{x:.845,y:.560,s:.85}, kn:{x:.905,y:.400,s:1.00}
};
const EDGE_STYLE={b5:'tension', kn:'gold', bd:'dormant'};

function buildGarden(){
  plants={};
  KEYS.forEach(k=>{
    const p=P[k], l=LAYOUT[k];
    plants[k]={key:k, x:l.x, y:l.y, s:l.s, type:p.pattern_type, p,
               hue:hueFor(k,p), r:(30+l.s*16)};
  });
  edges=[];
  KEYS.forEach(k=>{
    const p=P[k];
    (p.provenance.parents||[]).forEach(pid=>{
      const pk=KEY_BY_ID[pid];
      if(pk) edges.push({from:pk, to:k, style:EDGE_STYLE[k]||'flow'});
    });
  });
}
function hueFor(k,p){
  if(k==='bd') return 215;
  if(k==='kn') return HUES.yellow;
  const m={appearance:HUES.blue, relation:HUES.yellow, potential:HUES.orange,
           transition:HUES.orange, coordination:HUES.red, embodiment:HUES.green,
           orientation:HUES.green, renewal:HUES.yellow, dormancy:215};
  return m[p.pattern_type]||HUES.green;
}

/* ═══════════════ P5-GARTEN ═══════════════ */
const sketch=p=>{
  const parts=[], amb=[];
  edges.forEach(e=>{ for(let i=0;i<3;i++) parts.push({e, t:Math.random(), sp:.0016+Math.random()*.0022, sz:2+Math.random()*2.4}); });
  for(let i=0;i<26;i++) amb.push({x:Math.random(), y:Math.random()*.7, sp:.00006+Math.random()*.00016, ph:Math.random()*6.28, sz:1.4+Math.random()*2.4});

  function resize(){ p.resizeCanvas(window.innerWidth, window.innerHeight-108); }
  p.setup=()=>{ const c=p.createCanvas(1,1); c.id('gardenCanvas'); p.pixelDensity(1); p.colorMode(p.HSB,360,100,100,100); resize(); };
  p.windowResized=resize;

  function qbez(a,c,b,t){ const u=1-t; return {x:u*u*a.x+2*u*t*c.x+t*t*b.x, y:u*u*a.y+2*u*t*c.y+t*t*b.y}; }

  p.draw=()=>{
    if(!DATA) return;
    const W=p.width, H=p.height, t=p.millis();
    /* Himmel */
    if(dark){ p.background(38,18,10); for(let i=0;i<H;i++){p.stroke(38,18,10+4*(1-i/H));p.line(0,i,W,i);} }
    else{ p.background(44,14,99); for(let i=0;i<H;i++){p.stroke(44,16-6*(i/H),99-3*(i/H));p.line(0,i,W,i);} }

    /* Sonne / Mond */
    const sx=W*.09, sy=H*.13;
    if(dark){ p.fill(48,12,92,18); p.noStroke(); p.circle(sx,sy,74); p.fill(48,10,96,90); p.circle(sx,sy,40); p.fill(38,18,10,90); p.circle(sx+9,sy-5,32); }
    else{ for(let g=4;g>0;g--){p.fill(48,60,100,4.5/g);p.noStroke();p.circle(sx,sy,60+g*46);} p.fill(48,72,100,95); p.circle(sx,sy,52); }

    /* Wolken */
    p.noStroke();
    for(let i=0;i<3;i++){
      const cx=((t*.000012*(i+1))+i*.37)%1.3*W-W*.15, cy=H*(.09+i*.055);
      p.fill(dark?40:44, dark?10:18, dark?22:100, dark?28:38);
      p.ellipse(cx,cy,120+i*30,26+i*5); p.ellipse(cx+50,cy+7,80,20); p.ellipse(cx-46,cy+8,70,18);
    }

    /* Boden */
    const gY=H*.80;
    p.fill(dark?98:105, dark?22:32, dark?18:62, 90); p.rect(0,gY,W,H-gY);
    p.fill(dark?98:105, dark?18:26, dark?13:48, 95); p.rect(0,gY+H*.09,W,H);
    p.noFill(); p.stroke(dark?105:105, 30, dark?26:70, 60); p.strokeWeight(2);
    p.beginShape(); for(let x=0;x<=W;x+=14) p.vertex(x, gY+4*Math.sin(x*.02+2)); p.endShape();

    /* Hügel des Aussichtspunkts */
    const kx=LAYOUT.kn.x*W, ky=LAYOUT.kn.y*H;
    p.noStroke(); p.fill(105, dark?20:34, dark?22:70, 95);
    p.beginShape(); p.vertex(kx-W*.115, gY+8);
    p.bezierVertex(kx-W*.06, gY-H*.10, kx-W*.028, ky+34, kx, ky+30);
    p.bezierVertex(kx+W*.03, ky+34, kx+W*.075, gY-H*.05, kx+W*.115, gY+8);
    p.endShape(p.CLOSE);

    /* Ketten-Beschriftungen im Boden */
    p.textAlign(p.CENTER); p.textSize(9.5);
    p.fill(dark?'rgba(232,226,212,.30)':'rgba(45,36,18,.30)');
    p.text('KETTE A · REGALBAU · MAI', W*.108, gY+H*.055);
    p.text('KETTE B · STALLBOX · JUNI', W*.47, gY+H*.055);
    p.text('HALBJAHRESRÜCKBLICK', kx, gY+H*.055);

    /* Kanten (provenance parents → child) */
    edges.forEach(e=>{
      const a=plants[e.from], b=plants[e.to];
      const ax=a.x*W, ay=a.y*H-a.r*.4, bx=b.x*W, by=b.y*H-b.r*.4;
      const mx=(ax+bx)/2, my=Math.min(ay,by)-34-Math.abs(bx-ax)*.08;
      let h=105,s=28,br=64,al=16,w=1.4;
      if(e.style==='tension'){ h=HUES.red; s=55; br=58; al=24; w=2; }
      if(e.style==='gold'){ h=HUES.yellow; s=62; br=86; al=26; w=2.2; }
      if(e.style==='dormant'){ h=215; s=18; br=52; al=20; w=1.4; }
      p.noFill(); p.stroke(h,s,br,al); p.strokeWeight(w);
      p.drawingContext.setLineDash(e.style==='dormant'?[3,7]:[7,9]);
      p.beginShape(); p.vertex(ax,ay); p.quadraticVertex(mx,my,bx,by); p.endShape();
      p.drawingContext.setLineDash([]);
    });

    /* Partikel auf den Kanten */
    parts.forEach(pt=>{
      pt.t=(pt.t+pt.sp)%1;
      const a=plants[pt.e.from], b=plants[pt.e.to];
      const ax=a.x*W, ay=a.y*H-a.r*.4, bx=b.x*W, by=b.y*H-b.r*.4;
      const mx=(ax+bx)/2, my=Math.min(ay,by)-34-Math.abs(bx-ax)*.08;
      const pos=qbez({x:ax,y:ay},{x:mx,y:my},{x:bx,y:by},pt.t);
      let h=105,s=60,br=85;
      if(pt.e.style==='tension'){h=HUES.red;s=70;br=72}
      if(pt.e.style==='gold'){h=HUES.yellow;s=78;br=95}
      if(pt.e.style==='dormant'){h=215;s=22;br=70}
      p.noStroke(); p.fill(h,s,br, 30+26*Math.sin(t*.004+pt.t*12));
      p.circle(pos.x,pos.y,pt.sz);
    });

    /*ambienter Blütenstaub */
    amb.forEach(a=>{
      a.x=(a.x+a.sp)%1.05;
      const ax=a.x*W, ay=a.y*H+Math.sin(t*.0006+a.ph)*14;
      p.noStroke(); p.fill(48,55,95, dark?14:16);
      p.circle(ax,ay,a.sz);
    });

    /* Pflanzen — nach Tiefe sortiert */
    const order=KEYS.slice().sort((k1,k2)=>plants[k1].y-plants[k2].y);
    buds=[];
    order.forEach(k=>drawPlant(k,W,H,t));

    /* Auswahl-Ring */
    if(selected){
      const s=plants[selected.key];
      p.noFill(); p.stroke(s.hue,70,88,80); p.strokeWeight(2.2);
      p.drawingContext.setLineDash([5,5]);
      p.circle(s.x*W, s.y*H-s.r*.35, s.r*2+26+4*Math.sin(t*.004));
      p.drawingContext.setLineDash([]);
    }
  };

  /* ── einzelne Pflanzen ── */
  function stem(px,py,h,sw,hue){ p.noFill(); p.stroke(hue||105,38,dark?52:46); p.strokeWeight(sw);
    p.beginShape(); p.vertex(px,py); p.quadraticVertex(px-4,py-h*.55,px,py-h); p.endShape(); }
  function leaves(px,py,h,n,hue){
    for(let i=0;i<n;i++){ const ly=py-h*(.25+i*.16), side=i%2===0?1:-1;
      p.fill(hue||105,46,dark?46:58,55); p.noStroke();
      p.ellipse(px+side*13,ly,19,8.5); } }
  function roots(px,py,r){
    p.stroke(28,22,dark?30:44,26); p.strokeWeight(1.2);
    for(let i=0;i<4;i++){ const a=-.4+i*.24, l=r*(.5+i*.16);
      p.line(px,py+3,px+Math.cos(a+.9)*l,py+3+l*.62); } }
  function label(px,py,txt,sub,emph){
    p.textAlign(p.CENTER); p.textSize(emph?11:10);
    p.stroke(dark?'rgba(26,24,20,.85)':'rgba(254,252,247,.9)'); p.strokeWeight(3.5);
    p.fill(dark?'rgba(232,226,212,.92)':'rgba(45,36,18,.82)');
    p.text(txt,px,py);
    if(sub){ p.textSize(8.2); p.fill(dark?'rgba(232,226,212,.5)':'rgba(45,36,18,.48)'); p.text(sub,px,py+11); }
    p.noStroke();
  }

  function drawPlant(k,W,H,t){
    const pl=plants[k], px=pl.x*W, py=pl.y*H, s=pl.s, ptn=pl.p;
    const hov=hovered===pl, sel=selected===pl;
    const pulse=1+.03*Math.sin(t*.002+px*.01);

    if(k==='kn'){ drawKnoten(px,py,W,H,t); label(px,py+64,'Entwicklungsknoten','Aussichtspunkt · kein Abschluss',true); return; }
    if(k==='bd'){ drawDormant(px,py,s,t); label(px,py+26,'Bewusst offen gelassen','schlafende Knospe'); return; }

    roots(px,py,pl.r*s);
    const hgt=(52+62*s)*(k==='b1'?1.12:1);

    if(ptn.pattern_type==='coordination'){ drawCoordination(px,py,hgt,s,t); label(px,py+20,'Teamprüfung','Interferenz · preserved'); return; }

    stem(px,py,hgt,sel?4.6:3.4, pl.type==='appearance'?105:105);
    leaves(px,py,hgt, ptn.pattern_type==='appearance'?4:3);

    const topy=py-hgt;
    if(ptn.pattern_type==='appearance'){
      const sal=ptn.phenomenon.salience||.4;
      const br=(12+22*sal)*s*pulse;
      glow(px,topy,br*3,HUES.blue,pulse);
      for(let i=0;i<6;i++){ const a=p.TWO_PI*i/6+t*.0003;
        p.fill(HUES.blue,58,90,sel?95:80); p.noStroke();
        p.ellipse(px+Math.cos(a)*br*.62, topy+Math.sin(a)*br*.62, br*.85, br*.55); }
      p.fill(48,70,98,95); p.circle(px,topy,br*.5);
      if(k==='b1'){ p.textAlign(p.CENTER); p.textSize(8); p.fill(HUES.blue,70,60,85); p.noStroke(); p.text('Sprachnotiz + Foto',px,topy-br-8); }
    }
    else if(ptn.pattern_type==='relation'){
      glow(px,topy,40*s,HUES.yellow,pulse);
      p.fill(HUES.yellow,72,96,92); p.noStroke(); p.circle(px,topy,13*s+4);
      for(let i=0;i<3;i++){ const a=t*.0011+i*p.TWO_PI/3, rr=20*s+8;
        const ox=px+Math.cos(a)*rr, oy=topy+Math.sin(a)*rr*.8;
        p.stroke(HUES.yellow,50,70,50); p.strokeWeight(1); p.drawingContext.setLineDash([2,3]);
        p.line(px,topy,ox,oy); p.drawingContext.setLineDash([]);
        p.noStroke(); p.fill(HUES.yellow,65,92,88); p.circle(ox,oy,7); }
      if(k==='b2'){ p.textAlign(p.CENTER); p.textSize(9); p.noStroke(); p.fill(HUES.yellow,80,60,90); p.text('✨ KI-Vorschlag (tisch/kimi)',px,topy-26*s-12); }
    }
    else if(ptn.pattern_type==='potential'){
      glow(px,topy,46*s,HUES.orange,pulse);
      p.fill(HUES.orange,62,88,90); p.noStroke(); p.circle(px,topy,12*s+4);
      const cs=ptn.candidate_space, domHue={mathematik:HUES.blue, sprache:HUES.red, werken:HUES.orange, biologie:HUES.green, keine:0};
      cs.entry_points.forEach((ep,i)=>{
        const a=-p.PI*.92+i*(p.PI*.84/(cs.entry_points.length-1));
        const rr=30*s+16, bx=px+Math.cos(a)*rr, by=topy+Math.sin(a)*rr*.9;
        const w=cs.domain_weights[ep.domain]||.3;
        p.stroke(105,30,50,40); p.strokeWeight(1); p.line(px,topy,bx,by);
        p.noStroke();
        const sat=ep.domain==='keine'?8:62, bri=ep.domain==='keine'?(dark?60:70):86;
        p.fill(ep.domain==='keine'?40:domHue[ep.domain], sat, bri, 92);
        p.ellipse(bx,by,(9+13*w)*pulse,(11+15*w)*pulse);
        buds.push({x:bx,y:by,r:13,ep,key:k});
      });
    }
    else if(ptn.pattern_type==='transition'){
      glow(px,topy,38*s,HUES.orange,pulse);
      /* von (unten, verblasst) → nach (oben, geöffnet) */
      p.fill(HUES.orange,26,70,40); p.ellipse(px-10*s,topy+16*s,17*s,10*s);
      p.fill(HUES.orange,66,90,92);
      p.ellipse(px,topy,15*s*pulse+5,20*s*pulse+6);
      p.fill(48,70,98,90); p.circle(px,topy-4*s,6);
      for(let i=0;i<3;i++){ const yy=topy+30-((t*.02+i*22)%56);
        p.noStroke(); p.fill(HUES.orange,60,85, 60*(1-(topy+32-yy)/56));
        p.triangle(px-4,yy+5, px+4,yy+5, px,yy-3); }
    }
    else if(ptn.pattern_type==='embodiment'){
      glow(px,topy,40*s,HUES.green,pulse);
      /* Materialtisch */
      p.stroke(28,30,dark?40:52); p.strokeWeight(2.4);
      p.line(px-20*s,topy+6,px-20*s,topy+22); p.line(px+20*s,topy+6,px+20*s,topy+22);
      p.strokeWeight(3.6); p.line(px-26*s,topy+6,px+26*s,topy+6);
      p.noStroke(); p.fill(48,80,92,95); p.rect(px-16*s,topy+1,20*s,4,2);      /* Zollstock */
      p.fill(HUES.red,60,80,90); p.rect(px+8*s,topy-1,9*s,7,2);                 /* Maßband */
      p.fill(HUES.green,52,84,88); p.circle(px,topy-12*s,13*s*pulse+4);
      /* Siegel: menschlich autorisiert */
      p.fill(HUES.green,70,60,90); p.textAlign(p.CENTER); p.textSize(8.4); p.noStroke();
      p.text('✓ autorisiert',px,topy-26*s-8);
    }
    else if(ptn.pattern_type==='orientation'){
      glow(px,topy,36*s,HUES.green,pulse);
      p.noStroke();
      for(let i=0;i<3;i++){ const ly=topy+8+i*10;
        p.fill(HUES.green,50,80,88); p.ellipse(px+13,ly,22,8);
        p.fill(HUES.green,60,60,90); p.triangle(px+26,ly-4,px+26,ly+4,px+34,ly); }
      p.fill(HUES.green,20,60,38); p.ellipse(px-14,topy+18,14,6); /* abgewandte Richtung, blass */
      p.fill(HUES.green,58,86,92); p.circle(px,topy,11*s+4);
    }
    else if(ptn.pattern_type==='renewal'){
      glow(px,topy,44*s,HUES.yellow,pulse);
      for(let i=0;i<7;i++){ const a=p.TWO_PI*i/7+t*.0005;
        p.fill(HUES.yellow,64,94,sel?95:84); p.noStroke();
        p.ellipse(px+Math.cos(a)*14*s, topy+Math.sin(a)*14*s, 13*s, 9*s); }
      p.fill(HUES.orange,70,92,95); p.circle(px,topy,9*s+3);
      /* Überraschung: Wirkung über das Nachbarkind */
      if(k==='b8'){
        const nx=px+34*s, ny=topy+18*s;
        stem(nx,py,hgt*.55,2.2); p.noStroke();
        p.fill(HUES.blue,55,88,80); p.ellipse(nx,ny,11,8); p.ellipse(nx+6,ny+3,9,7);
        p.fill(48,85,100, 55+35*Math.sin(t*.006));
        p.circle(px+17*s,topy+8*s,5+2*Math.sin(t*.008));
        p.textAlign(p.CENTER); p.textSize(7.6); p.fill(HUES.blue,60,55,85);
        p.text('Nachbarkind',nx,py+12);
      }
    }

    const proj=DATA.profile.projection_names[ptn.pattern_type];
    label(px,py+20,proj,TITLES[k].split(' — ')[0]);
  }

  function glow(x,y,r,hue,pulse){
    for(let g=3;g>0;g--){ p.fill(hue,52,92,(dark?9:6)/g); p.noStroke(); p.circle(x,y,r*g*.62*pulse); }
  }

  function drawCoordination(px,py,hgt,s,t){
    /* Drei Teilnehmer: Sabrina (Mitte, grün), Mark (blau), Ines (rot) */
    const sw=15*s;
    roots(px,py,34*s);
    stem(px-sw,py,hgt*.92,3.2); stem(px,py,hgt*1.05,3.6); stem(px+sw,py,hgt*.92,3.2);
    const mY=py-hgt*.92, iY=py-hgt*.92, sY=py-hgt*1.05;
    p.noStroke();
    p.fill(HUES.blue,60,88,92); p.circle(px-sw,mY,13*s+4);
    p.fill(HUES.red,60,86,92);  p.circle(px+sw,iY,13*s+4);
    p.fill(HUES.green,55,84,92);p.circle(px,sY,15*s+4);
    /* Spannungsfeld Mark↔Ines: zerreißt nicht, verbindet nicht */
    const zy=(mY+iY)/2-6;
    p.stroke(HUES.red,72,72,72); p.strokeWeight(1.6); p.noFill();
    p.beginShape();
    for(let i=0;i<=8;i++){ const xx=px-sw+8+i*((2*sw-16)/8);
      const jit=(i%2===0?1:-1)*(2.6+2.2*Math.sin(t*.011+i)); p.vertex(xx, zy+jit*(i>0&&i<8?1:0)); }
    p.endShape();
    /* Beide Lesarten — bleiben stehen */
    p.noStroke(); p.textAlign(p.CENTER); p.textSize(7.6);
    p.fill(HUES.blue,65,58,90); p.text('Größenvergleich',px-sw-6,mY-13*s-6);
    p.fill(HUES.red,65,58,90);  p.text('Erzählhandlung',px+sw+6,iY-13*s-6);
    p.fill(HUES.red,70,64, 60+30*Math.sin(t*.005)); p.textSize(9); p.text('⚡',px,zy-12);
    /* Teilnehmer-Gewichte */
    p.textSize(7); p.fill(dark?'rgba(232,226,212,.55)':'rgba(45,36,18,.5)');
    p.text('Sabrina · 0.4',px,sY-14*s-6);
  }

  function drawDormant(px,py,s,t){
    const breathe=1+.025*Math.sin(t*.0011);
    roots(px,py,20*s);
    p.noFill(); p.stroke(215,16,dark?36:42); p.strokeWeight(2.6);
    p.beginShape(); p.vertex(px,py); p.quadraticVertex(px-2,py-16*s,px,py-30*s); p.endShape();
    const by=py-34*s;
    /* schützender Ring */
    p.noFill(); p.stroke(215,30,60,34+10*Math.sin(t*.0016)); p.strokeWeight(1.3);
    p.drawingContext.setLineDash([3,5]); p.circle(px,by,52*s*breathe+18); p.drawingContext.setLineDash([]);
    /* Aura */
    for(let g=3;g>0;g--){ p.fill(215,40,60,(dark?10:7)/g); p.noStroke(); p.circle(px,by,(40+g*16)*s*breathe); }
    /* geschlossene Knospe */
    p.noStroke(); p.fill(215,26,dark?30:38,96);
    p.ellipse(px,by,17*s*breathe,24*s*breathe);
    p.fill(215,30,dark?24:30,90);
    p.ellipse(px-4*s,by-2*s,7*s,17*s*breathe); p.ellipse(px+4*s,by-2*s,7*s,17*s*breathe);
    /* Mond */
    p.fill(48,14,94,80); p.circle(px+16*s,by-20*s,11);
    p.fill(dark?38:44, dark?18:16, dark?10:99, 92); p.circle(px+19*s,by-22*s,9);
  }

  function drawKnoten(px,py,W,H,t){
    /* Aussichtspunkt: Plattform, Fernrohr, Flaggen der zwei Ketten, offene Wege */
    const pl=plants.kn;
    /* Plattform */
    p.stroke(28,34,dark?36:46); p.strokeWeight(3);
    p.line(px-16,py+30,px-16,py+2); p.line(px+16,py+30,px+16,py+2);
    p.strokeWeight(4); p.line(px-24,py+2,px+24,py+2);
    p.strokeWeight(1.6); p.line(px-22,py-8,px+22,py-8);
    for(let i=-2;i<=2;i++) p.line(px+i*10,py+2,px+i*10,py-8);
    /* Fernrohr — schaut in offene Weite */
    p.strokeWeight(3); p.stroke(215,20,dark?56:44);
    p.line(px+2,py-8,px+20,py-22); p.circle(px+22,py-24,7);
    /* Flaggen: Kette A + Kette B */
    p.strokeWeight(1.8); p.stroke(28,30,40);
    p.line(px-24,py+2,px-24,py-26); p.line(px+24,py+2,px+24,py-26);
    p.noStroke();
    p.fill(HUES.blue,66,86,94); p.triangle(px-24,py-26,px-24,py-17,px-38,py-21.5);
    p.fill(HUES.orange,68,88,94); p.triangle(px+24,py-26,px+24,py-17,px+38,py-21.5);
    p.textAlign(p.CENTER); p.textSize(7.4);
    p.fill(HUES.blue,70,55,90); p.text('Kette A',px-31,py-29);
    p.fill(HUES.orange,70,55,90); p.text('Kette B',px+31,py-29);
    /* Wegweiser: neue Fragen */
    const bob=2.4*Math.sin(t*.0018);
    p.stroke(28,30,44); p.strokeWeight(2); p.line(px-40,py+18,px-40,py-2);
    p.noStroke(); p.fill(48,74,94,95); p.rect(px-58,py-14+bob,36,13,3);
    p.fill(HUES.red,70,40,95); p.textSize(8.6); p.textAlign(p.CENTER);
    p.text('neue Fragen',px-40,py-4.5+bob);
    /* Pfad weiter in die offene Weite — kein Abschluss */
    p.noFill(); p.stroke(48,50,80,42); p.strokeWeight(1.6);
    p.drawingContext.setLineDash([4,7]);
    p.beginShape(); p.vertex(px+26,py-26);
    p.bezierVertex(px+52,py-52, px+80,py-64, px+W*.06,py-84); p.endShape();
    p.drawingContext.setLineDash([]);
    p.noStroke(); p.textSize(10); p.fill(48,60,60,70);
    p.text('…',px+W*.062+6,py-88);
  }

  /* ── Interaktion ── */
  function hit(mx,my){
    const W=p.width,H=p.height;
    /* Aussichtspunkt zuerst (große Fläche) */
    const k=plants.kn, kx=k.x*W, ky=k.y*H;
    if(mx>kx-70&&mx<kx+70&&my>ky-40&&my<ky+52) return k;
    let best=null,bd=1e9;
    KEYS.forEach(key=>{
      if(key==='kn')return;
      const pl=plants[key], px=pl.x*W, py=pl.y*H-pl.r*.3;
      const d=Math.hypot(mx-px,my-py);
      if(d<pl.r+16 && d<bd){bd=d;best=pl;}
    });
    return best;
  }
  p.mouseMoved=()=>{
    if(!DATA)return;
    const f=hit(p.mouseX,p.mouseY);
    if(f!==hovered){
      hovered=f; p.cursor(f?'pointer':'default');
      const tt=document.getElementById('tt');
      if(f){
        const proj=DATA.profile.projection_names[f.p.pattern_type];
        document.getElementById('ttn').textContent=(f.key==='kn'?'Aussichtspunkt':proj)+' · '+TITLES[f.key];
        document.getElementById('ttd').textContent=
          'Geltungsdeckel: '+f.p.claim_ceiling+(f.p.contested?' · umstritten':'')+(f.key==='bd'?' · rejected (geschützt)':'');
        tt.style.left=(p.mouseX+16)+'px'; tt.style.top=(p.mouseY-46)+'px'; tt.classList.add('on');
      } else tt.classList.remove('on');
    } else if(f){
      const tt=document.getElementById('tt');
      tt.style.left=(p.mouseX+16)+'px'; tt.style.top=(p.mouseY-46)+'px';
    }
    /* Knospen-Tooltips im Möglichkeitsraum */
    if(f&&f.key==='b3'){
      const b=buds.find(b=>Math.hypot(p.mouseX-b.x,p.mouseY-b.y)<b.r+4);
      const tt=document.getElementById('tt');
      if(b){
        document.getElementById('ttn').textContent=b.ep.domain+' · Aufwand '+b.ep.cost;
        document.getElementById('ttd').textContent=b.ep.suggestion+' ('+b.ep.reversibility+')';
        tt.style.left=(p.mouseX+16)+'px'; tt.style.top=(p.mouseY-46)+'px'; tt.classList.add('on');
      }
    }
  };
  p.mouseClicked=()=>{ if(hovered&&DATA){ selected=hovered; openPanel(hovered.key); } };
};

/* ═══════════════ PANEL-RENDERER ═══════════════ */
function esc(s){ return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function fmtDate(iso){ if(!iso)return''; const d=new Date(iso); return d.toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric'}); }
function sec(title,inner){ return '<div class="sec"><h3>'+title+'</h3>'+inner+'</div>'; }
function chips(arr,cls){ return (arr||[]).map(x=>'<span class="chip '+(cls||'')+'">'+esc(x)+'</span>').join(''); }
function list(arr){ return '<ul>'+((arr||[]).map(x=>'<li>'+esc(x)+'</li>')).join('')+'</ul>'; }
function bar(frac,color){ return '<div class="bar"><i style="width:'+Math.round(frac*100)+'%;background:'+color+'"></i></div>'; }
function ceilingBadge(c){
  const m={erscheinung:'b-blue',perspektiv:'b-y',epistemisch:'b-o',handlung:'b-r'};
  return '<span class="badge '+(m[c]||'b-n')+'">Deckel: '+esc(c)+'</span>';
}
function provCard(p){
  const pv=p.provenance;
  return '<div class="prov"><b>Provenienz (Pflicht)</b><br>'+
    'Quelle: <b>'+esc(pv.source)+'</b><br>'+
    'Erzeugt von: <b>'+esc(pv.generator)+'</b> · '+esc(pv.generation_conditions)+'<br>'+
    '<span class="mono">id: '+esc(p.id.slice(0,8))+'… · status: '+esc(p.status)+(p.sealed_by&&p.sealed_by!=='unsealed'?' · sealed_by: '+esc(p.sealed_by):'')+'</span></div>';
}
function nextBtn(k){
  const n=NEXT[k]; if(!n) return '';
  const t=n==='b1'?'Weiter zu Kette B (Stallbox)':'Weiter: '+TITLES[n];
  return '<button class="prim-btn'+(n==='b5'?' r':'')+'" onclick="openPanel(\''+n+'\')">'+esc(t)+' →</button>';
}
function panelHead(k){
  const p=P[k], proj=DATA.profile.projection_names[p.pattern_type];
  const colors={appearance:HEX.blue,relation:'#d4a800',potential:HEX.orange,transition:HEX.orange,
    coordination:HEX.red,embodiment:HEX.green,orientation:HEX.green,renewal:'#d4a800',dormancy:'#5a5448'};
  const chain=k.startsWith('a')?'Kette A':(k==='kn'?'Kette A + B':'Kette B');
  return '<button class="close" onclick="closePnl()">×</button>'+
    '<span class="pchip" style="background:'+(colors[p.pattern_type]||'#888')+'">'+esc(proj)+'</span>'+
    '<h2>'+esc(TITLES[k])+'</h2>'+
    '<div class="meta">'+ceilingBadge(p.claim_ceiling)+
    '<span class="badge b-n">'+esc(p.status)+'</span>'+
    (p.contested?'<span class="badge b-o">contested</span>':'')+
    (k==='bd'?'<span class="badge b-r">rejected</span>':'')+
    '<span>'+esc(fmtDate(p.timestamp))+'</span><span>·</span><span>'+chain+'</span></div>';
}

function renderPanel(k){
  const p=P[k];
  switch(p.pattern_type){
    case 'appearance': return renderAppearance(k,p);
    case 'relation': return renderRelation(k,p);
    case 'potential': return renderPotential(k,p);
    case 'transition': return renderTransition(k,p);
    case 'coordination': return renderCoordination(k,p);
    case 'dormancy': return renderDormancy(k,p);
    case 'embodiment': return renderEmbodiment(k,p);
    case 'orientation': return renderOrientation(k,p);
    case 'renewal': return renderRenewal(k,p);
  }
  return '';
}

function renderAppearance(k,p){
  const ph=p.phenomenon, sf=p.selection_filters;
  return panelHead(k)+
    sec('👁 Phänomen — die reine Beobachtung',
      '<div class="quote">'+esc(ph.raw_observation)+'</div>'+
      '<div class="kv"><span class="k">Medium</span><span>'+esc(ph.medium)+'</span></div>'+
      '<div class="kv"><span class="k">Dauer</span><span>'+esc(ph.duration)+'</span></div>'+
      '<div class="kv"><span class="k">Salienz</span><span>'+ph.salience+'</span></div>'+bar(ph.salience,HEX.blue))+
    '<button class="prim-btn" onclick="openBridge(\''+k+'\')">⇄ Beobachtung ↔ Deutung ansehen — die Übersetzungs-Brücke</button>'+
    sec('🔍 Aktive Auswahl-Filter',chips(sf.active_filters,'chip-b')+
      '<div class="kv" style="margin-top:6px"><span class="k">Standpunkt</span><span>'+esc(sf.observer_standpoint)+'</span></div>')+
    sec('🙈 Ausgeblendet durch Filter',chips(sf.excluded_by_filter,'chip-r'))+

    sec('🕶 Bekannte blinde Flecken',list(p.known_blindspots))+

}

function renderRelation(k,p){
  const ev=p.evidence, pr=p.properties;
  const st=reviewStates[k]||'unpr';
  const elems=p.elements.map(e=>{
    const isRef=e.type==='referenz';
    return '<div class="rc" style="margin-bottom:6px"><div class="rc-head"><span class="rc-title">'+esc(e.role)+'</span><span class="badge '+(isRef?'b-b':'b-y')+'">'+esc(e.type)+'</span></div><div class="mono">'+esc(e.id.startsWith('bildungsplan')?e.id:e.id.slice(0,13)+'…')+'</div></div>';
  }).join('');
  return panelHead(k)+
    sec('🔗 Elemente dieser Verbindung',elems)+
    sec('⚖ Eigenschaften der Verbindung',
      '<div class="kv"><span class="k">Typ</span><span>'+esc(p.relation_type)+'</span></div>'+
      '<div class="kv"><span class="k">Stärke</span><span>'+pr.strength+'</span></div>'+bar(pr.strength,HEX.yellow)+
      '<div class="kv"><span class="k">Symmetrie</span><span>'+esc(pr.symmetry)+'</span></div>'+
      '<div class="kv"><span class="k">Stabilität</span><span>'+esc(pr.stability)+'</span></div>'+
      '<div class="kv"><span class="k">Reversibilität</span><span>'+esc(pr.reversibility)+'</span></div>')+
    sec('🧾 Evidenz',
      '<div class="kv"><span class="k">Level</span><span class="badge b-y">'+esc(ev.level)+'</span></div>'+
      '<div class="kv"><span class="k">Quellen</span><span class="mono">'+ev.sources.map(s=>esc((KEY_BY_ID[s]||s).slice(0,8))).join(', ')+'</span></div>')+
    sec('🧯 Gegen-Evidenz — bleibt sichtbar',
      '<div class="quote q-r" style="font-size:.8rem">'+(ev.counter_evidence||[]).map(esc).join('<br>')+'</div>')+
    sec('✓ Bezug prüfen — Ihr Urteil',
      '<div class="rc"><div class="rc-head"><span class="rc-title">Trägt diese Verbindung?</span><span class="rc-status rc-st'+(st==='ok'?1:st==='lim'?2:st==='no'?3:0)+'" id="rvs-'+k+'">'+(st==='ok'?'✓ Tragfähig':st==='lim'?'⚠ Begrenzt':st==='no'?'✗ Abgelehnt':'ungeprüft')+'</span></div>'+
      '<div class="rc-acts"><button class="rc-btn ok" onclick="verdict(\''+k+'\',\'ok\')">✓ Tragfähig</button>'+
      '<button class="rc-btn lim" onclick="verdict(\''+k+'\',\'lim\')">⚠ Begrenzt</button>'+
      '<button class="rc-btn no" onclick="verdict(\''+k+'\',\'no\')">✗ Ablehnen</button></div></div>')+
    provCard(p)+nextBtn(k);
}

function renderPotential(k,p){
  const cs=p.candidate_space, c=p.constraints;
  const domColor={mathematik:HEX.blue,sprache:HEX.red,werken:HEX.orange,biologie:HEX.green,keine:'#8d8474'};
  const weights=Object.entries(cs.domain_weights).map(([d,w])=>
    '<div class="kv"><span class="k" style="color:'+(domColor[d]||'inherit')+'">'+esc(d)+'</span><span>'+w+'</span></div>'+bar(w,domColor[d]||'#999')).join('');
  const eps=cs.entry_points.map((e,i)=>
    '<div class="ep'+(selEntry===k+i?' sel':'')+'" onclick="pickEntry(\''+k+'\','+i+',this)">'+
    '<span class="dot" style="background:'+(domColor[e.domain]||'#999')+'"></span>'+
    '<div><div class="t">'+esc(e.domain)+' <span class="badge b-n">Aufwand: '+esc(e.cost)+'</span> <span class="badge b-g">'+esc(e.reversibility)+'</span></div>'+
    '<div class="d">'+esc(e.suggestion)+'</div></div></div>').join('');
  const cons=[['strukturell',c.structural],['biografisch',c.biographical],['institutionell',c.institutional],
    ['sprachlich',c.linguistic],['affektiv',c.affective],['machtbezogen',c.power_related]];
  return panelHead(k)+
    sec('🌐 Domänen-Gewichte',weights)+
    sec('🚪 Einstiegspunkte — antippen zum Auswählen',eps+
      '<div id="epSel" style="display:none"><button class="prim-btn o" onclick="openPanel(\'b4\')">Als nächsten Schritt prüfen →</button></div>')+
    sec('🚧 Constraints — was dagegen spricht',
      cons.map(([name,arr])=>arr&&arr.length?'<div class="kv" style="align-items:flex-start"><span class="k">'+esc(name)+'</span><span>'+arr.map(esc).join('<br>')+'</span></div>':'').join(''))+
    sec('🕳 Abwesende Dimensionen — Pflichtfeld',list(p.absent_dimensions))+
    sec('❓ Warum abwesend',list(p.why_absent)+
      '<p style="font-size:.7rem;color:var(--text2);margin-top:4px">Ein Möglichkeitsraum ohne benannte Lücken behauptet Ausschöpfung.</p>')+
    provCard(p)+nextBtn(k);
}

function renderCoordination(k,p){
  const parts=p.participants.map(pt=>{
    const col=pt.perspective_id.includes('mark')?HEX.blue:pt.perspective_id.includes('ines')?HEX.red:HEX.green;
    const name=pt.perspective_id.split(':')[1];
    return '<div style="background:var(--bg2);border-radius:12px;padding:10px 12px;border-top:3px solid '+col+'">'+
      '<div style="font-weight:700;font-size:.8rem;text-transform:capitalize">'+esc(name)+'</div>'+
      '<div style="font-size:.7rem;color:var(--text2)">'+esc(pt.role)+'</div>'+
      '<div style="font-size:.66rem;color:var(--text2);margin-top:3px">Gewicht '+pt.weight+(pt.veto_power?' · Veto möglich':'')+'</div>'+bar(pt.weight,col)+'</div>';

function checkClaim(){
  const inp=document.getElementById('claimIn').value.trim();
  const res=document.getElementById('claimRes');
  if(!inp){ res.className='claim-res cr-idle'; res.innerHTML='Noch keine Eingabe — die Prüfung läuft live, während Sie tippen.'; return; }
  const hits=[];
  DATA.profile.forbidden_claims.forEach(f=>{
    let re; try{ re=new RegExp(f.pattern,'i'); }catch(e){ return; }
    const m=re.exec(inp);
    if(m) hits.push({f, m});
  });
  if(hits.length===0){
    res.className='claim-res cr-ok';
    res.innerHTML='<b style="color:var(--green);font-size:1rem">✓ Keine verbotene Behauptungsform erkannt.</b><br>'+
      '<span style="font-size:.8rem">Prüfen Sie dennoch: Auf welcher <b>Geltungsstufe</b> darf diese Aussage stehen? '+
      'Eine Beobachtung deckelt bei <b>erscheinung</b>, eine Verbindung bei <b>perspektiv</b>. Nur die Teamprüfung erreicht <b>epistemisch</b> — und keine Stufe ersetzt die menschliche Autorisierung einer Handlung.</span>';
  }else{
    res.className='claim-res cr-bad';
    res.innerHTML='<b style="color:var(--red);font-size:1rem">✗ VERBOTEN — '+hits.length+' Behauptungsform'+(hits.length>1?'en':'')+' erkannt.</b>'+
      hits.map(h=>{
        const before=esc(inp.slice(0,h.m.index)), match=esc(h.m[0]), after=esc(inp.slice(h.m.index+h.m[0].length));
        return '<div class="vcard"><b>'+esc(h.f.name)+'</b> — '+esc(h.f.why)+
          '<div style="margin-top:5px">'+before+'<mark>'+match+'</mark>'+after+'</div></div>';
      }).join('')+
      '<div style="font-size:.76rem;margin-top:8px;color:var(--text2)">Das System verwaltet <b>Übergänge</b>, keine Eigenschaften. Beschreiben Sie, was passiert ist — nicht, was das Kind „ist".</div>';
  }
}

/* ═══════════════ VOICE-MOCKUP ═══════════════ */
let voiceState='idle', voiceTimer=null, voiceRAF=null, voiceT0=0, waveCtx=null, waveBars=[];
const TRANSCRIPT=[
  {kind:'obs', tag:'BEOBACHTUNG', text:'Sie stellt das Pferdemodell in die selbstgebaute Stallbox, sagt „das geht nicht", nimmt es wieder heraus, hält das Modell neben die Seitenwand und beginnt die Wand abzubauen.'},
  {kind:'deut', tag:'DEUTUNG DER BEGLEITERIN', text:'Ich vermute, sie hat geprüft, ob das Modell passt — ein möglicher Bezug zu Größen und Messen. Das ist meine Lesart, nicht ihre Aussage.'},
  {kind:'kind', tag:'KIND-PERSPEKTIVE', text:''}
];
function openVoice(){
  renderVoice(); document.getElementById('ovlVoice').classList.add('on');
  requestAnimationFrame(()=>{ const c=document.getElementById('waveCanvas'); if(c){ c.width=c.parentElement.clientWidth; c.height=86; waveCtx=c.getContext('2d'); }});
}
function renderVoice(){
  document.getElementById('ovlVoiceC').innerHTML=
    '<button class="close" onclick="stopVoice();closeOvl(\'ovlVoice\')">×</button>'+
    '<h2>🎙 Beobachtung aufnehmen</h2>'+
    '<div class="sub">Simulierte Sprachnotiz einer Lernbegleiterin — wie im Original: aufnehmen, transkribieren, und dabei <b>Beobachtung von Deutung trennen</b>.</div>'+
    '<div class="mic-zone">'+
      '<button class="mic-btn" id="micBtn" onclick="toggleRec()">🎙</button>'+
      '<div class="rec-timer" id="recTimer">Tippen zum Aufnehmen</div>'+
      '<div class="wave-wrap"><canvas id="waveCanvas"></canvas></div>'+
    '</div>'+
    '<div id="voiceOut"></div>';
  waveBars=new Array(56).fill(4);
}
function toggleRec(){
  if(voiceState==='idle'||voiceState==='done'){ startRec(); } else { stopRec(); }
}
function startRec(){
  voiceState='rec'; voiceT0=Date.now();
  document.getElementById('micBtn').classList.add('rec');
  document.getElementById('micBtn').textContent='⏹';
  drawWave();
  voiceTimer=setInterval(()=>{
    const s=Math.floor((Date.now()-voiceT0)/1000);
    document.getElementById('recTimer').innerHTML='<span class="rec-dot"></span>Aufnahme läuft · 0:'+String(s).padStart(2,'0');
    if(s>=6) stopRec();
  },250);
}
function stopRec(){
  if(voiceState!=='rec')return;
  voiceState='transcribing';
  clearInterval(voiceTimer); cancelAnimationFrame(voiceRAF);
  const b=document.getElementById('micBtn'); b.classList.remove('rec'); b.textContent='🎙';
  document.getElementById('recTimer').textContent='Transkribiere …';
  if(waveCtx){ waveCtx.clearRect(0,0,waveCtx.canvas.width,86); }
  setTimeout(revealTranscript,900);
}
function stopVoice(){ clearInterval(voiceTimer); cancelAnimationFrame(voiceRAF); voiceState='idle'; }
function drawWave(){
  if(!waveCtx)return;
  const w=waveCtx.canvas.width, h=86;
  waveCtx.clearRect(0,0,w,h);
  const bw=w/waveBars.length;
  waveBars.forEach((v,i)=>{
    const target=voiceState==='rec'?8+Math.random()*54:4;
    waveBars[i]=v+(target-v)*.3;
    const bh=waveBars[i];
    waveCtx.fillStyle=voiceState==='rec'?'rgba(189,24,42,.75)':'rgba(120,110,90,.25)';
    waveCtx.fillRect(i*bw+1,(h-bh)/2,bw-2,bh);
  });
  voiceRAF=requestAnimationFrame(drawWave);
}
function revealTranscript(){
  voiceState='done';
  document.getElementById('recTimer').textContent='Fertig — 0:06 · Sprachnotiz + Foto';
  const out=document.getElementById('voiceOut');
  out.innerHTML=
    '<div style="display:flex;gap:6px;margin:12px 0 8px;flex-wrap:wrap">'+
      '<span class="chip chip-b">■ Beobachtung</span><span class="chip chip-y">■ Deutung</span><span class="chip chip-n">▢ nicht erhoben</span>'+
    '</div>'+
    '<div id="segWrap"></div>'+
    '<button class="prim-btn" onclick="closeOvl(\'ovlVoice\');openPanel(\'b1\')">Als Begegnung b1 ansehen — mit allen Filtern und Lücken →</button>';
  const wrap=document.getElementById('segWrap');
  /* Segment 1 + 2 Wort für Wort, Segment 3 bleibt bewusst leer */
  let segIdx=0, wordIdx=0, div=null;
  function words(t){ return t.split(' '); }
  function nextSeg(){
    if(segIdx>=TRANSCRIPT.length)return;
    const seg=TRANSCRIPT[segIdx];
    div=document.createElement('div');
    div.className='seg seg-'+seg.kind;
    div.innerHTML='<span class="seg-tag">'+seg.tag+'</span><div class="seg-text"></div>';
    wrap.appendChild(div);
    if(seg.kind==='kind'){
      div.querySelector('.seg-text').innerHTML='<span style="opacity:.75">— Feld bewusst leer —</span><br><span style="font-size:.72rem">Die Kindperspektive wurde nicht erhoben. Es gab keine Rückfrage. Diese Lücke wird dokumentiert, statt sie mit Vermutungen zu füllen. (potentially_missed, Pflichtfeld)</span>';
      segIdx++; nextSeg(); return;
    }
    wordIdx=0; step();
    function step(){
      const ws=words(seg.text);
      if(wordIdx>=ws.length){ segIdx++; setTimeout(nextSeg,260); return; }
      wordIdx++;
      div.querySelector('.seg-text').textContent=ws.slice(0,wordIdx).join(' ');
      setTimeout(step,46);
    }
  }
  nextSeg();
}

function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2800); }
